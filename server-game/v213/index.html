<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GMWW V2.13</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <section class="page active" id="home"><div class="placeholder"><span>🏠</span><b>Trang Chủ</b><small>Sẽ xây dựng sau.</small></div></section>
    <section class="page" id="members"><div class="placeholder"><span>👥</span><b>Thành Viên</b><small>Sẽ xây dựng sau.</small></div></section>
    <section class="page" id="start"><div class="placeholder"><span>▶</span><b>Bắt Đầu</b><small>Sẽ xây dựng sau.</small></div></section>

    <section class="page" id="library">
      <div id="libraryHome">
        <nav class="library-tabs">
          <button class="libtab active" data-lib="cards">🃏<b>Lá Bài</b></button>
          <button class="libtab" data-lib="artifacts">✦<b>ARTIFACTS</b></button>
          <button class="libtab" data-lib="actions">⚡<b>Hành Động</b></button>
          <button class="libtab" data-lib="effects">◉<b>Hiệu Ứng</b></button>
          <button class="libtab" data-lib="themes">🌊<b>Chủ Đề</b></button>
          <button class="libtab" data-lib="audio">🔊<b>Âm Thanh</b></button>
        </nav>

        <section class="libpane active" id="lib-cards">
          <div class="filter-row" data-filter-kind="cards">
            <button class="filter" data-filter="star">★ Thường dùng</button>
            <button class="filter active" data-filter="all">Tất cả</button>
            <button class="filter" data-filter="hidden">◌ Tạm ẩn</button>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </section>

        <section class="libpane" id="lib-artifacts">
          <div class="filter-row" data-filter-kind="artifacts">
            <button class="filter" data-filter="star">★ Thường dùng</button>
            <button class="filter active" data-filter="all">Tất cả</button>
            <button class="filter" data-filter="hidden">◌ Tạm ẩn</button>
          </div>
          <div class="card-grid" id="artifactGrid"></div>
        </section>

        <section class="libpane" id="lib-actions">
          <div class="section-tools">
            <div class="seg" id="actionKindSeg"><button class="active" data-action-kind="role">Lá Bài</button><button data-action-kind="artifacts">ARTIFACTS</button></div>
            <input class="search" id="actionSearch" placeholder="Tìm Hành Động">
          </div>
          <div class="compact-box-grid" id="actionGrid"></div>
        </section>

        <section class="libpane" id="lib-effects">
          <div class="section-tools"><input class="search" id="effectSearch" placeholder="Tìm Hiệu Ứng"></div>
          <div class="compact-box-grid" id="effectGrid"></div>
        </section>

        <section class="libpane" id="lib-themes">
          <div class="theme-toolbar">
            <div class="seg" id="themeSeg"></div>
            <button class="icon-add" id="addTheme" aria-label="Thêm Chủ Đề">＋</button>
          </div>
          <div id="themeUiSections"></div>
          <section class="theme-section theme-section-pinned">
            <div class="theme-section-head"><h3>🃏 Artwork Lá Bài</h3></div>
            <div id="themeCardRows"></div>
          </section>
          <section class="theme-section theme-section-pinned">
            <div class="theme-section-head"><h3>✦ Artwork ARTIFACTS</h3></div>
            <div id="themeArtifactRows"></div>
          </section>
        </section>

        <section class="libpane" id="lib-audio">
          <div class="seg audio-seg" id="audioKindSeg">
            <button class="active" data-audio-kind="cards">Lá Bài</button>
            <button data-audio-kind="artifacts">ARTIFACTS</button>
            <button data-audio-kind="actions">Hành Động</button>
            <button data-audio-kind="system">Hệ Thống</button>
          </div>
          <div class="audio-list" id="audioGrid"></div>
        </section>
      </div>

      <div id="entityEditor" class="card-editor hidden">
        <div class="editor-bar">
          <div class="face-switch"><button class="active" data-face="front">Mặt Player Web</button><button data-face="back">Cài đặt</button></div>
        </div>

        <div class="face active" id="entityFront">
          <article class="player-card village" id="playerCard">
            <div class="card-zone card-zone-head">
              <div class="player-title" id="playerName"></div>
              <div class="player-faction-badge" id="playerFactionBadge"></div>
            </div>
            <div class="card-zone card-zone-art"><img id="playerDisplay" alt=""></div>
            <div class="card-zone card-zone-info" id="playerInformation"></div>
          </article>
        </div>

        <div class="face" id="entityBack">
          <div class="settings-card">
            <h3 id="entitySettingsTitle">Cài đặt Lá Bài</h3>
            <div class="form-grid">
              <label class="full">Tên<input id="entityName"></label>
              <div class="full field-block" id="factionBlock"><span>Phe mặc định</span><div class="faction-seg" id="factionSeg">
                <button data-faction="village">🍃 Phe Dân Làng</button>
                <button data-faction="wolf"><span class="red-paw">🐾</span> Phe Sói</button>
                <button data-faction="third">🔥 Phe Ba</button>
              </div></div>
              <label class="full">Thông tin<textarea id="entityInformation"></textarea></label>
              <label id="livesField">Số mạng<input id="entityLives" type="number" min="1" max="99" value="1"></label>
            </div>

            <div class="subhead">Tuỳ chọn của Lá</div>
            <div class="check-grid" id="roleFlagGrid">
              <label class="check"><input type="checkbox" id="flagUseDay"><span>Hoạt động Ban Ngày</span></label>
              <label class="check"><input type="checkbox" id="flagUseNight"><span>Hoạt động Ban Đêm</span></label>
              <label class="check"><input type="checkbox" id="flagNightImmune"><span>Bất tử Ban Đêm</span></label>
              <label class="check"><input type="checkbox" id="flagAllowMultipleActions"><span>Cho phép nhiều Hành Động trong cùng lượt</span></label>
              <label class="check"><input type="checkbox" id="flagPassive"><span>Lá có Nội tại / Passive</span></label>
              <label class="check"><input type="checkbox" id="flagSoloWolfOnly"><span>Chỉ khi là Sói đơn độc</span></label>
            </div>

            <div class="form-grid compact-fields">
              <label class="full">Điều kiện thắng riêng<textarea id="winCondition" placeholder="Để trống nếu thắng theo Phe"></textarea></label>
            </div>

            <div class="subhead">Rule nâng cao của Lá</div>
            <div class="advanced-rule">
              <label class="check"><input type="checkbox" id="passiveRuleEnabled"><span>Dùng Passive Rule</span></label>
              <div class="form-grid compact-fields"><label class="full">Kích hoạt Passive<select id="passiveRuleType">
                <option value="stake_survive">Bị Treo Cổ lần đầu</option>
                <option value="stake_revenge">Chết do Treo Cổ</option>
                <option value="source_death">Nguồn chết</option>
              </select></label></div>
            </div>
            <div class="advanced-rule">
              <label class="check"><input type="checkbox" id="groupGateEnabled"><span>Dùng Group Action Gate</span></label>
              <div class="form-grid compact-fields">
                <label class="full">Gate Hành Động<select id="groupGateAction"></select></label>
                <label class="full">Gate chặn khi<div class="inline-checks">
                  <label class="check small"><input type="checkbox" id="gateExpelled"><span>Bị Đuổi</span></label>
                  <label class="check small"><input type="checkbox" id="gateBlocked"><span>Bị Chặn/Đóng Băng</span></label>
                </div></label>
              </div>
            </div>

            <div class="artifact-only hidden" id="artifactSpecific">
              <div class="subhead">Tuỳ chọn riêng ARTIFACTS</div>
              <div class="check-grid">
                <label class="check"><input type="checkbox" id="artifactOwnerSelection"><span>GM chọn chủ sở hữu</span></label>
                <label class="check"><input type="checkbox" id="artifactPersistentOwner"><span>Giữ chủ sở hữu xuyên ván</span></label>
                <label class="check"><input type="checkbox" id="artifactRevealFollow"><span>Chỉ hiển thị mục tiêu theo dõi</span></label>
              </div>
              <div class="form-grid compact-fields">
                <label>Thức cùng Vai Trò<select id="artifactWakeRole"></select></label>
                <label>Thức cùng Hành Động<select id="artifactWakeAction"></select></label>
              </div>
            </div>
          </div>

          <div class="settings-card">
            <div class="settings-title"><h3>Cài đặt Hành Động trên Lá</h3><button class="icon-add" id="addFunction" aria-label="Thêm Hành Động">＋</button></div>
            <div id="functionList"></div>
          </div>

          <div class="editor-actions">
            <button class="secondary" id="backEntity">Quay Về</button>
            <button class="primary" id="saveEntity">Lưu</button>
            <button class="danger" id="deleteEntity">Xoá</button>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="settings"><div class="placeholder"><span>⚙</span><b>Cài Đặt</b><small>Sẽ xây dựng sau.</small></div></section>
  </main>

  <nav id="bottomNav">
    <button class="nav active" data-page="home"><span>⌂</span><b>Trang Chủ</b></button>
    <button class="nav" data-page="members"><span>♟</span><b>Thành Viên</b></button>
    <button class="nav start" data-page="start"><i>▶</i><b>Bắt Đầu</b></button>
    <button class="nav" data-page="library"><span>▣</span><b>Thư Viện</b></button>
    <button class="nav" data-page="settings"><span>⚙</span><b>Cài Đặt</b></button>
  </nav>
</div>

<div class="sheet hidden" id="editSheet">
  <div class="sheet-card"><div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetClose">×</button></div><div id="sheetBody"></div><div class="button-row"><button class="secondary" id="sheetCancel">Hủy</button><button class="primary" id="sheetSave">Lưu</button></div></div>
</div>

<script src="artwork.js"></script>
<script src="sea-artwork.js"></script>
<script src="app.js"></script>
</body>
</html>
