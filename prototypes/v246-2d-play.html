<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GMWW 2D — bản mẫu</title><style>
:root{font-family:system-ui,sans-serif;color:#f4fbff;background:#06223d}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:900px;margin:auto;padding:12px}.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}.hud button,.toolbar button{border:1px solid #b9e5ef;background:#103e62;color:white;border-radius:18px;padding:10px 15px}.scene{position:relative;min-height:400px;border:3px solid #e4c77a;border-radius:25px;overflow:hidden;background:linear-gradient(#64cce9 0%,#b1eced 44%,#f5d5a2 45%,#bd976b 100%);transition:background .35s}.scene.night{background:linear-gradient(#081e49,#184b72 48%,#343954 49%,#19324a)}.scene:before{content:'☁️　☀️　☁️';position:absolute;left:5%;top:8%;font-size:40px}.scene.night:before{content:'✦　🌙　✦'}.arena{position:relative;height:360px}.player{position:absolute;transform:translate(-50%,-50%);background:transparent;color:white;border:0;min-width:64px;min-height:64px;text-shadow:0 2px 5px #001a35}.player span{display:block;font-size:39px;filter:drop-shadow(0 4px 4px #002)}.player b{display:block;border-radius:12px;background:#072744e8;padding:3px 5px}.player:focus-visible,.player.selected{outline:3px solid #fff5a3;border-radius:16px}.fountain{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:52px}.panel{margin-top:10px;border:2px solid #d9bb70;background:#0c3456;border-radius:20px;padding:15px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.status{color:#c9f3ff}.cards{position:relative;height:350px;max-width:340px;margin:16px auto}.card{position:absolute;top:0;width:64%;height:295px;border:3px solid #ebc977;border-radius:19px;background:linear-gradient(155deg,#116fa3,#12355c 65%,#b38b43);box-shadow:0 12px 24px #0018;color:white;padding:16px;text-align:center;transition:transform .25s, left .25s;left:5%;}.card.back{left:33%;transform:translateY(22px) rotate(10deg)}.card.front{left:7%;transform:translateY(0) rotate(-5deg);z-index:2}.card .art{font-size:74px;display:block;margin:24px auto}.card:focus-visible{outline:4px solid #fff}.card.locked{filter:saturate(.5)}.caption{font-size:13px;color:#c6e7ef}.hidden{display:none}</style></head><body><main><div class="hud"><h2 id="phase">☀️ Ngày 02</h2><div class="toolbar"><button id="toggle">Đổi Ngày/Đêm</button><button id="cardsButton">Vai Trò / Artifact</button></div></div><section class="scene" id="scene" aria-label="Sân chơi 2D"><div class="arena" id="arena"><div class="fountain" id="center">⛲</div></div></section><section class="panel"><div class="toolbar"><button id="gm">GM: Lượt hành động</button><button id="rejoin">Đang Vào Trận</button></div><p id="status" class="status" role="status">Bản mẫu tương tác giao diện, chưa kết nối máy chủ.</p></section><section class="panel hidden" id="cardPanel"><h3>Thẻ của bạn</h3><div class="cards"><button class="card front" id="role" aria-label="Xem Vai Trò"><strong>VAI TRÒ</strong><span class="art">🧙🏻‍♀️</span><b>Phù Thủy</b><p>Phe Dân Làng</p></button><button class="card back" id="artifact" aria-label="Xem Artifact"><strong>ARTIFACT</strong><span class="art">🪞</span><b>Tráng Gương</b><p id="artifactState">Chưa sử dụng</p></button></div><div class="toolbar"><button id="use">Mô phỏng sử dụng Artifact</button></div><p class="caption">Nhấn lá lộ phía sau để đưa lên trước. Đây là dữ liệu mô phỏng, không phải vai thật.</p></section></main><script>
const $=id=>document.getElementById(id);let night=false,front='role',used=false,selected=null;const names=['Minh','Lan','Huy','An','Mai','Khá','Khoa','Dũng','Linh','Ngọc','Trang','Phương'];const faces=['🧝🏻‍♀️','🧙🏻','👸🏼','🧝🏼','👩🏻‍🎤','🧑🏽','🧙🏼‍♂️','👩🏽','🧑🏻‍🎤','👱🏼‍♀️','🧝🏻','👩🏻'];function draw(){const a=$('arena');a.querySelectorAll('.player').forEach(n=>n.remove());names.slice(0,night?4:12).forEach((name,i)=>{let total=night?4:12,theta=2*Math.PI*i/total-Math.PI/2,b=document.createElement('button');b.className='player'+(selected===i?' selected':'');b.style.left=(50+38*Math.cos(theta))+'%';b.style.top=(51+36*Math.sin(theta))+'%';b.innerHTML='<span>'+faces[i]+'</span><b>'+(i+1)+' '+name+'</b>';b.onclick=()=>{selected=i;$('status').textContent='Đã chọn '+name+' (chỉ mô phỏng; máy chủ phải xác nhận mục tiêu).';draw()};a.appendChild(b)});}function cards(){['role','artifact'].forEach(id=>{$(id).className='card '+(front===id?'front':'back')+(id==='artifact'&&used?' locked':'')});$('artifactState').textContent=used?'Đã sử dụng · khóa':'Chưa sử dụng'}$('toggle').onclick=()=>{night=!night;selected=null;$('scene').classList.toggle('night',night);$('phase').textContent=night?'🌙 Đêm 02':'☀️ Ngày 02';$('center').textContent=night?'🔥':'⛲';draw()};$('cardsButton').onclick=()=>$('cardPanel').classList.toggle('hidden');['role','artifact'].forEach(id=>$(id).onclick=()=>{front=id;cards();$('status').textContent=id==='role'?'Đã xem Vai Trò':'Đã xem Artifact'});$('use').onclick=()=>{if(used){$('status').textContent='Artifact đã sử dụng; không thể kích hoạt lại.';return}used=true;front='role';cards();$('status').textContent='Mô phỏng đã sử dụng. Trong game thật chỉ khóa sau khi máy chủ chốt.'};$('gm').onclick=()=>$('status').textContent='GM kiểm tra lượt, mục tiêu, hiệu ứng và xác nhận trên máy chủ (chưa tích hợp).';$('rejoin').onclick=()=>$('status').textContent='Đang Vào Trận: bản thật cần xác thực và đồng bộ lại từ máy chủ.';draw();cards();
</script></body></html>
