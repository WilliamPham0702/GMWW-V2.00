name: Check Player Room Template Layout
on:
  pull_request:
    paths:
      - 'src/player-web-src/37-player-rooms.part'
      - 'src/gmww-members-live.js'
      - 'src/player-page-src/00-head-and-style.part'
      - 'tests/player-room-template-layout-browser.mjs'
      - '.github/workflows/check-player-room-template-layout.yml'
permissions:
  contents: read
jobs:
  template-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Reproduce percentage height regression on base source when present
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:src/player-web-src/37-player-rooms.part" > /tmp/template-layout-before.part
          if grep -Fq 'min-width:0;height:100%;font-size:12px' /tmp/template-layout-before.part; then
            node tests/player-room-template-layout-browser.mjs --source=/tmp/template-layout-before.part --expect-layout-failure
          fi
      - name: Verify picker and designer layout and interactions on iPhone and iPad sizes
        run: node tests/player-room-template-layout-browser.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-layout-screenshots
          path: artifacts/template-layout
