name: Bootstrap V2.63 Walk Frames

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Fresh signed URL to base64 text containing GMWW-V2.63-walk-frames-20x6.zip
        required: true
        type: string
      expected_sha:
        description: Expected SHA256 of decoded ZIP
        required: true
        default: 31c7c95470a609e536c5ee57cb26b6d5b8bf530f7e80920b8cfc292a72a0786e
        type: string
      target_branch:
        description: Branch that receives the 120 walk frames
        required: true
        default: v263-major-2d-realtime-fixes
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Download verify and extract 20x6 walk frames
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request, base64, hashlib, zipfile, pathlib, shutil
          url=os.environ["BUNDLE_URL"]
          expected=os.environ["EXPECTED_SHA"].strip().lower()
          req=urllib.request.Request(url,headers={"User-Agent":"GMWW-GitHub-Actions"})
          with urllib.request.urlopen(req,timeout=120) as r:
              encoded=r.read()
          raw=base64.b64decode(encoded)
          digest=hashlib.sha256(raw).hexdigest()
          if digest!=expected:
              raise SystemExit(f"Bundle SHA256 mismatch: {digest} != {expected}")
          bundle=pathlib.Path("/tmp/GMWW-V2.63-walk-frames-20x6.zip")
          bundle.write_bytes(raw)
          expected_names={
              f"character-{char:02d}/frame-{frame:02d}.webp"
              for char in range(1,21) for frame in range(1,7)
          }
          with zipfile.ZipFile(bundle) as z:
              bad=z.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names={n for n in z.namelist() if n.endswith(".webp")}
              if names!=expected_names:
                  missing=sorted(expected_names-names)[:10]
                  extra=sorted(names-expected_names)[:10]
                  raise SystemExit(f"Invalid 20x6 bundle: {len(names)} WebP; missing={missing}; extra={extra}")
              tmp=pathlib.Path("/tmp/walk-v263")
              if tmp.exists(): shutil.rmtree(tmp)
              z.extractall(tmp)
          dest=pathlib.Path("assets/characters/walk-v263")
          if dest.exists(): shutil.rmtree(dest)
          shutil.copytree(tmp,dest)
          count=sum(1 for _ in dest.rglob("frame-*.webp"))
          if count!=120:
              raise SystemExit(f"Expected 120 walk frames, got {count}")
          print("Verified walk-frame bundle:",digest,"frames:",count)
          PY

      - name: Commit walk frames to target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          COUNT=$(find assets/characters/walk-v263 -type f -name 'frame-*.webp' | wc -l | tr -d ' ')
          test "$COUNT" -eq 120
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/walk-v263
          git diff --cached --quiet && { echo "No frame changes to commit"; exit 0; }
          git commit -m "V2.63: add 20x6 real 2D walk frames"
          git push origin HEAD:"$TARGET_BRANCH"
