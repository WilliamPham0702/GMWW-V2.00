name: Check Player Card Browsers

on:
  push:
    branches: [main]
    paths:
      - "src/gmww-player-private-card-patch.js"
      - "update-system/published-ipa.json"
      - ".github/scripts/prepare-update-channel.mjs"
      - "src/gmww-members-live.js"
      - "src/gmww-members-page.js"
      - "src/player-page-src/**"
      - "src/player-web-src/**"
      - "tests/worker-engine-multinight-e2e.mjs"
      - "src/gmww-delivery-manifest.js"
      - "src/gmww-delivery-snapshot.js"
      - "src/index.js"
      - "tests/browser-private-cards.mjs"
      - "tests/browser-live-realtime-vote.mjs"
      - "tests/browser-compact-battle-panels.mjs"
      - "tests/v3178-compact-battle-panels.test.mjs"
      - "server-game/current/style.css"
      - "tests/home-v389-iphone-webkit.mjs"
      - "tests/night-timeline-iphone-webkit.mjs"
      - "tests/v3188-preview-iphone-webkit.mjs"
      - "tests/v3189-pirate-fire-webkit.mjs"
      - "tests/v3190-fire-image-calibration-webkit.mjs"
      - "tests/task444-gm-day-night-fire-webkit.mjs"
      - "tests/demo-room-cross-origin-webkit.mjs"
      - "tests/demo-server-autonomous-e2e.mjs"
      - "server-game/current/battle-controls.js"
      - "server-game/current/app.js"
      - "server-game/current/runtime-recovery.js"
      - "tests/runtime-recovery-webkit.mjs"
      - "tests/seat-css-webkit.mjs"
      - "tests/v3181-scene-layer-webkit.mjs"
      - "assets/village/village.css"
      - "assets/village/village-art.css"
      - "assets/village/index.html"
      - "tests/gp2-qa-webkit.mjs"
      - "assets/village/gp2-qa.*"
      - "assets/village/gp2-world-camera.mjs"
      - "server-game/current/status-visuals.css"
      - "assets/village/status-visuals.css"
      - ".github/scripts/ci-browser-scope.mjs"
      - "tests/ci-browser-scope.test.mjs"
      - ".github/workflows/check-player-card-browsers.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/gmww-player-private-card-patch.js"
      - "update-system/published-ipa.json"
      - ".github/scripts/prepare-update-channel.mjs"
      - "src/gmww-members-live.js"
      - "src/gmww-members-page.js"
      - "src/player-page-src/**"
      - "src/player-web-src/**"
      - "tests/worker-engine-multinight-e2e.mjs"
      - "src/gmww-delivery-manifest.js"
      - "src/gmww-delivery-snapshot.js"
      - "src/index.js"
      - "tests/browser-private-cards.mjs"
      - "tests/browser-live-realtime-vote.mjs"
      - "tests/browser-compact-battle-panels.mjs"
      - "tests/v3178-compact-battle-panels.test.mjs"
      - "server-game/current/style.css"
      - "tests/home-v389-iphone-webkit.mjs"
      - "tests/night-timeline-iphone-webkit.mjs"
      - "tests/demo-room-cross-origin-webkit.mjs"
      - "tests/demo-server-autonomous-e2e.mjs"
      - "server-game/current/battle-controls.js"
      - "server-game/current/app.js"
      - "server-game/current/runtime-recovery.js"
      - "tests/runtime-recovery-webkit.mjs"
      - "tests/seat-css-webkit.mjs"
      - "tests/v3181-scene-layer-webkit.mjs"
      - "assets/village/village.css"
      - "assets/village/village-art.css"
      - "assets/village/index.html"
      - "tests/gp2-qa-webkit.mjs"
      - "assets/village/gp2-qa.*"
      - "assets/village/gp2-world-camera.mjs"
      - "server-game/current/status-visuals.css"
      - "assets/village/status-visuals.css"
      - ".github/scripts/ci-browser-scope.mjs"
      - "tests/ci-browser-scope.test.mjs"
      - ".github/workflows/check-player-card-browsers.yml"
  workflow_dispatch:

concurrency:
  group: gmww-browser-private-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Tải mã nguồn để đối chiếu phạm vi thay đổi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chọn kiểm thử đúng phạm vi, an toàn mặc định
        id: select
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
  postgame-regression:
    needs: scope
    if: needs.scope.outputs.mode == 'postgame'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm thử đúng luồng kết thúc và tạo ván tiếp theo
        run: node --test tests/match-completion*.test.mjs tests/forced-end-game.test.mjs
  postmatch-532-regression:
    needs: scope
    if: needs.scope.outputs.mode == 'post-match-room-532'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chỉ kiểm thử giải phóng Seat và phục hồi DEMO sau ván
        run: node --test tests/post-match-room-cleanup.test.mjs tests/forced-end-game.test.mjs tests/match-completion-server.test.mjs
  postmatch-ci-532-policy:
    needs: scope
    if: needs.scope.outputs.mode == 'postmatch-ci-532'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chỉ kiểm chứng hợp đồng phân loại CI PR532
        run: node --test --test-name-pattern='PR532' tests/ci-browser-scope.test.mjs
  # On PR and safe CI-only main merges, run ONLY the selector policy test.
  ci-policy-test:
    needs: scope
    if: needs.scope.outputs.mode == 'ci-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chỉ kiểm thử logic phân phạm vi CI
        run: node --test --test-name-pattern='Unknown Worker|Any other public-room|UI changes outside|Browser, seat, workflow|A deletion, unexpected status|CI-only merge|PR603 account avatar' tests/ci-browser-scope.test.mjs
  # Lên Giàn đã có workflow Check Lên Giàn theo đúng phạm vi.
  # Không chạy browser-test khi mode=gallows: tuyệt đối không chặn task bằng Card/Seat/Home/OTA.
  avatar-regression:
    needs: scope
    if: needs.scope.outputs.mode == 'player-top-avatar-603'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm icon avatar + Player Web bundle trên PR603
        run: |
          node --test tests/player-web-top-account-avatar-20261029.test.mjs tests/player-web-online-village-20261028.test.mjs
          node .github/scripts/assemble-player-web.mjs --verify
  browser-test:
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'pr645-postmerge-release' || needs.scope.outputs.mode == 'pr652-postmerge-release'
    # Pin a Playwright-WebKit supported OS, rather than ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Tải mã nguồn dự án
        uses: actions/checkout@v4
      - name: Thiết lập Node.js và bộ nhớ đệm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài đặt thư viện cần thiết
        run: npm install
      - name: Dùng lại trình duyệt WebKit đúng phiên bản
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: gmww-webkit-${{ runner.os }}-playwright-1.58.2
      - name: Cài đặt công cụ kiểm thử trình duyệt
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Kiểm tra bảng điều khiển GM trên màn hình iPhone
        run: node tests/browser-compact-battle-panels.mjs
      - name: Kiểm tra DEMO, thanh menu và đống lửa trên iPhone
        run: node tests/v3188-preview-iphone-webkit.mjs
      - name: Kiểm tra đề cử và cửa sổ đống lửa trên iPhone
        run: node tests/v3189-pirate-fire-webkit.mjs
      - name: Kiểm tra chạm đống lửa Ngày/Đêm trên iPhone
        run: node tests/v3190-fire-image-calibration-webkit.mjs
      - name: Kiểm tra menu GM neo theo từng đống lửa Ngày và Đêm (Task #444)
        run: node tests/task444-gm-day-night-fire-webkit.mjs
      - name: Kiểm tra timeline/iPhone theo renderer thực tế (không phụ thuộc số PR)
        shell: bash
        run: |
          set -euo pipefail
          # Online fire-icon dock supersedes the retired [data-battle-action] rail.
          # The legacy fixture expects two rail buttons and cannot exercise the new UI.
          # Test the actual renderer on PR AND main after the V3.279 merge.
          if grep -Fq 'function gmwwOnlinePlaceAtFire(dock){' src/player-web-src/35-online-chat.part &&
             grep -Fq 'function gmwwSetupFreeBattleIcons()' server-game/src/30-village-and-setup.part; then
            node --test tests/player-online-realtime-freeze-day-20261030.test.mjs
            node tests/gm-free-floating-shortcuts-iphone-webkit.mjs
          else
            node tests/night-timeline-iphone-webkit.mjs
          fi
      - name: Kiểm tra giao diện lá bài trên Chrome, Edge, WebKit
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-browser-worker.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true; tail -100 /tmp/gmww-browser-worker.log || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/gmww-browser-health.json; then break; fi
            sleep 1
          done
          grep -q '"project":"GMWW-V2.00"' /tmp/gmww-browser-health.json
          # Modern server-owned DEMO can advance from night to day before
          # the historic fixed-timestamp fixtures wake up. Select by source,
          # not PR number: the same rule MUST apply to postmerge main CI.
          if grep -Fq 'function gmwwOnlinePlaceAtFire(dock){' src/player-web-src/35-online-chat.part; then
            node --test tests/demo-player-live-join-v3271.test.mjs
          else
            node tests/demo-server-autonomous-e2e.mjs
            node tests/demo-room-cross-origin-webkit.mjs
          fi
          node tests/browser-live-realtime-vote.mjs
          node tests/browser-private-cards.mjs
          node tests/gp2-qa-webkit.mjs
      - name: Kiểm tra mục Khám Phá trên iPhone
        run: node tests/home-v389-iphone-webkit.mjs
      - name: Kiểm tra tọa độ ghế và trạng thái trên WebKit
        run: node tests/seat-css-webkit.mjs
      - name: Kiểm tra lớp nhân vật và làng Ngày/Đêm trên iPhone
        run: node tests/v3181-scene-layer-webkit.mjs
      - name: Kiểm tra tự khôi phục khi khởi động OTA
        run: node tests/runtime-recovery-webkit.mjs
      - name: Tải lên bằng chứng kiểm thử đống lửa V3.189
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmww-v3189-iphone-pirate-fire-qa
          path: /tmp/gmww-v3189-iphone-pirate-fire.png
          if-no-files-found: ignore
      - name: Tải lên ảnh nghiệm thu iPhone V3.188
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmww-v3188-preview-iphone-overlay-qa
          path: /tmp/gmww-v3188-preview-iphone-webkit.png
          if-no-files-found: ignore
      - name: Tải lên ảnh bảng điều khiển thu gọn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmww-v3178-iphone-compact-battle
          path: /tmp/gmww-v3178-iphone-layout.png
          if-no-files-found: ignore
      - name: Tải lên ảnh màn hình chính WebKit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v389-iphone-webkit-preview
          path: /tmp/gmww-v389-iphone-webkit-home.png
          if-no-files-found: ignore
      - name: Tải lên ảnh kiểm thử các lớp làng trên iPhone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmww-v3181-village-background-actor-layer
          path: /tmp/gmww-v3181-scene-layer-*.png
          if-no-files-found: ignore
      - name: Tải lên ảnh nghiệm thu GP2 trên iPhone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmww-gp2-30-atlas-iphone-draft
          path: /tmp/gmww-gp2-qa-iphone-30-atlas.png
          if-no-files-found: ignore
      - name: Tải lên ảnh chụp khi kiểm thử lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-card-failure-screenshots
          path: /tmp/gmww-player-cards-*.png
          if-no-files-found: ignore
