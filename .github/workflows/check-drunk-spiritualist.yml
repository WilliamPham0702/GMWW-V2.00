name: Check Drunk Card Draw and Expelled Spiritualist

on:
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'src/player-web-src/30-rooms-and-realtime.part'
      - 'src/player-web-src/50-privacy-and-runtime.part'
      - 'server-game/src/40-battle-and-timeline.part'
      - 'assets/role-card-back.webp'
      - 'tests/drunk-card-overlay-match-cleanup-20261028.test.mjs'
      - '.github/workflows/check-drunk-spiritualist.yml'
      - '.github/scripts/ci-browser-scope.mjs'
  pull_request:
    paths:
      - 'src/index.js'
      - 'src/gmww-drunk-draw-rules.js'
      - 'src/gmww-role-inheritance-rules.js'
      - 'src/player-web-src/30-rooms-and-realtime.part'
      - 'src/gmww-members-live.js'
      - 'server-game/src/30-village-and-setup.part'
      - 'server-game/src/40-battle-and-timeline.part'
      - 'server-game/current/app.js'
      - 'tests/v389-night-runtime-integration.test.mjs'
      - 'tests/drunk-draw-spiritualist-expelled-20261027.test.mjs'
      - 'tests/drunk-card-overlay-match-cleanup-20261028.test.mjs'
      - 'assets/role-card-back.webp'
      - 'src/player-web-src/50-privacy-and-runtime.part'
      - 'tests/witch-drunk-clone-20261027.test.mjs'
      - '.github/workflows/check-drunk-spiritualist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-role-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Phân loại PR Player Web avatar so với RULE
        id: scope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: PR603 — kiểm icon tài khoản và bundle; không kiểm RULE Say Rượu
        if: steps.scope.outputs.mode == 'player-top-avatar-603'
        run: |
          node --test tests/player-web-top-account-avatar-20261029.test.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node --check src/gmww-members-live.js
      - name: CI-only policy — chỉ kiểm chốt an toàn, không chạy RULE Say Rượu
        if: steps.scope.outputs.mode == 'ci-policy'
        run: |
          node --check .github/scripts/ci-browser-scope.mjs
          node --test --test-name-pattern='CI-only merge' tests/ci-browser-scope.test.mjs
      - name: Test exact card selection, DO inheritance, faction comparison and private Player delivery
        if: steps.scope.outputs.mode != 'player-top-avatar-603' && steps.scope.outputs.mode != 'ci-policy'
        run: |
          node --test tests/drunk-draw-spiritualist-expelled-20261027.test.mjs tests/v389-night-runtime-integration.test.mjs tests/witch-drunk-clone-20261027.test.mjs tests/gmww-wolf-night-resolution.test.mjs tests/drunk-card-overlay-match-cleanup-20261028.test.mjs tests/member-ranking-games-first-v3221.test.mjs
          node --check src/index.js
          node --check src/gmww-drunk-draw-rules.js
          node --check src/gmww-role-inheritance-rules.js
          node --check server-game/current/app.js
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
