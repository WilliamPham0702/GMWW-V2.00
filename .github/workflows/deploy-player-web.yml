name: Deploy V2 Player Web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-player-web.yml"
  workflow_dispatch:

concurrency:
  group: gmww-v2-player-web-production
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate embedded Player Web
        run: node --input-type=module -e "import { gmwwMembersLiveScript } from './src/gmww-members-live.js'; new Function(gmwwMembersLiveScript); console.log('Embedded Player Web JS OK')"

      - name: Validate Worker
        run: npm run check

      - name: Deploy V2 production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify V2 production Player Web
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gmww-v2-00.williampham0702.workers.dev"
          EXPECTED_VERSION="$(sed -n 's/.*VERSION="\([^"]*\)".*/\1/p' src/index.js | head -n 1)"
          BG_FILE="$(sed -n 's/.*assetUrl.pathname="\/backgrounds\/\([^"]*\)".*/\1/p' src/index.js | head -n 1)"
          BG_PATH="assets/backgrounds/$BG_FILE"
          test -n "$EXPECTED_VERSION"
          test -n "$BG_FILE"
          test -f "$BG_PATH"

          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$BASE/api/health" -o /tmp/health.json &&
               curl -fsS --max-time 30 "$BASE/" -o /tmp/prod-page.html &&
               curl -fsS --max-time 30 "$BASE/gmww-members-live.js" -o /tmp/prod-player.js &&
               curl -fsS --max-time 30 "$BASE/gmww-sea-background.png?verify=$EXPECTED_VERSION-$attempt" -o /tmp/prod-bg.png; then
              ACTUAL_VERSION="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));process.stdout.write(String(x.version||''))")"
              if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] &&
                 grep -Fq 'GMWW PLAYER' /tmp/prod-page.html &&
                 ! grep -Fq '<div class="hero">' /tmp/prod-page.html &&
                 cmp -s "$BG_PATH" /tmp/prod-bg.png; then
                node --check /tmp/prod-player.js
                echo "Production verified: $ACTUAL_VERSION"
                echo "Login wolf hero removed"
                echo "Production background exactly matches: $BG_FILE"
                ok=1
                break
              fi
            fi
            echo "Waiting for Cloudflare propagation (attempt $attempt/12)..."
            sleep 5
          done
          test "$ok" -eq 1
