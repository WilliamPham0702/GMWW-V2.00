name: Generate V2.66 Left Walk Frames

on:
  push:
    branches: [v266-responsive-realtime-walk]
    paths:
      - ".github/workflows/generate-v266-left-walk.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v266-responsive-realtime-walk
          fetch-depth: 0

      - name: Generate mirrored left-facing walk frames
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src=Path('assets/characters/walk-v263')
          dst=Path('assets/characters/walk-v266-left')
          if dst.exists():
              import shutil; shutil.rmtree(dst)
          count=0
          for c in range(1,21):
              cid=f'character-{c:02d}'
              out=dst/cid
              out.mkdir(parents=True,exist_ok=True)
              for f in range(1,7):
                  inp=src/cid/f'frame-{f:02d}.webp'
                  im=Image.open(inp).convert('RGBA')
                  # Store the reverse direction as real raster frames; no runtime scaleX flip.
                  ImageOps.mirror(im).save(out/f'frame-{f:02d}.webp','WEBP',quality=92,method=6)
                  count+=1
          assert count==120
          print('generated',count,'left-facing frames')
          PY
          test "$(find assets/characters/walk-v266-left -type f -name 'frame-*.webp' | wc -l | tr -d ' ')" -eq 120

      - name: Commit left-facing frames
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/walk-v266-left
          git commit -m "V2.66: add 120 left-facing walk frames [skip ci]"
          git push origin HEAD:v266-responsive-realtime-walk
