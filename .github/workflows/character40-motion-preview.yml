name: Character40 Motion Preview
on:
  push:
    branches: [feature/gmww-shared-motion-4-actions-20261019]
    paths:
      - '.github/workflows/character40-motion-preview.yml'
      - '.github/scripts/check-character40-browsers.mjs'
      - 'tests/character40-preview.test.mjs'
      - 'prototype/character40/**'
      - 'src/character40-preview-worker.mjs'
      - 'wrangler.character40-preview.jsonc'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character40-motion-preview
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --config wrangler.character40-preview.jsonc --dry-run
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify all characters on desktop and iPhone-sized WebKit
        run: |
          python3 -m http.server 18782 --directory prototype/character40 > /tmp/character40-http.log 2>&1 &
          trap 'kill $!' EXIT
          for n in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:18782/catalog.json > /dev/null && break; sleep 1; done
          node .github/scripts/check-character40-browsers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: character40-browser-review
          path: character40-*.png
  deploy-preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy isolated preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.character40-preview.jsonc
      - name: Verify deployed health
        run: curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://gmww-character40-motion-preview.williampham0702.workers.dev/api/health
