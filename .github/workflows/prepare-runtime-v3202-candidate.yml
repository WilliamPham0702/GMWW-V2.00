name: GMWW V3.229 OTA Candidate SHA-256 (Active GM Action Icons)
on:
  pull_request:
    branches: [main]
    paths:
      - "server-game/current/app.js"
      - "server-game/current/style.css"
      - "server-game/src/30-village-and-setup.part"
      - "server-game/src/40-battle-and-timeline.part"
      - "tests/gmww-v3228-battle-icons-footer.test.mjs"
      - "server-game/current/GMWW.html"
      - "src/index.js"
      - "assets/village/**"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/prepare-update-channel.mjs"
      - ".github/scripts/verify-prepared-runtime.mjs"
      - ".github/workflows/prepare-runtime-v3202-candidate.yml"
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout for release scope
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify PR release scope
        id: select
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
  candidate:
    needs: scope
    if: needs.scope.outputs.mode != 'gm-icons-501-release' && needs.scope.outputs.mode != 'gm-icons-501'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lấy mã nguồn từ PR, không chạm Production
        uses: actions/checkout@v4
      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện theo phiên bản cố định
        run: npm ci
      - name: Khôi phục bộ ảnh nguyên bản và kiểm tra SHA-256
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="server-game/legacy-assets/v252"
          ARCHIVE="/tmp/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          URL="https://github.com/WilliamPham0702/GMWW-V2.00/releases/download/legacy-assets-v252/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          EXPECTED="b9229b9b48f5fa3e63dfb831e0ac523cad0ec469d3e3b8c2dca59ef594616c36"
          COUNT=0
          if test -d "$SOURCE/assets/role-artwork-v251/original"; then
            COUNT=$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')
          fi
          if ! test -s "$SOURCE/role-artwork-v251.js" || test "$COUNT" -ne 63; then
            rm -rf "$SOURCE"
            curl --fail --location --retry 4 --retry-delay 3 --output "$ARCHIVE" "$URL"
            echo "$EXPECTED  $ARCHIVE" | sha256sum --check
            unzip -q "$ARCHIVE" -d .
          fi
          test "$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 63
      - name: Kiểm thử trực tiếp phiên bản và guard OTA liên quan
        run: |
          node .github/scripts/verify-gmww-versions.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node --test tests/gmww-v3228-battle-icons-footer.test.mjs tests/gmww-action-icon-stacking.test.mjs tests/gmww-action-icons-in-battle.test.mjs tests/gm-free-floating-shortcuts-20261025.test.mjs
      - name: Đóng gói manifest từ bytes Runtime thật
        run: node .github/scripts/prepare-update-channel.mjs runtime
      - name: Kiểm chứng SHA-256 từng file và manifest V3.229
        run: node .github/scripts/verify-prepared-runtime.mjs 3.229
      - name: Kiểm tra V3.229 lớn hơn bản đang chạy, chặn trùng phiên bản
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://gmww-v2-00.williampham0702.workers.dev"
          LIVE="/tmp/gmww-3218-production-baseline.json"
          if ! curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 8 --max-time 25 "$ROOT/api/update/manifest" -o "$LIVE"; then
            # Health only supplies a version floor; it never grants same-version OTA repairs.
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 8 --max-time 25 "$ROOT/api/health" -o /tmp/gmww-3218-health.json
            node --input-type=module -e '
              import fs from "node:fs";
              const health=JSON.parse(fs.readFileSync("/tmp/gmww-3218-health.json","utf8"));
              if(health.project!=="GMWW-V2.00"||health.status!=="online")throw Error("Không xác minh được Production");
              const version=String(health.runtimeVersion||health.version||"").replace(/^V/i,"");
              if(!/^\d+\.\d+(?:\.\d+)?$/.test(version))throw Error("Production không có phiên bản hợp lệ");
              fs.writeFileSync(process.argv[1],JSON.stringify({releaseVersion:version,source:"verified-live-health-fallback"}));
            ' "$LIVE"
          fi
          printf '%s\n' 'server-game/current/app.js' > /tmp/gmww-3218-changed-files.txt
          node .github/scripts/verify-ota-version-advance.mjs \
            assets/updates/latest.json "$LIVE" /tmp/gmww-3218-changed-files.txt
      - name: Xuất chứng cứ cho chủ dự án nghiệm thu (không phát hành)
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-V3.229-OTA-CANDIDATE-SHA256-NO-DEPLOY
          path: |
            out/gmww-runtime-v3.229-sha256.json
            assets/updates/latest.json
            assets/updates/runtime/V3.229/manifest.json
            assets/updates/runtime/V3.229/manifest-runtime-3229.json
          if-no-files-found: error
          retention-days: 14
