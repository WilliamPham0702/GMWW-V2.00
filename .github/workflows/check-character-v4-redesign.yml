name: Check Character V4 Redesign Contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/characters/v4/**'
      - 'assets/characters/v5/**'
      - 'tests/character-v510-skinned-master.test.mjs'
      - 'tests/character-v520-acceptance-board.test.mjs'
      - 'tests/character-v530-original-skin-adapter.test.mjs'
      - 'tests/character-v560-weighted-skin.test.mjs'
      - 'tests/character-v561-original-art-uv.test.mjs'
      - 'tests/character-v562-original-sleeves.test.mjs'
      - 'tests/character-v562-preview-isolation.test.mjs'
      - 'tests/character-v500-webgl-master.test.mjs'
      - 'tests/character-v4-action-lab.test.mjs'
      - 'tests/character-v4-media.test.mjs'
      - 'tests/character-v4-sprite-actions.test.mjs'
      - 'tests/character-v4-web-preview.test.mjs'
      - 'tests/character-v4-skeleton.test.mjs'
      - 'tests/character-v4-skin.test.mjs'
      - 'tests/character-v4-skin-preview.test.mjs'
      - 'tests/character-v4-highres-master.test.mjs'
      - 'tests/character-v4-premium-artwork.test.mjs'
      - 'tests/character-v4-hd-artwork-v416.test.mjs'
      - 'tests/character-v4-layered-motion-v417.test.mjs'
      - 'tests/character-v4-approval-v418.test.mjs'
      - 'tests/character-v4-rig-integrity-v419.test.mjs'
      - 'tests/character-v4-api.test.mjs'
      - 'src/gmww-character-v4.js'
      - 'src/index.js'
      - 'docs/character-v4-redesign.md'
      - 'tests/character-v4-manifest.test.mjs'
      - '.github/workflows/check-character-v4-redesign.yml'
  workflow_dispatch:

concurrency:
  group: gmww-character-v4-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Tải mã nguồn dự án
      - uses: actions/checkout@v4
      - name: Thiết lập Node.js và bộ nhớ đệm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra quy tắc thiết kế Character V4
        run: node --test tests/character-v4-manifest.test.mjs tests/character-v4-web-preview.test.mjs tests/character-v4-api.test.mjs tests/character-v4-action-lab.test.mjs tests/character-v4-media.test.mjs tests/character-v4-sprite-actions.test.mjs tests/character-v4-skeleton.test.mjs tests/character-v4-skin.test.mjs tests/character-v4-skin-preview.test.mjs tests/character-v4-highres-master.test.mjs tests/character-v4-premium-artwork.test.mjs tests/character-v4-hd-artwork-v416.test.mjs tests/character-v4-layered-motion-v417.test.mjs tests/character-v4-approval-v418.test.mjs tests/character-v4-rig-integrity-v419.test.mjs tests/character-v500-webgl-master.test.mjs tests/character-v510-skinned-master.test.mjs tests/character-v520-acceptance-board.test.mjs tests/character-v530-original-skin-adapter.test.mjs tests/character-v560-weighted-skin.test.mjs tests/character-v561-original-art-uv.test.mjs tests/character-v562-original-sleeves.test.mjs tests/character-v562-preview-isolation.test.mjs
      - name: Kiểm tra nhanh WebGL V5 trên Chromium
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "::error::Chromium is not installed on CI"; exit 1; fi
          python3 -m http.server 18765 --bind 127.0.0.1 --directory assets >/tmp/gmww-v500-http.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=3500 \
            --dump-dom "http://127.0.0.1:18765/characters/v5/" \
            > /tmp/gmww-v500-browser.html 2>/tmp/gmww-v500-chrome.log || {
              tail -n 35 /tmp/gmww-v500-chrome.log; exit 1;
            }
          if ! grep -Fq 'data-gmww-v500="ready"' /tmp/gmww-v500-browser.html; then
            tail -n 30 /tmp/gmww-v500-chrome.log
            grep -o 'data-gmww-v500="[^"]*"' /tmp/gmww-v500-browser.html || true
            echo "::error::Character V5.00 WebGL failed to initialize in Chromium"
            exit 1
          fi
          echo "Master-01 2.5D 3D renderer initialized in headless Chromium PASS."

          # Browser smoke test also instantiates all 30 separately animated GPU bone rigs.
          timeout 70s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=1100 \
            --dump-dom "http://127.0.0.1:18765/characters/v5/?stress=30" \
            > /tmp/gmww-v510-30actors.html 2>/tmp/gmww-v510-30actors.log || {
              tail -n 35 /tmp/gmww-v510-30actors.log; exit 1;
            }
          grep -Fq 'data-gmww-v500="ready"' /tmp/gmww-v510-30actors.html
          grep -Fq 'data-gmww-v510-actors="30"' /tmp/gmww-v510-30actors.html
          grep -Fq 'data-gmww-v510-bones="16"' /tmp/gmww-v510-30actors.html
          echo "Master-01 V5.10 30 SkinnedMesh actors and 16 bones initialized in Chromium PASS."

          timeout 55s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=2000 \
            --dump-dom "http://127.0.0.1:18765/characters/v5/test-board-v520.html" \
            > /tmp/gmww-v520-test-board.html 2>/tmp/gmww-v520-board-chrome.log || {
              tail -n 40 /tmp/gmww-v520-board-chrome.log; exit 1;
            }
          grep -Fq 'data-test-id="engine"' /tmp/gmww-v520-test-board.html
          grep -Fq 'data-test-id="perf30"' /tmp/gmww-v520-test-board.html
          grep -Fq 'id="decision" data-status="pending"' /tmp/gmww-v520-test-board.html
          echo "Character V5.20 acceptance board renders ten rows and blocks unapproved live release PASS."

          # V5.61 must initialize REAL Three.js 3D + decode the *exact* original
          # V4.17 art-derived WebP texture; no gray/empty canvas "PASS".
          timeout 55s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=4500 \
            --dump-dom "http://127.0.0.1:18765/characters/v5/test-skin-v561.html" \
            > /tmp/gmww-v561-original-art-browser.html 2>/tmp/gmww-v561-chrome.log || {
              tail -n 40 /tmp/gmww-v561-chrome.log; exit 1;
            }
          if ! grep -Fq 'data-gmww-v561="ready"' /tmp/gmww-v561-original-art-browser.html; then
            tail -n 30 /tmp/gmww-v561-chrome.log
            grep -o 'data-gmww-v561="[^"]*"' /tmp/gmww-v561-original-art-browser.html || true
            echo "::error::V5.61 real 3D renderer or original V4.17 WebP could not initialize"
            exit 1
          fi
          echo "V5.61 original V4.17 pixels decoded and painted on 3D weighted SkinnedMesh PASS."

          # V5.62 adds TWO authentic-textured 3D weighted sleeve meshes on the
          # exact 16-bone V5.10 rig. READY requires decoded WebP and sleeve weights.
          timeout 55s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=4500 \
            --dump-dom "http://127.0.0.1:18765/characters/v5/test-skin-v562.html" \
            > /tmp/gmww-v562-sleeves-browser.html 2>/tmp/gmww-v562-chrome.log || {
              tail -n 40 /tmp/gmww-v562-chrome.log; exit 1;
            }
          if ! grep -Fq 'data-gmww-v562="ready"' /tmp/gmww-v562-sleeves-browser.html; then
            tail -n 30 /tmp/gmww-v562-chrome.log
            echo "::error::V5.62 original V4.17 fabric or weighted sleeves failed in Chromium"
            exit 1
          fi
          echo "V5.62 original GMWW textured 3D sleeves rendered in headless Chromium PASS."

      - name: Đảm bảo game thật không dùng nhân vật chưa duyệt
        run: |
          test -s docs/character-v4-redesign.md
          test -s assets/characters/v4/manifest.json
          test -s assets/characters/v4/index.html
          test -s assets/characters/v4/approved-two-characters.avif
          grep -q 'api/game-characters/v4' assets/characters/v4/index.html
          grep -q 'action-lab.mjs' assets/characters/v4/index.html
          node --check assets/characters/v4/action-lab.mjs
          node --check assets/characters/v4/animated-sprite.mjs
          node --check assets/characters/v4/skeleton-rig.mjs
          node --check assets/characters/v4/skin-v414.mjs
          node --check assets/characters/v4/skin-master-v415.mjs
          node --check assets/characters/v4/artwork-intake-v416.mjs
          node --check assets/characters/v4/artwork-v416.mjs
          node --check assets/characters/v4/layered-skin-v417.mjs
          node --check assets/characters/v4/artwork-review-v418.mjs
          node --check assets/characters/v4/rig-integrity-v419.mjs
          node --check assets/characters/v5/character-motion-v500.mjs
          node --check assets/characters/v5/character-master-v500.mjs
          node --check assets/characters/v5/character-rig-v510.mjs
          node --check assets/characters/v5/test-gates-v520.mjs
          node --check assets/characters/v5/test-board-v520.mjs
          test -s assets/characters/v5/test-board-v520.html
          grep -Fq 'CHƯA NGHIỆM THU' assets/characters/v5/test-board-v520.html
          test -s assets/characters/v5/index.html
          grep -Fq 'THỬ NGHIỆM RIÊNG' assets/characters/v5/index.html
          ! grep -Fq 'characters/v5' src/gmww-members-live.js
          ! grep -Fq 'characters/v5' assets/village/village.mjs
          test -s assets/characters/v4/skin-motion-v417.html
          grep -Fq 'CHƯA VÀO GAME' assets/characters/v4/skin-motion-v417.html
          grep -Fq 'skin-motion-v417.html' assets/characters/v4/artwork-v416.html
          test -s assets/characters/v4/artwork-v416.html
          test -s assets/characters/v4/artwork-v416-manifest.json
          grep -Fq 'CHƯA GẮN VÀO GAME' assets/characters/v4/artwork-v416.html
          test -s assets/characters/v4/artwork-intake-v416.html
          grep -Fq 'CHƯA THAY CHARACTER TRONG GAME' assets/characters/v4/artwork-intake-v416.html
          test -s assets/characters/v4/skin-master-v415.html
          grep -Fq 'MASTER KỸ THUẬT' assets/characters/v4/skin-master-v415.html
          test -s assets/characters/v4/skin-preview-v414.html
          grep -Fq 'skin-v414.mjs' assets/characters/v4/skin-preview-v414.html
          test ! -e assets/characters/v4/skeleton-skin.mjs
          grep -Fq 'KHÔNG ĐẠT NGHIỆM THU' assets/characters/v4/skin.html
          grep -Fq 'skeleton-rig.mjs' assets/characters/v4/skin.html
          ! grep -Fq 'skeleton-skin.mjs' assets/characters/v4/skin.html
          test -s assets/characters/v4/skin-art-spec.json
          test -s assets/characters/v4/skin.html
          grep -q 'animated-sprite.mjs' assets/characters/v4/index.html
          ! grep -q 'assets/characters/v4' assets/village/village.mjs
          ! grep -q 'assets/characters/v4' server-game/current/character-renderer.js
