name: Check Villager Night Wakeup (focused)
on:
  push:
    branches:
      - fix/villager-skip-night-turn-20261028
  pull_request:
    paths:
      - 'src/index.js'
      - 'tests/villager-night-wakeup-20261028.test.mjs'
      - '.github/workflows/check-villager-night-wakeup.yml'
permissions:
  contents: read
jobs:
  villager-night:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ordinary Villager night turns and Artifact retention
        run: node --test tests/villager-night-wakeup-20261028.test.mjs
      - name: Server syntax only
        run: node --check src/index.js
