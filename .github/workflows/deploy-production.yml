        run: npx wrangler deploy

      - name: Kiểm tra Production sau triển khai
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          EXPECTED=$(node -e "const p=require('./package.json');process.stdout.write(String(p.version).replace(/\.0$/,''))")
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health?verify=$i" > /tmp/health.json &&
               grep -q '"project":"GMWW-V2.00"' /tmp/health.json &&
               grep -q "\"version\":\"V$EXPECTED\"" /tmp/health.json; then
              OK=1
              break
            fi
            sleep 3
          done
          cat /tmp/health.json
          test "$OK" = "1"
          # Runtime V3.160 can stay unchanged on a server-only deploy. Health version
          # alone cannot prove the just-uploaded static assets have reached the edge.
          # Wait for the new portrait bytes, then verify all 40 IDs. Fail closed if
          # propagation never finishes; retain the previous deployment for rollback.
          AVATAR_READY=0
          for TRY in $(seq 1 40); do
            if curl --fail --location --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$URL/api/game-characters/character-01/image?rev=c40-4&edge-propagation=$TRY-$(date +%s)" \
              > /tmp/gmww-live-avatar.webp; then
              if cmp -s /tmp/gmww-live-avatar.webp assets/characters/gmww40/portraits/character-01.webp; then
                AVATAR_READY=1
                break
              fi
              echo "::warning::Waiting for Character40 portrait edge propagation ($TRY/40); expected bytes $(wc -c < assets/characters/gmww40/portraits/character-01.webp), received $(wc -c < /tmp/gmww-live-avatar.webp)"
            fi
            sleep 2
          done
          test "$AVATAR_READY" = "1" || {
            echo "::error::New Worker assets did not propagate; production verification blocked."
            echo "Expected SHA: $(shasum -a 256 assets/characters/gmww40/portraits/character-01.webp)"
            echo "Observed SHA: $(shasum -a 256 /tmp/gmww-live-avatar.webp)"
            exit 1
          }
          echo "Verify Production: fresh Character40 portrait revision is live."

          for N in $(seq 1 40); do
            ID=$(printf 'character-%02d' "$N")
            MATCHED=0
            for TRY in $(seq 1 5); do
              if curl --fail --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "$URL/api/game-characters/$ID/image?rev=c40-4&verify-avatar=$N-$TRY-$(date +%s)" \
                > /tmp/gmww-live-avatar.webp && \
                cmp -s /tmp/gmww-live-avatar.webp "assets/characters/gmww40/portraits/$ID.webp"; then
                MATCHED=1
                break
              fi
              sleep 2
            done
            test "$MATCHED" = "1" || {
              echo "::error::Production avatar/atlas bytes differ for $ID"
              echo "Expected SHA: $(shasum -a 256 "assets/characters/gmww40/portraits/$ID.webp")"
              echo "Observed SHA: $(shasum -a 256 /tmp/gmww-live-avatar.webp)"
              exit 1
            }
          done
          echo "Verify Production: all 40 portrait/animation identities and bytes PASS."

          # Safari Player iframe must resolve full village HTML, not the Worker 404 page.
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --max-time 30 "$URL/village/?embed=1&v=303" > /tmp/gmww-production-village.html
          grep -q '<main class="game day"' /tmp/gmww-production-village.html
          curl --fail --location --silent --show-error --max-time 30 "$URL/village/village.css?v=303" > /tmp/gmww-production-village.css
          test -s /tmp/gmww-production-village.css
          echo "Verify Production: Player Web village iframe HTML+CSS PASS."
          EXPECTED_SHELL=$(node -e "const fs=require('fs'),s=fs.readFileSync('src/index.js','utf8'),m=s.match(/NATIVE_SHELL_VERSION=\\\"([^\\\"]+)\\\"/);if(!m)process.exit(2);process.stdout.write(m[1])")
          MANIFEST_OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/update/manifest?verify=$i-$(date +%s)" > /tmp/manifest.json; then
              if node - "$EXPECTED" "$EXPECTED_SHELL" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const expected=process.argv[2],shell=process.argv[3];
          if(String(m.releaseVersion||'')!==expected)throw new Error('Manifest releaseVersion is stale');
          if(expected!==shell){
            if(m.releaseType!=='runtime')throw new Error('Newer runtime was hidden as '+String(m.releaseType||'missing'));
            if(String(m.shellVersion||'')!==shell)throw new Error('Runtime shellVersion mismatch');
            if(String(m.runtimeVersion||'')!==expected)throw new Error('Runtime version does not match releaseVersion');
            if(!Array.isArray(m.runtime?.files)||m.runtime.files.length===0)throw new Error('Runtime update manifest has no files');
            for(const f of m.runtime.files){
              if(!String(f?.path||'').trim()||!String(f?.url||'').startsWith('https://')||!/^[a-f0-9]{64}$/i.test(String(f?.sha256||'')))throw new Error('Invalid runtime file entry');
            }
            const required=['GMWW.html','app.js','style.css','character-renderer.js','character-renderer.css','gm/gm-white-wolf.webp'];
            for(const p of required)if(!m.runtime.files.some(x=>String(x?.path||'')===p))throw new Error('Runtime package missing '+p);
            const rider=m.runtime.files.filter(x=>String(x?.path||'')==='gm/gm-white-wolf.webp');
            if(rider.length!==1)throw new Error('GM rider asset must appear exactly once in runtime manifest');
            const clean=m.runtime.files.filter(x=>/^assets\/role-artwork-v251\/original\/[^/]+\.webp$/.test(String(x?.path||'')));
            const cleanIndex=m.runtime.files.some(x=>String(x?.path||'')==='role-artwork-v251.js');
            if((cleanIndex||clean.length>0)&&clean.length!==63)throw new Error('Expected 63 clean role artworks in runtime update');
          }else if(m.releaseType==='native'){
            if(String(m.ipa?.version||'')!==expected)throw new Error('Native IPA version does not match releaseVersion');
            if(String(m.ipa?.fileName||'')!=='GMWW-V'+expected+'.ipa')throw new Error('Native IPA filename is stale');
          }
          NODE
              then
                MANIFEST_OK=1
                break
              fi
            fi
            sleep 3
          done
          cat /tmp/manifest.json
          test "$MANIFEST_OK" = "1"
          # Verify the exact installed iPhone update path, not only the
          # no-current manifest used by server-side smoke tests.
          if [ "$EXPECTED" = "3.120" ]; then
            for FROM in 3.119 3.118; do
              OTA_STATUS=0
              for CHECK in $(seq 1 10); do
                if curl --connect-timeout 8 --max-time 25 -fsS                   "$URL/api/update/manifest?current=$FROM&iphone-verify=$CHECK-$(date +%s)"                   > "/tmp/gmww-iphone-$FROM.json"; then
                  OTA_STATUS=1
                  break
                fi
                sleep 2
              done
              test "$OTA_STATUS" = "1" || { echo "::error::OTA not reachable by iPhone Runtime V$FROM"; exit 1; }
              node - "$FROM" "$EXPECTED" "$EXPECTED_SHELL" <<'NODE'
          const fs=require('node:fs');
          const [from,expected,shell]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync('/tmp/gmww-iphone-'+from+'.json','utf8'));
          if(m.ok!==true||m.releaseType!=='runtime'||m.releaseVersion!==expected||
             m.runtimeVersion!==expected||m.shellVersion!==shell||
             !Array.isArray(m.runtime?.files)||!m.runtime.files.length||
             !m.runtime.files.some(f=>f.path==='app.js'&&/^[a-f0-9]{64}$/i.test(f.sha256)))
            throw Error('Installed Runtime V'+from+' cannot receive verified OTA V'+expected);
          console.log('Verify Production: iPhone Runtime V'+from+' -> V'+expected+' manifest PASS');
          NODE
            done
          fi
          # V3.82: installability must be verified from a running V3.80/V3.81 IPA.
          if [ "$EXPECTED" = "3.82" ]; then
            for FROM in 3.81 3.80; do
              curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 75 \
                "$URL/api/update/manifest?current=$FROM&verify-v382=$(date +%s)" > "/tmp/gmww-v382-$FROM.json"
              node - "$FROM" <<'NODE'
          const fs=require('node:fs');
          const from=process.argv[2],m=JSON.parse(fs.readFileSync('/tmp/gmww-v382-'+from+'.json','utf8'));
          const req=['GMWW.html','app.js','style.css','gmww-ai-support.js','gmww-ai-support.css'];
          if(m.ok!==true||m.releaseVersion!=='3.82'||m.runtimeVersion!=='3.82'||
             m.shellVersion!=='3.17'||m.releaseType!=='runtime'||
             m.upgradeMode!=='verified-overlay'||m.optimizedFromVersion!==from)
            throw new Error('OTA V3.82 cannot be installed from Runtime V'+from);
          if(m.delete?.length)throw new Error('V3.82 would unexpectedly delete client files');
