name: Deploy Production

on:
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmww-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Xác định phiên bản đã kiểm thử
        id: tested
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested.outputs.sha }}
          fetch-depth: 2

      - name: Thiết lập Node.js và bộ nhớ đệm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện theo tệp khóa
        run: npm ci
      - name: Kiểm tra mã nguồn Worker
        run: npm run check

      - name: Phân loại và chuẩn bị kênh cập nhật GMWW
        id: update
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.tested.outputs.sha }}"
          git diff-tree --no-commit-id --name-only -r -m "$SHA" | sort -u > /tmp/gmww-changed-files.txt
          cat /tmp/gmww-changed-files.txt
          export GMWW_CHANGED_FILES="$(cat /tmp/gmww-changed-files.txt)"
          TYPE=$(node .github/scripts/classify-update.mjs | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).releaseType))")
          echo "release_type=$TYPE" >> "$GITHUB_OUTPUT"

          # Restore the pinned canonical source, then publish ONLY the 63 clean originals.
          SOURCE="server-game/legacy-assets/v252"
          ARCHIVE="/tmp/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          URL="https://github.com/WilliamPham0702/GMWW-V2.00/releases/download/legacy-assets-v252/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          EXPECTED_SHA="b9229b9b48f5fa3e63dfb831e0ac523cad0ec469d3e3b8c2dca59ef594616c36"
          CLEAN_COUNT=0
          if test -d "$SOURCE/assets/role-artwork-v251/original"; then
            CLEAN_COUNT=$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')
          fi
          if ! test -s "$SOURCE/role-artwork-v251.js" || test "$CLEAN_COUNT" -ne 63; then
            rm -rf "$SOURCE"
            curl --fail --location --retry 4 --retry-delay 3 --output "$ARCHIVE" "$URL"
            echo "$EXPECTED_SHA  $ARCHIVE" | shasum -a 256 -c -
            unzip -q "$ARCHIVE" -d .
          fi
          test "$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 63

          node .github/scripts/prepare-update-channel.mjs "$TYPE"

      - name: Kiểm tra tăng phiên bản OTA khi Runtime thay đổi
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          LIVE="/tmp/gmww-production-update-manifest.json"
          OK=0
          for i in $(seq 1 4); do
            if curl --connect-timeout 8 --max-time 20 --fail --silent --show-error \
              "$URL/api/update/manifest?ota-preflight=$(date +%s)-$i" > "$LIVE"; then
              if node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!/^\\d+\\.\\d+(?:\\.\\d+)?$/.test(String(m.releaseVersion||'')))process.exit(2)" "$LIVE"; then
                OK=1
                break
              fi
            fi
            sleep 2
          done

          # An unhealthy legacy OTA manifest is the defect this release repairs.
          # If it cannot be read, use only the live Worker's health version as the
          # comparison baseline; never skip version progression or post-deploy SHA checks.
          if [ "$OK" != "1" ]; then
            echo "::warning::Production OTA manifest unavailable; falling back to live Worker health version."
            HEALTH="/tmp/gmww-production-health-preflight.json"
            HEALTH_OK=0
            for i in $(seq 1 4); do
              if curl --connect-timeout 8 --max-time 15 --fail --silent --show-error \
                "$URL/api/health?ota-preflight=$(date +%s)-$i" > "$HEALTH"; then
                if node - "$HEALTH" "$LIVE" <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(health.project!=='GMWW-V2.00'||health.status!=='online')
            throw new Error('Production Worker health identity/status is not verified');
          const version=String(health.runtimeVersion||health.version||'').trim().replace(/^V/i,'');
          if(!/^\d+\.\d+(?:\.\d+)?$/.test(version))
            throw new Error('Production Worker health has no valid Runtime version');
          fs.writeFileSync(process.argv[3],JSON.stringify({
            releaseVersion:version,runtimeVersion:version,
            source:'verified-live-health-fallback'
          }));
          console.log('Using verified live Worker version V'+version+' as OTA progression baseline.');
          NODE
                then
                  HEALTH_OK=1
                  break
                fi
              fi
              sleep 2
            done
            test "$HEALTH_OK" = "1" || {
              echo "::error::Cannot verify Production OTA manifest or live Worker health; release blocked safely."
              exit 1
            }
          fi
          node .github/scripts/verify-ota-version-advance.mjs assets/updates/latest.json "$LIVE" /tmp/gmww-changed-files.txt

      - name: Xác minh thông tin kết nối Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Chặn phát hành phiên bản thấp hơn
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="https://gmww-v2-00.williampham0702.workers.dev/api/health"
          for i in $(seq 1 8); do
            if curl --connect-timeout 8 --max-time 15 -fsS "$HEALTH?version-guard=$i" > /tmp/gmww-live-health.json &&
               node .github/scripts/verify-gmww-versions.mjs /tmp/gmww-live-health.json; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deployment blocked: candidate is older than Production, versions are inconsistent or Production health is unavailable."
          exit 1

      - name: Tạo và kiểm tra 40 ảnh đại diện nhân vật
        shell: bash
        run: |
          python3 -m venv /tmp/gmww-avatar-venv
          /tmp/gmww-avatar-venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/gmww-avatar-venv/bin/python tools/generate-character40-portraits.py --verify
      - name: Triển khai Worker lên Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Kiểm tra Production sau triển khai
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          EXPECTED=$(node -e "const p=require('./package.json');process.stdout.write(String(p.version).replace(/\.0$/,''))")
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health?verify=$i" > /tmp/health.json &&
               grep -q '"project":"GMWW-V2.00"' /tmp/health.json &&
               grep -q "\"version\":\"V$EXPECTED\"" /tmp/health.json; then
              OK=1
              break
            fi
            sleep 3
          done
          cat /tmp/health.json
          test "$OK" = "1"
          # Runtime V3.160 can stay unchanged on a server-only deploy. Health version
          # alone cannot prove the just-uploaded static assets have reached the edge.
          # Wait for the new portrait bytes, then verify all 40 IDs. Fail closed if
          # propagation never finishes; retain the previous deployment for rollback.
          AVATAR_READY=0
          for TRY in $(seq 1 40); do
            if curl --fail --location --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$URL/api/game-characters/character-01/image?rev=c40-4&edge-propagation=$TRY-$(date +%s)" \
              > /tmp/gmww-live-avatar.webp; then
              if cmp -s /tmp/gmww-live-avatar.webp assets/characters/gmww40/portraits/character-01.webp; then
                AVATAR_READY=1
                break
              fi
              echo "::warning::Waiting for Character40 portrait edge propagation ($TRY/40); expected bytes $(wc -c < assets/characters/gmww40/portraits/character-01.webp), received $(wc -c < /tmp/gmww-live-avatar.webp)"
            fi
            sleep 2
          done
          test "$AVATAR_READY" = "1" || {
            echo "::error::New Worker assets did not propagate; production verification blocked."
            echo "Expected SHA: $(shasum -a 256 assets/characters/gmww40/portraits/character-01.webp)"
            echo "Observed SHA: $(shasum -a 256 /tmp/gmww-live-avatar.webp)"
            exit 1
          }
          echo "Verify Production: fresh Character40 portrait revision is live."

          for N in $(seq 1 40); do
            ID=$(printf 'character-%02d' "$N")
            MATCHED=0
            for TRY in $(seq 1 5); do
              if curl --fail --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "$URL/api/game-characters/$ID/image?rev=c40-4&verify-avatar=$N-$TRY-$(date +%s)" \
                > /tmp/gmww-live-avatar.webp && \
                cmp -s /tmp/gmww-live-avatar.webp "assets/characters/gmww40/portraits/$ID.webp"; then
                MATCHED=1
                break
              fi
              sleep 2
            done
            test "$MATCHED" = "1" || {
              echo "::error::Production avatar/atlas bytes differ for $ID"
              echo "Expected SHA: $(shasum -a 256 "assets/characters/gmww40/portraits/$ID.webp")"
              echo "Observed SHA: $(shasum -a 256 /tmp/gmww-live-avatar.webp)"
              exit 1
            }
          done
          echo "Verify Production: all 40 portrait/animation identities and bytes PASS."

          # Safari Player iframe must resolve full village HTML, not the Worker 404 page.
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --max-time 30 "$URL/village/?embed=1&v=303" > /tmp/gmww-production-village.html
          grep -q '<main class="game day"' /tmp/gmww-production-village.html
          curl --fail --location --silent --show-error --max-time 30 "$URL/village/village.css?v=303" > /tmp/gmww-production-village.css
          test -s /tmp/gmww-production-village.css
          echo "Verify Production: Player Web village iframe HTML+CSS PASS."
          EXPECTED_SHELL=$(node -e "const fs=require('fs'),s=fs.readFileSync('src/index.js','utf8'),m=s.match(/NATIVE_SHELL_VERSION=\\\"([^\\\"]+)\\\"/);if(!m)process.exit(2);process.stdout.write(m[1])")
          MANIFEST_OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/update/manifest?verify=$i-$(date +%s)" > /tmp/manifest.json; then
              if node - "$EXPECTED" "$EXPECTED_SHELL" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const expected=process.argv[2],shell=process.argv[3];
          if(String(m.releaseVersion||'')!==expected)throw new Error('Manifest releaseVersion is stale');
          if(expected!==shell){
            if(m.releaseType!=='runtime')throw new Error('Newer runtime was hidden as '+String(m.releaseType||'missing'));
            if(String(m.shellVersion||'')!==shell)throw new Error('Runtime shellVersion mismatch');
            if(String(m.runtimeVersion||'')!==expected)throw new Error('Runtime version does not match releaseVersion');
            if(!Array.isArray(m.runtime?.files)||m.runtime.files.length===0)throw new Error('Runtime update manifest has no files');
            for(const f of m.runtime.files){
              if(!String(f?.path||'').trim()||!String(f?.url||'').startsWith('https://')||!/^[a-f0-9]{64}$/i.test(String(f?.sha256||'')))throw new Error('Invalid runtime file entry');
            }
            const required=['GMWW.html','app.js','style.css','character-renderer.js','character-renderer.css','gm/gm-white-wolf.webp'];
            for(const p of required)if(!m.runtime.files.some(x=>String(x?.path||'')===p))throw new Error('Runtime package missing '+p);
            const rider=m.runtime.files.filter(x=>String(x?.path||'')==='gm/gm-white-wolf.webp');
            if(rider.length!==1)throw new Error('GM rider asset must appear exactly once in runtime manifest');
            const clean=m.runtime.files.filter(x=>/^assets\/role-artwork-v251\/original\/[^/]+\.webp$/.test(String(x?.path||'')));
            const cleanIndex=m.runtime.files.some(x=>String(x?.path||'')==='role-artwork-v251.js');
            if((cleanIndex||clean.length>0)&&clean.length!==63)throw new Error('Expected 63 clean role artworks in runtime update');
          }else if(m.releaseType==='native'){
            if(String(m.ipa?.version||'')!==expected)throw new Error('Native IPA version does not match releaseVersion');
            if(String(m.ipa?.fileName||'')!=='GMWW-V'+expected+'.ipa')throw new Error('Native IPA filename is stale');
          }
          NODE
              then
                MANIFEST_OK=1
                break
              fi
            fi
            sleep 3
          done
          cat /tmp/manifest.json
          test "$MANIFEST_OK" = "1"
          # Verify the exact installed iPhone update path, not only the
          # no-current manifest used by server-side smoke tests.
          if [ "$EXPECTED" = "3.120" ]; then
            for FROM in 3.119 3.118; do
              OTA_STATUS=0
              for CHECK in $(seq 1 10); do
                if curl --connect-timeout 8 --max-time 25 -fsS                   "$URL/api/update/manifest?current=$FROM&iphone-verify=$CHECK-$(date +%s)"                   > "/tmp/gmww-iphone-$FROM.json"; then
                  OTA_STATUS=1
                  break
                fi
                sleep 2
              done
              test "$OTA_STATUS" = "1" || { echo "::error::OTA not reachable by iPhone Runtime V$FROM"; exit 1; }
              node - "$FROM" "$EXPECTED" "$EXPECTED_SHELL" <<'NODE'
          const fs=require('node:fs');
          const [from,expected,shell]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync('/tmp/gmww-iphone-'+from+'.json','utf8'));
          if(m.ok!==true||m.releaseType!=='runtime'||m.releaseVersion!==expected||
             m.runtimeVersion!==expected||m.shellVersion!==shell||
             !Array.isArray(m.runtime?.files)||!m.runtime.files.length||
             !m.runtime.files.some(f=>f.path==='app.js'&&/^[a-f0-9]{64}$/i.test(f.sha256)))
            throw Error('Installed Runtime V'+from+' cannot receive verified OTA V'+expected);
          console.log('Verify Production: iPhone Runtime V'+from+' -> V'+expected+' manifest PASS');
          NODE
            done
          fi
          # V3.82: installability must be verified from a running V3.80/V3.81 IPA.
          if [ "$EXPECTED" = "3.82" ]; then
            for FROM in 3.81 3.80; do
              curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 75 \
                "$URL/api/update/manifest?current=$FROM&verify-v382=$(date +%s)" > "/tmp/gmww-v382-$FROM.json"
              node - "$FROM" <<'NODE'
          const fs=require('node:fs');
          const from=process.argv[2],m=JSON.parse(fs.readFileSync('/tmp/gmww-v382-'+from+'.json','utf8'));
          const req=['GMWW.html','app.js','style.css','gmww-ai-support.js','gmww-ai-support.css'];
          if(m.ok!==true||m.releaseVersion!=='3.82'||m.runtimeVersion!=='3.82'||
             m.shellVersion!=='3.17'||m.releaseType!=='runtime'||
             m.upgradeMode!=='verified-overlay'||m.optimizedFromVersion!==from)
            throw new Error('OTA V3.82 cannot be installed from Runtime V'+from);
          if(m.delete?.length)throw new Error('V3.82 would unexpectedly delete client files');
          if(m.runtime?.files?.length!==req.length)throw new Error('Unexpected OTA file count');
          for(const path of req){
            const f=m.runtime.files.find(x=>x.path===path);
            if(!f||f.url!=='https://gmww-v2-00.williampham0702.workers.dev/updates/runtime/V3.82/'+path||
               !/^[a-f0-9]{64}$/i.test(String(f.sha256||'')))
              throw new Error('Missing verified V3.82 file '+path);
          }
          console.log('V3.82 OTA from '+from+': manifest PASS');
          NODE
            done
            for FILE in GMWW.html app.js style.css gmww-ai-support.js gmww-ai-support.css; do
              # Cloudflare may redirect HTML assets to their canonical URL.
              # Hash the final response rather than the 301/302 response body.
              curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --max-time 75 \
                "$URL/updates/runtime/V3.82/$FILE" > /tmp/gmww-v382-download
              ACTUAL_SHA=$(shasum -a 256 /tmp/gmww-v382-download | awk '{print $1}')
              EXPECTED_SHA=$(node - "$FILE" <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/gmww-v382-3.81.json','utf8'));
          process.stdout.write(m.runtime.files.find(f=>f.path===process.argv[2])?.sha256||'');
          NODE
              )
              test -n "$EXPECTED_SHA"
              if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::V3.82 SHA mismatch for $FILE"
                exit 1
              fi
              echo "Verified OTA asset: $FILE"
            done
            curl --fail --silent --show-error "$URL/api/gm/ai-support/config" > /tmp/gmww-v382-ai-config.json
            node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync('/tmp/gmww-v382-ai-config.json','utf8'));
          if(d.ok!==true||typeof d.configured!=='boolean'||d.readOnly!==true)
            throw new Error('AI support status endpoint invalid');
          console.log('AI Support configured: '+d.configured);
          NODE
            AI_AUTH_STATUS=$(curl --silent --output /tmp/gmww-v382-unauthorized.json \
              --write-out '%{http_code}' -X POST -H 'content-type: application/json' \
              -d '{"message":"test"}' "$URL/api/gm/ai-support/chat")
            test "$AI_AUTH_STATUS" = "401" || {
              echo "::error::AI Support unauthenticated request returned $AI_AUTH_STATUS (expected 401)"
              exit 1
            }
            echo "AI Support authorization PASS"
          fi
          # V3.83: verify IPA overlay for V3.82 installations and exact file integrity.
          if [ "$EXPECTED" = "3.83" ]; then
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 75 \
              "$URL/api/update/manifest?current=3.82&verify-v383=$(date +%s)" > /tmp/gmww-v383.json
            node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('/tmp/gmww-v383.json','utf8'));
          const names=['GMWW.html','app.js'];
          if(m.ok!==true||m.releaseVersion!=='3.83'||m.runtimeVersion!=='3.83'||
             m.shellVersion!=='3.17'||m.releaseType!=='runtime'||
             m.upgradeMode!=='verified-overlay'||m.optimizedFromVersion!=='3.82'||
             (m.delete||[]).length!==0||m.runtime?.files?.length!==2)
            throw new Error('GMWW V3.83 OTA overlay is not ready');
          for(const path of names){
            const item=m.runtime.files.find(f=>f.path===path);
            if(!item||item.url!=='https://gmww-v2-00.williampham0702.workers.dev/updates/runtime/V3.83/'+path||
               !/^[a-f0-9]{64}$/i.test(String(item.sha256)))
              throw new Error('V3.83 OTA integrity metadata missing for '+path);
          }
          console.log('V3.83 overlay manifest verified.');
          NODE
            for FILE in GMWW.html app.js; do
              curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --max-time 75 \
                "$URL/updates/runtime/V3.83/$FILE" > /tmp/gmww-v383-file
              ACTUAL_SHA=$(shasum -a 256 /tmp/gmww-v383-file | awk '{print $1}')
              EXPECTED_SHA=$(node - "$FILE" <<'NODE'
          const fs=require('node:fs'),m=JSON.parse(fs.readFileSync('/tmp/gmww-v383.json','utf8'));
          process.stdout.write(m.runtime.files.find(f=>f.path===process.argv[2])?.sha256||'');
          NODE
              )
              test -n "$EXPECTED_SHA"
              test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "::error::V3.83 file SHA mismatch: $FILE"; exit 1; }
              echo "Verified V3.83 Runtime asset: $FILE"
            done
          fi
          # V3.72 canonical-image preflight: the exact role_guard WEBP must be
          # readable from the deployed Worker, not merely rendered as a thumbnail.
          if [ "$EXPECTED" = "3.72" ]; then
            ROLE_ART_READY=0
            for CHECK in $(seq 1 12); do
              if curl --max-time 20 -fsS "$URL/api/gm/template-role-artwork/role_guard?production-check=$CHECK-$(date +%s)" > /tmp/gmww-role-guard.webp && node - <<'NODE'
          const b=require('fs').readFileSync('/tmp/gmww-role-guard.webp');
          if(b.length<32||b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP')process.exit(1);
          console.log('Verify Production: role_guard canonical WEBP source PASS.');
          NODE
              then ROLE_ART_READY=1; break; fi
              sleep 2
            done
            if [ "$ROLE_ART_READY" != "1" ]; then echo "::error::Production role_guard artwork is unavailable"; exit 1; fi
          fi
          # Verify that an actually installed IPA V3.17 Runtime receives the correct small OTA,
          # not just the full package used by deployment validation.
          if [ "$EXPECTED" = "3.53" ]; then
            for FROM in 3.51 3.52; do
              curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/api/update/manifest?current=$FROM&otacheck=$(date +%s)" > "/tmp/ota-from-$FROM.json"
              node - "$FROM" <<'NODE'
          const fs=require('node:fs');
          const from=process.argv[2],m=JSON.parse(fs.readFileSync('/tmp/ota-from-'+from+'.json','utf8'));
          const required=['GMWW.html','app.js','style.css',...(from==='3.51'?['home-art/home-sea-portal-v352.svg']:[])];
          if(m.ok!==true||m.releaseVersion!=='3.53'||m.runtimeVersion!=='3.53'||m.shellVersion!=='3.17'
             ||m.upgradeMode!=='verified-overlay'||m.optimizedFromVersion!==from
             ||JSON.stringify(m.runtime?.files?.map(f=>f.path))!==JSON.stringify(required))process.exit(4);
          if(!m.runtime.files.every(f=>f.url==='https://gmww-v2-00.williampham0702.workers.dev/updates/runtime/V3.53/'+f.path
             && /^[a-f0-9]{64}$/i.test(f.sha256)))process.exit(5);
          console.log('Production OTA V'+from+' -> V3.53 verified '+required.length+' files PASS.');
          NODE
              for REL in GMWW.html app.js style.css; do
                OTA_URL=$(node - "$FROM" "$REL" <<'NODE'
          const fs=require('node:fs'),from=process.argv[2],path=process.argv[3];
          const m=JSON.parse(fs.readFileSync('/tmp/ota-from-'+from+'.json','utf8'));
          process.stdout.write(m.runtime.files.find(f=>f.path===path)?.url||'');
          NODE
                )
                test -n "$OTA_URL"
                curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$OTA_URL?sha-check=$(date +%s)" > /tmp/gmww-delta-file
                LOCAL_SHA=$(shasum -a 256 /tmp/gmww-delta-file | awk '{print $1}')
