name: Deploy Production

on:
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmww-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # CI-only merge cannot auto-deploy Production.
  deploy-scope:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
    steps:
      - name: Lấy đúng commit đã hoàn tất CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Chặn auto-deploy khi commit chỉ sửa CI
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > /tmp/gmww-production-change-scope.txt
          SHOULD_DEPLOY=false
          if [ ! -s /tmp/gmww-production-change-scope.txt ]; then SHOULD_DEPLOY=true; fi
          while IFS= read -r FILE; do
            case "$FILE" in
              .github/workflows/github-runtime-ota.yml|.github/runtime-release/verify-package.mjs|.github/runtime-release/verify-package.test.mjs|docs/releases/GMWW-GITHUB-RUNTIME-OTA-20261029.md|.github/scripts/ci-browser-scope.mjs|.github/workflows/check-player-card-browsers.yml|.github/workflows/deploy-production.yml|docs/releases/ci-browser-focused-gallows-20261024.md|docs/releases/GMWW-V3.203-focused-release-gate-20261024.md|tests/ci-browser-scope.test.mjs|.github/workflows/check-player-web.yml|.github/scripts/ci-browser-scope.mjs|.github/workflows/ci-policy-gate.yml|docs/releases/GMWW-CI-POLICY-GATE-20261029.md|docs/releases/GMWW-CI-SCOPED-MAIN-20261029.md|.github/workflows/check-pr-preview-github.yml|.github/scripts/guard-pr-preview-ci.mjs|tests/github-actions-pr-preview-ci.test.mjs|docs/releases/GMWW-GITHUB-ACTIONS-PR-PREVIEW-20261029.md|.github/workflows/build-server-game-ipa.yml|.github/workflows/check-dual-renderer.yml|.github/workflows/check-drunk-spiritualist.yml|tests/production-deploy-architecture-docs.test.mjs)
                ;;
              *)
                SHOULD_DEPLOY=true
                ;;
            esac
          done < /tmp/gmww-production-change-scope.txt
          # PR612: dedicated Worker-only release. Never use this generic Runtime OTA pipeline.
          if grep -Fxq 'docs/releases/GMWW-VILLAGE-REMOVE-OLD-ONLINE-20261029.md' /tmp/gmww-production-change-scope.txt &&
             grep -Fxq 'assets/village/index.html' /tmp/gmww-production-change-scope.txt; then
            SHOULD_DEPLOY=false
            echo 'PR612: dedicated Worker-only Player Web deployment; Runtime OTA unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # V3.238 recovery: deploy only the already verified Runtime, when
          # exactly this workflow and scope classifier are repaired.
          if [ "$(node -p 'require("./package.json").version')" = "3.238.0" ]; then
            COUNT=$(wc -l < /tmp/gmww-production-change-scope.txt | tr -d ' ')
            BAD=$(grep -Evc '^([.]github/workflows/deploy-production[.]yml|[.]github/scripts/ci-browser-scope[.]mjs|tests/ci-browser-scope[.]test[.]mjs)$' /tmp/gmww-production-change-scope.txt || true)
            if [ "$COUNT" = 3 ] && [ "$BAD" = 0 ]; then SHOULD_DEPLOY=true; fi
          fi
          # ICON_V2_CI_HOTFIX: verify the exact seven-file non-runtime repair.
          # Runtime V3.227 is already live; no package, Worker or GM logic changed.
          # Fail closed: a different file set, image, checksum or version deploys normally.
          if [ "$SHOULD_DEPLOY" = true ] && \
             [ "$(wc -l < /tmp/gmww-production-change-scope.txt | tr -d ' ')" = 9 ] && \
             [ "$(node -p "require('./package.json').version")" = '3.227.0' ] && \
             [ "$(sha256sum assets/action-icons/v2/01_soi_xet.svg | awk '{print $1}')" = '3d74accb407aa6344fe787e588e89e4c2da12f88e378a81cd574e8df29d52e29' ] && \
             ! grep -Ev '^(tests/gmww-action-icons-in-battle[.]test[.]mjs|assets/action-icons/v2/01_soi_xet[.]svg|assets/action-icons/v2/manifest[.]json|docs/releases/GMWW-V3[.]227-icon-action-v2-20261025[.]md|[.]github/scripts/ci-browser-scope[.]mjs|[.]github/workflows/check-player-web[.]yml|[.]github/workflows/deploy-production[.]yml|[.]github/workflows/build-server-game-ipa[.]yml|[.]github/workflows/check-dual-renderer[.]yml)$' /tmp/gmww-production-change-scope.txt; then
            SHOULD_DEPLOY=false
            echo 'V3.227: chỉ sửa kiểm thử/định dạng/manifest SHA-256 đã kiểm tra – không phát hành Runtime trùng phiên bản.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Separate artwork CI-policy PR never publishes a duplicate Runtime.
          SCOPE=$(GMWW_CI_EVENT=push node .github/scripts/ci-browser-scope.mjs | head -1)
          if [[ "$SCOPE" == "GMWW browser CI scope: icon-artwork-policy |"* || "$SCOPE" == "GMWW browser CI scope: fairy-ci-policy |"* ]]; then SHOULD_DEPLOY=false; fi
          # V3.273 Player Web login PR #599: deploy by dedicated Worker-only workflow.
          # Never publish Runtime OTA/IPA from the corresponding CI-only release repair.
          if [ "$(node -p 'require("./package.json").version')" = "3.273.0" ]; then
            if git log -1 --format=%B | grep -qE 'Merge PR #599|Merge pull request #599'; then
              SHOULD_DEPLOY=false
            elif [ "$(wc -l < /tmp/gmww-production-change-scope.txt | tr -d ' ')" = "1" ] &&
                 grep -Fxq '.github/workflows/deploy-player-web-login-v3273.yml' /tmp/gmww-production-change-scope.txt; then
              SHOULD_DEPLOY=false
            fi
          fi
          # Worker-only Player receipt recovery uses its dedicated same-SHA gated workflow.
          if [[ "$SCOPE" == "GMWW browser CI scope: player-receipt-hotfix |"* ]]; then SHOULD_DEPLOY=false; fi
          # PR550 test-only rule regression: exact verified five-file scope, no Worker/GM/IPA change.
          if [[ "$SCOPE" == "GMWW browser CI scope: night02-rule-regression-550 |"* ]]; then SHOULD_DEPLOY=false; fi
          # Exact V3.247 postmerge CI recovery is also the approved release
          # handshake for the already-merged Runtime PR #551.
          if [ "$(node -p "require('./package.json').version")" = "3.247.0" ] &&
             [[ "$SCOPE" == "GMWW browser CI scope: icon-scale-3247-postmerge |"* ]]; then
            SHOULD_DEPLOY=true
          fi
          # Audited V3.248 CI-only follow-up must trigger the pending Runtime release.
          if [ "$(node -p "require('./package.json').version")" = "3.248.0" ] &&
             [[ "$SCOPE" == "GMWW browser CI scope: runtime-3248-postmerge |"* ]]; then
            SHOULD_DEPLOY=true
          fi
          # V3.274 PR613 recovery: deliver the already-merged, previously blocked
          # artwork runtime ONLY for the exact five-file CI repair and ancestor.
          if grep -Fxq 'docs/releases/GMWW-PR613-postmerge-ci-20261029.md' /tmp/gmww-production-change-scope.txt; then
            test "$(node -p 'require("./package.json").version')" = '3.274.0'
            git merge-base --is-ancestor 2171214cec2c9af92994c27caaa8f75e976dbb1c HEAD
            ACTUAL=$(sort /tmp/gmww-production-change-scope.txt)
            EXPECTED=$(printf '%s\n' \
              '.github/scripts/ci-browser-scope.mjs' \
              '.github/workflows/check-player-web.yml' \
              '.github/workflows/deploy-production.yml' \
              'tests/ci-browser-scope.test.mjs' \
              'docs/releases/GMWW-PR613-postmerge-ci-20261029.md' | sort)
            test "$ACTUAL" = "$EXPECTED" || { echo "::error::Unexpected paths in V3.274 OTA CI repair"; exit 1; }
            SHOULD_DEPLOY=true
            echo 'PR613: previously merged V3.274 Runtime, strictly audited CI recovery; no IPA or DO modification.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # PR613 second CI-only proof correction: source remains V3.274.
          if grep -Fxq 'docs/releases/GMWW-PR613-release-proof-ci-20261029.md' /tmp/gmww-production-change-scope.txt; then
            test "$(node -p 'require("./package.json").version')" = '3.274.0'
            git merge-base --is-ancestor 2171214cec2c9af92994c27caaa8f75e976dbb1c HEAD
            ACTUAL=$(sort /tmp/gmww-production-change-scope.txt)
            EXPECTED=$(printf '%s\n' \
              '.github/scripts/ci-browser-scope.mjs' \
              '.github/workflows/deploy-production.yml' \
              'tests/ci-browser-scope.test.mjs' \
              'docs/releases/GMWW-PR613-release-proof-ci-20261029.md' | sort)
            test "$ACTUAL" = "$EXPECTED" || { echo "::error::V3.274 release-proof scope mismatch"; exit 1; }
            SHOULD_DEPLOY=true
            echo 'PR613: release-only CI proof correction, original role checks retained; no source or IPA changes.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # PR613 V3.274 verification-only correction: the public Character40
          # image route intentionally serves canonical originals, not generated
          # deploy-time thumbnails. Only exact five-file CI/docs repair is allowed.
          if grep -Fxq 'docs/releases/GMWW-PR613-character40-proof-ci-20261029.md' /tmp/gmww-production-change-scope.txt; then
            test "$(node -p 'require("./package.json").version')" = '3.274.0'
            git merge-base --is-ancestor 2171214cec2c9af92994c27caaa8f75e976dbb1c HEAD
            ACTUAL=$(sort /tmp/gmww-production-change-scope.txt)
            EXPECTED=$(printf '%s\n' \
              '.github/scripts/ci-browser-scope.mjs' \
              '.github/scripts/verify-character40-production.mjs' \
              '.github/workflows/deploy-production.yml' \
              'tests/ci-browser-scope.test.mjs' \
              'docs/releases/GMWW-PR613-character40-proof-ci-20261029.md' | sort)
            test "$ACTUAL" = "$EXPECTED" || { echo "::error::V3.274 Character40 proof repair scope mismatch"; exit 1; }
            grep -Fq "u.pathname='/characters/gmww40/originals/'+visual+'.webp'" src/gmww-character40-catalog.js
            SHOULD_DEPLOY=true
            echo 'V3.274 PR613: canonical Character40 original-image SHA proof repaired; Runtime source/IPA/data unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # PR629 Native OTA Stage 2: exact 10-file Native-only release.
          # Never deploy Worker/Cloudflare Production for this IPA feature.
          if grep -Fxq 'docs/releases/GMWW-NATIVE-GITHUB-OTA-STAGE2-20261029.md' /tmp/gmww-production-change-scope.txt; then
            EXPECTED=$(printf '%s\n' \
              'server-game/GMWW-Server/GameView.swift' \
              'server-game/src/10-library-and-settings.part' \
              'server-game/current/app.js' \
              '.github/workflows/build-server-game-ipa.yml' \
              '.github/scripts/ci-browser-scope.mjs' \
              '.github/workflows/check-player-web.yml' \
              '.github/workflows/check-native-github-ota.yml' \
              '.github/workflows/deploy-production.yml' \
              'tests/native-github-first-ota-stage2.test.mjs' \
              'docs/releases/GMWW-NATIVE-GITHUB-OTA-STAGE2-20261029.md' | sort)
            ACTUAL=$(sort /tmp/gmww-production-change-scope.txt)
            test "$ACTUAL" = "$EXPECTED" || { echo "::error::PR629 Native OTA scope expanded; refuse silent deploy-skip"; exit 1; }
            test "$(node -p 'require("./package.json").version')" = '3.275.0'
            grep -Fq 'GMWW_NATIVE_GITHUB_OTA=true' server-game/GMWW-Server/GameView.swift
            SHOULD_DEPLOY=false
            echo 'PR629 Native OTA only: Cloudflare Worker, IPA Production and game data are isolated.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The exact CI-only scope extension for Player V3.277 must never deploy gameplay.
          CI_PLAYER_PATHS=$(printf '%s\n' \
            '.github/scripts/ci-browser-scope.mjs' \
            '.github/scripts/player-interactions-scope.mjs' \
            '.github/workflows/check-player-web.yml' \
            '.github/workflows/deploy-production.yml' \
            'tests/player-interactions-ci.test.mjs' | sort)
          if [ "$(sort /tmp/gmww-production-change-scope.txt)" = "$CI_PLAYER_PATHS" ]; then
            SHOULD_DEPLOY=false
            echo 'CI-only Player lobby V3.277 scope extension: skip Production/Runtime.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # BEGIN GMWW_ARCHITECTURE_DOCS_GUARD
          # Documentation-only changes must never trigger a Worker/Runtime publish.
          # A mixed source/assets change is NOT exempt. Keep this after legacy overrides.
          GMWW_DOCS_SCOPE_FILE="${GMWW_PRODUCTION_CHANGED_PATH:-/tmp/gmww-production-change-scope.txt}"
          if [ -s "$GMWW_DOCS_SCOPE_FILE" ] && ! grep -Ev '^docs/architecture/[A-Za-z0-9._/-]+[.]md$' "$GMWW_DOCS_SCOPE_FILE" >/dev/null; then
            SHOULD_DEPLOY=false
            echo 'GĐ1–GĐ3 architecture documentation only: skip Production Worker/Runtime.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # END GMWW_ARCHITECTURE_DOCS_GUARD

          # BEGIN GMWW_PR637_STAGED_RELEASE_GUARD
          # A merge of the link-sharing UI is NOT an automatic Runtime/Worker release.
          # The CI-only guard PR must likewise not trigger Production.
          RELEASE_PATHS=$(sort /tmp/gmww-production-change-scope.txt)
          POLICY_ONLY=$(printf '%s\n' \
            '.github/scripts/ci-browser-scope.mjs' \
            '.github/workflows/deploy-production.yml' \
            '.github/workflows/github-runtime-ota.yml' \
            'docs/releases/GMWW-CI-SCOPED-MAIN-20261029.md' \
            'tests/ci-browser-scope.test.mjs' | sort)
          PR637_ONLY=$(printf '%s\n' \
            '.github/scripts/ci-browser-scope.mjs' \
            '.github/workflows/build-server-game-ipa.yml' \
            '.github/workflows/check-gallows-redesign.yml' \
            '.github/workflows/check-gm-free-icons-501.yml' \
            '.github/workflows/check-gm-player-link-share.yml' \
            '.github/workflows/check-player-web.yml' \
            '.github/workflows/prepare-runtime-v3202-candidate.yml' \
            'server-game/current/GMWW.html' \
            'tests/gm-player-web-share-link.test.mjs' | sort)
          if [ "$RELEASE_PATHS" = "$POLICY_ONLY" ]; then
            SHOULD_DEPLOY=false
            echo "CI-only PR637 release guard: no Production deployment." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE_PATHS" = "$PR637_ONLY" ] ||
             git log -1 --format=%B | grep -Eq '(^Merge pull request #637([[:space:]]|$)|\(#637\)$)'; then
            grep -Fq 'BEGIN GMWW_PLAYER_SHARE_SCRIPT' server-game/current/GMWW.html || {
              echo "::error::PR637 marker missing; refuse automatic deploy"; exit 1;
            }
            SHOULD_DEPLOY=false
            echo "PR637 staged release: NEVER auto-deploy Worker/Runtime; explicit gated dispatch required." >> "$GITHUB_STEP_SUMMARY"
          fi
          # END GMWW_PR637_STAGED_RELEASE_GUARD

          # PR645 V3.279: postmerge browser gate repair releases the already
          # owner-accepted Online runtime ONLY for this exact CI-only fix.
          # This is NOT a general exception: the downstream deploy job still
          # requires same-SHA Worker CI, Chrome/Edge/WebKit CI and OTA guards.
          if [ "$(node -p 'require("./package.json").version')" = '3.279.0' ] &&
             git merge-base --is-ancestor d9527d6625868c0a25395e8ebf982446b4e4712b HEAD; then
            ACTUAL=$(sort /tmp/gmww-production-change-scope.txt)
            EXPECTED=$(printf '%s\n' \
              '.github/workflows/check-player-card-browsers.yml' \
              '.github/workflows/deploy-production.yml' | sort)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              grep -Fq 'function gmwwOnlinePlaceAtFire(dock){' src/player-web-src/35-online-chat.part || {
                echo "::error::PR645 modern Online renderer missing; refusing V3.279 release"; exit 1;
              }
              SHOULD_DEPLOY=true
              echo 'PR645 V3.279: exact postmerge browser CI fix; keep all same-SHA browser/Worker/OTA production gates.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_DEPLOY" = false ]; then
            echo "CHỈ CI: BỎ QUA DEPLOY PRODUCTION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Có thay đổi ngoài CI: tiếp tục các chốt phát hành Production hiện có" >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: deploy-scope
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.deploy-scope.result == 'success' &&
         needs.deploy-scope.outputs.should_deploy == 'true' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Xác định phiên bản đã kiểm thử
        id: tested
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Release V3.203 was checked by the dedicated Gallows CI. Never waive gates
      # for an arbitrary release: exact version, merged commit and same-SHA tests.
      - name: Tải mã nguồn đã xác minh trước khi chọn kiểm thử phát hành
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested.outputs.sha }}
          fetch-depth: 0

      - name: Kiểm tra phê duyệt phát hành Lên Giàn V3.203 theo CI đúng phạm vi
        if: github.event_name == 'workflow_dispatch'
        id: gallows_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./package.json').version")
          # All other releases retain the existing full-browser gate.
          if [ "$VERSION" != "3.203.0" ]; then
            echo "Phiên bản khác V3.203: giữ kiểm tra trình duyệt phát hành hiện có."
            exit 0
          fi
          test -f docs/release-notes-gallows-panel-20261024.md || {
            echo "::error::Thiếu release notes V3.203"; exit 1;
          }
          git merge-base --is-ancestor d97ff983668a2e92729cf5718015b3250119b5e2 HEAD || {
            echo "::error::V3.203 chưa chứa PR #463 đã merge"; exit 1;
          }
          RESPONSE=$(curl -fsSL --retry 3 --connect-timeout 8 --max-time 25 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$TESTED_SHA&per_page=100")
          # Both reports must be success on the exact main SHA (not PR test SHA).
          REPORT=$(printf '%s' "$RESPONSE" | node -e "
            let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{
              const a=(JSON.parse(s).workflow_runs||[]).filter(r=>r.head_sha===process.env.TESTED_SHA);
              const good=(name,event)=>a.some(r=>r.name===name&&r.event===event&&r.conclusion==='success');
              const gallows=good('Check Lên Giàn theo đúng phạm vi','workflow_dispatch');
              const worker=good('Check Player Web Worker','push');
              process.stdout.write(gallows&&worker?'success':'missing focused Gallows or Worker CI');
            })")
          if [ "$REPORT" != "success" ]; then
            echo "::error::Không phát hành V3.203: $REPORT"; exit 1;
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "V3.203: CI Lên Giàn + Player Web Worker SUCCESS cùng SHA; không chạy kiểm thử Card/Seat không liên quan." >> "$GITHUB_STEP_SUMMARY"

      # Strict V3.204 gallows-only exception. Exact Runtime and same-SHA focused
      # CI are required; other releases retain normal gates unchanged.
      - name: Kiểm tra phát hành V3.204 chỉ bằng CI Lên Giàn liên quan
        id: gallows_release_3204
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "3.204.0" ]; then exit 0; fi
          test -f docs/releases/GMWW-V3.204-gallows-unified-20261024.md || { echo "::error::Thiếu release notes V3.204"; exit 1; }
          grep -q 'battleGallowsSeconds' server-game/current/GMWW.html || { echo "::error::Chưa có menu Lên Giàn mới"; exit 1; }
          grep -q "d.type==='gallows_updated'" server-game/current/app.js || { echo "::error::Chưa đồng bộ realtime Lên Giàn"; exit 1; }
          # Both independent workflows must report SUCCESS for this exact main SHA.
          REPORT="pending"
          for TRY in $(seq 1 40); do
            RESPONSE=$(curl -fsSL --retry 2 --connect-timeout 8 --max-time 25 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$TESTED_SHA&per_page=100")
            REPORT=$(printf '%s' "$RESPONSE" | node -e "
              let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>{
                const a=(JSON.parse(s).workflow_runs||[]).filter(r=>r.head_sha===process.env.TESTED_SHA&&r.event==='push');
                const status=name=>{const r=a.filter(x=>x.name===name).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at))[0];return !r?'pending':r.conclusion||(r.status==='completed'?'failure':'pending')};
                const gallows=status('Check Lên Giàn theo đúng phạm vi');
                const worker=status('Check Player Web Worker');
                process.stdout.write([gallows,worker].every(x=>x==='success')?'success':
                  [gallows,worker].some(x=>['failure','cancelled','timed_out','action_required','skipped'].includes(x))?'failure':'pending')
              })")
            echo "V3.204 kiểm tra Lên Giàn và Worker $TRY: $REPORT"
            if [ "$REPORT" = success ]; then
              echo "approved=true" >> "$GITHUB_OUTPUT"
              echo "V3.204: Lên Giàn + Worker CI SUCCESS cùng SHA, không ép test Card/Seat." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$REPORT" = failure ]; then echo "::error::CI liên quan chưa đạt, dừng phát hành an toàn."; exit 1; fi
            sleep 15
          done
          echo "::error::Không có hai CI Lên Giàn và Worker SUCCESS cùng SHA; không deploy."
          exit 1

      # V3.205: PR changes ONLY Gallows nomination UX and GM dead visibility.
      # Separate same-SHA gates must pass; no unrelated Chrome cards/Seat tests.
      - name: Phát hành V3.205 sau CI Lên Giàn / Worker đúng phạm vi
        id: gallows_release_3205
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "3.205.0" ]; then exit 0; fi
          test -f docs/releases/GMWW-V3.205-gallows-pirate-flag-20261024.md || {
            echo "::error::Thiếu ghi chú Runtime V3.205"; exit 1;
          }
          grep -q 'battleShowDead' server-game/current/GMWW.html || exit 1
