name: Deploy Production

on:
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmww-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tested commit
        id: tested
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested.outputs.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Classify and prepare GMWW update channel
        id: update
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.tested.outputs.sha }}"
          git diff-tree --no-commit-id --name-only -r "$SHA" > /tmp/gmww-changed-files.txt
          cat /tmp/gmww-changed-files.txt
          export GMWW_CHANGED_FILES="$(cat /tmp/gmww-changed-files.txt)"
          TYPE=$(node .github/scripts/classify-update.mjs | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).releaseType))")
          echo "release_type=$TYPE" >> "$GITHUB_OUTPUT"

          # Restore the pinned canonical source, then publish ONLY the 63 clean originals.
          SOURCE="server-game/legacy-assets/v252"
          ARCHIVE="/tmp/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          URL="https://github.com/WilliamPham0702/GMWW-V2.00/releases/download/legacy-assets-v252/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          EXPECTED_SHA="b9229b9b48f5fa3e63dfb831e0ac523cad0ec469d3e3b8c2dca59ef594616c36"
          CLEAN_COUNT=0
          if test -d "$SOURCE/assets/role-artwork-v251/original"; then
            CLEAN_COUNT=$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')
          fi
          if ! test -s "$SOURCE/role-artwork-v251.js" || test "$CLEAN_COUNT" -ne 63; then
            rm -rf "$SOURCE"
            curl --fail --location --retry 4 --retry-delay 3 --output "$ARCHIVE" "$URL"
            echo "$EXPECTED_SHA  $ARCHIVE" | shasum -a 256 -c -
            unzip -q "$ARCHIVE" -d .
          fi
          test "$(find "$SOURCE/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 63

          node .github/scripts/prepare-update-channel.mjs "$TYPE"

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Block GMWW version rollback
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="https://gmww-v2-00.williampham0702.workers.dev/api/health"
          for i in $(seq 1 8); do
            if curl --connect-timeout 8 --max-time 15 -fsS "$HEALTH?version-guard=$i" > /tmp/gmww-live-health.json &&
               node .github/scripts/verify-gmww-versions.mjs /tmp/gmww-live-health.json; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deployment blocked: candidate is older than Production, versions are inconsistent or Production health is unavailable."
          exit 1

      - name: Deploy Worker to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          EXPECTED=$(node -e "const p=require('./package.json');process.stdout.write(String(p.version).replace(/\.0$/,''))")
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health?verify=$i" > /tmp/health.json &&
               grep -q '"project":"GMWW-V2.00"' /tmp/health.json &&
               grep -q "\"version\":\"V$EXPECTED\"" /tmp/health.json; then
              OK=1
              break
            fi
            sleep 3
          done
          cat /tmp/health.json
          test "$OK" = "1"
          EXPECTED_SHELL=$(node -e "const fs=require('fs'),s=fs.readFileSync('src/index.js','utf8'),m=s.match(/NATIVE_SHELL_VERSION=\\\"([^\\\"]+)\\\"/);if(!m)process.exit(2);process.stdout.write(m[1])")
          MANIFEST_OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/update/manifest?verify=$i-$(date +%s)" > /tmp/manifest.json; then
              if node - "$EXPECTED" "$EXPECTED_SHELL" <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const expected=process.argv[2],shell=process.argv[3];
          if(String(m.releaseVersion||'')!==expected)throw new Error('Manifest releaseVersion is stale');
          if(expected!==shell){
            if(m.releaseType!=='runtime')throw new Error('Newer runtime was hidden as '+String(m.releaseType||'missing'));
            if(String(m.shellVersion||'')!==shell)throw new Error('Runtime shellVersion mismatch');
            if(String(m.runtimeVersion||'')!==expected)throw new Error('Runtime version does not match releaseVersion');
            if(!Array.isArray(m.runtime?.files)||m.runtime.files.length===0)throw new Error('Runtime update manifest has no files');
            for(const f of m.runtime.files){
              if(!String(f?.path||'').trim()||!String(f?.url||'').startsWith('https://')||!/^[a-f0-9]{64}$/i.test(String(f?.sha256||'')))throw new Error('Invalid runtime file entry');
            }
            const required=['GMWW.html','app.js','style.css','character-renderer.js','character-renderer.css','gm/gm-white-wolf.webp'];
            for(const p of required)if(!m.runtime.files.some(x=>String(x?.path||'')===p))throw new Error('Runtime package missing '+p);
            const rider=m.runtime.files.filter(x=>String(x?.path||'')==='gm/gm-white-wolf.webp');
            if(rider.length!==1)throw new Error('GM rider asset must appear exactly once in runtime manifest');
            const clean=m.runtime.files.filter(x=>/^assets\/role-artwork-v251\/original\/[^/]+\.webp$/.test(String(x?.path||'')));
            const cleanIndex=m.runtime.files.some(x=>String(x?.path||'')==='role-artwork-v251.js');
            if((cleanIndex||clean.length>0)&&clean.length!==63)throw new Error('Expected 63 clean role artworks in runtime update');
          }else if(m.releaseType==='native'){
            if(String(m.ipa?.version||'')!==expected)throw new Error('Native IPA version does not match releaseVersion');
            if(String(m.ipa?.fileName||'')!=='GMWW-V'+expected+'.ipa')throw new Error('Native IPA filename is stale');
          }
          NODE
              then
                MANIFEST_OK=1
                break
              fi
            fi
            sleep 3
          done
          cat /tmp/manifest.json
          test "$MANIFEST_OK" = "1"
          # V3.72 canonical-image preflight: the exact role_guard WEBP must be
          # readable from the deployed Worker, not merely rendered as a thumbnail.
          if [ "$EXPECTED" = "3.72" ]; then
            ROLE_ART_READY=0
            for CHECK in $(seq 1 12); do
              if curl --max-time 20 -fsS "$URL/api/gm/template-role-artwork/role_guard?production-check=$CHECK-$(date +%s)" > /tmp/gmww-role-guard.webp && node - <<'NODE'
          const b=require('fs').readFileSync('/tmp/gmww-role-guard.webp');
          if(b.length<32||b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP')process.exit(1);
          console.log('Verify Production: role_guard canonical WEBP source PASS.');
          NODE
              then ROLE_ART_READY=1; break; fi
              sleep 2
            done
            if [ "$ROLE_ART_READY" != "1" ]; then echo "::error::Production role_guard artwork is unavailable"; exit 1; fi
          fi
          # Verify that an actually installed IPA V3.17 Runtime receives the correct small OTA,
          # not just the full package used by deployment validation.
          if [ "$EXPECTED" = "3.53" ]; then
            for FROM in 3.51 3.52; do
              curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/api/update/manifest?current=$FROM&otacheck=$(date +%s)" > "/tmp/ota-from-$FROM.json"
              node - "$FROM" <<'NODE'
          const fs=require('node:fs');
          const from=process.argv[2],m=JSON.parse(fs.readFileSync('/tmp/ota-from-'+from+'.json','utf8'));
          const required=['GMWW.html','app.js','style.css',...(from==='3.51'?['home-art/home-sea-portal-v352.svg']:[])];
          if(m.ok!==true||m.releaseVersion!=='3.53'||m.runtimeVersion!=='3.53'||m.shellVersion!=='3.17'
             ||m.upgradeMode!=='verified-overlay'||m.optimizedFromVersion!==from
             ||JSON.stringify(m.runtime?.files?.map(f=>f.path))!==JSON.stringify(required))process.exit(4);
          if(!m.runtime.files.every(f=>f.url==='https://gmww-v2-00.williampham0702.workers.dev/updates/runtime/V3.53/'+f.path
             && /^[a-f0-9]{64}$/i.test(f.sha256)))process.exit(5);
          console.log('Production OTA V'+from+' -> V3.53 verified '+required.length+' files PASS.');
          NODE
              for REL in GMWW.html app.js style.css; do
                OTA_URL=$(node - "$FROM" "$REL" <<'NODE'
          const fs=require('node:fs'),from=process.argv[2],path=process.argv[3];
          const m=JSON.parse(fs.readFileSync('/tmp/ota-from-'+from+'.json','utf8'));
          process.stdout.write(m.runtime.files.find(f=>f.path===path)?.url||'');
          NODE
                )
                test -n "$OTA_URL"
                curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$OTA_URL?sha-check=$(date +%s)" > /tmp/gmww-delta-file
                LOCAL_SHA=$(shasum -a 256 /tmp/gmww-delta-file | awk '{print $1}')
                EXPECTED_SHA=$(node - "$FROM" "$REL" <<'NODE'
          const fs=require('node:fs'),from=process.argv[2],path=process.argv[3];
          const m=JSON.parse(fs.readFileSync('/tmp/ota-from-'+from+'.json','utf8'));
          process.stdout.write(m.runtime.files.find(f=>f.path===path)?.sha256||'');
          NODE
                )
                test "$LOCAL_SHA" = "$EXPECTED_SHA"
              done
              echo "Verify Production: IPA V3.17 OTA V$FROM SHA-256 PASS."
            done
          fi
          if test "$EXPECTED" != "$EXPECTED_SHELL"; then
            RIDER_URL=$(node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));process.stdout.write(String(m.runtime.files.find(x=>x.path==='gm/gm-white-wolf.webp')?.url||''))")
            test -n "$RIDER_URL"
            echo "Verify Production: downloading immutable GM rider asset."
            curl --retry 10 --retry-all-errors --retry-delay 2 -fsS "$RIDER_URL?verify=$(date +%s)" > /tmp/gm-white-wolf-runtime.webp
            EXPECTED_RIDER_SHA=$(shasum -a 256 assets/gm/gm-white-wolf.webp | awk '{print $1}')
            ACTUAL_RIDER_SHA=$(shasum -a 256 /tmp/gm-white-wolf-runtime.webp | awk '{print $1}')
            if test "$EXPECTED_RIDER_SHA" != "$ACTUAL_RIDER_SHA"; then
              echo "::error::Runtime GM rider hash does not match deployed bytes (expected $EXPECTED_RIDER_SHA, observed $ACTUAL_RIDER_SHA)"
              exit 1
            fi
            echo "Verify Production: GM rider hash PASS."
            # Artwork must be available as exact bytes after OTA, not merely in GitHub.
            echo "Verify Production: checking every Trang Chu artwork in live Runtime."
            for ART in home-fantasy-hero-v337.webp home-v1-book.webp home-v1-members.webp home-v1-action.webp home-sea-portal-v352.svg home-sea-portal-v354.svg home-sea-cards-v354.svg home-sea-members-v354.svg home-sea-templates-v354.svg; do
              REL="home-art/$ART"
              ART_URL=$(node - "$REL" <<'NODE'
          const fs=require('fs'),m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const file=m.runtime?.files?.find(f=>f.path===process.argv[2]);
          if(!file?.url)process.exit(2);
          process.stdout.write(file.url);
          NODE
              )
              curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$ART_URL?verify=$(date +%s)" > "/tmp/$ART"
              EXPECTED_ART_SHA=$(shasum -a 256 "server-game/current/$REL" | awk '{print $1}')
              LIVE_ART_SHA=$(shasum -a 256 "/tmp/$ART" | awk '{print $1}')
              if test "$EXPECTED_ART_SHA" != "$LIVE_ART_SHA"; then
                echo "::error::Production Home artwork mismatch: $ART"
                exit 1
              fi
              echo "Verify Production: Home artwork $ART PASS."
            done
          fi
          echo "Verify Production: checking task-review UI in versioned runtime."
          # Verify the exact GM runtime UI delivered by the OTA, not only the Worker version.
          TASK_APP_URL=$(node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));process.stdout.write(String(m.runtime?.files?.find(f=>f.path==='app.js')?.url||''))")
          TASK_HTML_URL=$(node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));process.stdout.write(String(m.runtime?.files?.find(f=>f.path==='GMWW.html')?.url||''))")
          test -n "$TASK_APP_URL" && test -n "$TASK_HTML_URL"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$TASK_APP_URL?verify=$(date +%s)" > /tmp/gmww-ota-app.js
          curl --location --retry 8 --retry-all-errors --retry-delay 2 -fsS "$TASK_HTML_URL?verify=$(date +%s)" > /tmp/gmww-ota.html
          echo "Verify Production: OTA app and HTML fetched."
          echo "Verify Production: checking V3.58 Settings grid directly in deployed Runtime."
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/updates/runtime/V$EXPECTED/style.css?settings-grid-check=$(date +%s)" > /tmp/gmww-ota-settings.css
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const html=fs.readFileSync('/tmp/gmww-ota.html','utf8');
          const css=fs.readFileSync('/tmp/gmww-ota-settings.css','utf8');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const expected=manifest.runtime.files.find(f=>f.path==='style.css')?.sha256;
          const ids=['settingsRunHealth','auditLocalData','clearRuntimeCache','reloadApp','opsRunFullAudit','opsCheckRoom','opsCheckRelease','opsAutoCheck','checkServerHealth','refreshServerData','openPlayerWeb','runSystemDiagnostics','quickRepairSystem','checkPlayerWebNow'];
          const settings=html.slice(html.indexOf('id="settingsGroupHealth"'),html.indexOf('id="settingsGroupTasks"'));
          const checks={
            '14 distinct tools':ids.every(id=>settings.split('id="'+id+'"').length===2),
            'single visible grid':settings.includes('id="settingsToolsRail"'),
            'no horizontal navigation':!settings.includes('id="settingsToolsNext"')&&!settings.includes('id="settingsToolsPrev"'),
            'three columns':css.includes('grid-template-columns:repeat(3,minmax(0,1fr))!important'),
            'no horizontal clipping':css.includes('overflow-x:visible!important'),
            'CSS manifest checksum':Boolean(expected)&&sha(css)===expected
          };
          for(const [label,pass] of Object.entries(checks))console.log('Production Settings grid: '+label+' '+(pass?'PASS':'FAIL'));
          if(Object.values(checks).some(pass=>!pass))process.exit(1);
          NODE
          echo "Verify Production: all 14 Settings tools visible via responsive grid PASS."
          node - "$EXPECTED" <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const version=process.argv[2],app=fs.readFileSync('/tmp/gmww-ota-app.js','utf8'),html=fs.readFileSync('/tmp/gmww-ota.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const sha=text=>crypto.createHash('sha256').update(text).digest('hex');
          const expectedSha=p=>manifest.runtime.files.find(f=>f.path===p)?.sha256;
          const checks={
            'JS version':app.includes("const VERSION='"+version+"';"),
            'task review function':app.includes('function gmwwTaskReviewLink'),
            'complete button':app.includes('XÁC NHẬN HOÀN THÀNH'),
            'skip button':app.includes('BỎ QUA'),
            'HTML work list':html.includes('id="gmwwTasksOpenList"'),
            'HTML version':html.includes('GMWW V'+version),
            'manifest JS SHA':sha(app)===expectedSha('app.js'),
            'manifest HTML SHA':sha(html)===expectedSha('GMWW.html')
          };
          for(const [label,pass] of Object.entries(checks))console.log('GMWW OTA asset check: '+label+' '+(pass?'PASS':'FAIL'));
          if(Object.values(checks).some(x=>!x))process.exit(1);
          console.log('GMWW task review controls verified in live OTA runtime V'+version);
          NODE
          echo "Verify Production: connected Theme editor controls on live IPA Runtime."
          node - <<'NODE'
          const fs=require('node:fs');
          const app=fs.readFileSync('/tmp/gmww-ota-app.js','utf8');
          const html=fs.readFileSync('/tmp/gmww-ota.html','utf8');
          const allowed=['bg.home','bg.play','bg.library','bg.settings',
            'banner.home','ui.homePortal','ui.exploreDeck','ui.exploreMembers','ui.exploreTemplates','ui.bottomNavArt'];
          const block=app.match(/const THEME_UI_GROUPS=([\s\S]*?);\n\nconst DEFAULT_STATE=/)?.[1];
          if(!block)throw Error('Active theme UI control list missing');
          const actual=[...block.matchAll(/\['([^']+)',/g)].map(m=>m[1]);
          if(actual.length!==allowed.length||actual.some(x=>!allowed.includes(x)))
            throw Error('Dead or unlinked theme UI slots visible: '+actual.join(', '));
          for(const slot of allowed)if(!actual.includes(slot))throw Error('Missing linked theme slot '+slot);
          for(const marker of ['ACTIVE_THEME_IMAGE_TARGETS','ACTIVE_THEME_BACKGROUND_TARGETS','ACTIVE_THEME_NAV_TARGETS',
            "ui.exploreTemplates","img.setAttribute('src',src||img.dataset.themeDefaultSrc)"])
            if(!app.includes(marker))throw Error('Theme consumer missing: '+marker);
          if(!html.includes('data-home-library-tab="templates"')||!html.includes('id="gmwwHomeEnterVillage"'))
            throw Error('Homepage does not provide active theme targets');
          console.log('Verify Production: 10 linked theme slots, 6 homepage image controls and default resets PASS.');
          NODE
          node .github/scripts/verify-incremental-ota.mjs "$URL" "$EXPECTED"
          curl -fsS "$URL/api/web-sync?verify=$(date +%s)" > /tmp/web-sync.json
          grep -q '"ok":true' /tmp/web-sync.json
          curl -fsS "$URL/?verify=$(date +%s)" > /tmp/player.html
          grep -q 'GMWW PLAYER' /tmp/player.html
          grep -Fq '.app{width:100%;max-width:none;min-height:100dvh;margin:0' /tmp/player.html
          ! grep -Fq '.app{width:min(430px,100%)' /tmp/player.html
          curl -fsS "$URL/village/village.mjs?verify=$(date +%s)" > /tmp/village.mjs
          node --check /tmp/village.mjs
          grep -Fq 'document.documentElement.classList.add("embedded")' /tmp/village.mjs
          grep -Fq 'visualFallbackMoves' /tmp/village.mjs
          grep -Fq 'bridgeIncomingPositions' /tmp/village.mjs
          curl -fsS "$URL/village/village.css?verify=$(date +%s)" > /tmp/village.css
          curl -fsS "$URL/village/seat-leaf.webp?verify=$(date +%s)" > /tmp/seat-leaf.webp
          test "$(shasum -a 256 assets/village/seat-leaf.webp | awk '{print $1}')" = "$(shasum -a 256 /tmp/seat-leaf.webp | awk '{print $1}')"
          grep -Fq '/village/seat-leaf.webp' /tmp/village.css
          grep -Fq 'html.embedded .panel{display:none!important}' /tmp/village.css
          curl --retry 10 --retry-all-errors --retry-delay 2 -fsS "$URL/gm/gm-white-wolf.webp?verify=$(date +%s)" > /tmp/gm-white-wolf.webp
          test "$(wc -c < /tmp/gm-white-wolf.webp | tr -d ' ')" -gt 50000
          test "$(shasum -a 256 assets/gm/gm-white-wolf.webp | awk '{print $1}')" = "$(shasum -a 256 /tmp/gm-white-wolf.webp | awk '{print $1}')"
          echo "Verify Production: checking isolated Character V4 Web studio."
          curl --location --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/characters/v4/index.html?verify=$(date +%s)" > /tmp/character-v4-web.html
          grep -Fq '20 Character mới' /tmp/character-v4-web.html
          grep -Fq 'Chưa phát hành Character mới vào trận' /tmp/character-v4-web.html
          grep -Fq 'action-lab.mjs' /tmp/character-v4-web.html
          curl --location --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/characters/v4/action-lab.mjs?verify=$(date +%s)" > /tmp/character-v4-action-lab.mjs
          node --check /tmp/character-v4-action-lab.mjs
          grep -Fq 'export function sampleV4Action' /tmp/character-v4-action-lab.mjs
          grep -Fq 'export function createV4StageController' /tmp/character-v4-action-lab.mjs
          echo "Verify Production: V4 nine-action motion lab JavaScript PASS."
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/api/game-characters/v4?verify=$(date +%s)" > /tmp/character-v4.json
          node - <<'NODE'
          const fs=require('node:fs');
          const v4=JSON.parse(fs.readFileSync('/tmp/character-v4.json','utf8'));
          if(!v4.ok||v4.webOnly!==true||v4.ipaDeployed!==false||v4.count!==20||v4.approvedCount!==0||v4.characters?.length!==20)process.exit(1);
          if(v4.previewCount!==2||!v4.characters.every(c=>!c.approved))process.exit(2);
          if(!v4.characters.slice(0,2).every(c=>c.hasArtwork&&c.status==='preview-artwork'))process.exit(3);
          if(!v4.characters.slice(2).every(c=>!c.hasArtwork&&c.status==='awaiting-artwork'))process.exit(4);
          console.log('Verify Production: Character V4 two actual artwork previews + 18 pending PASS.');
          NODE
          echo "Verify Production: checking real Character 01/02 four-direction artwork."
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/characters/v4/approved-two-characters.avif?verify=$(date +%s)" > /tmp/v4-two-characters.avif
          test "$(wc -c </tmp/v4-two-characters.avif)" -gt 10000
          test "$(shasum -a 256 assets/characters/v4/approved-two-characters.avif | awk '{print $1}')" = "$(shasum -a 256 /tmp/v4-two-characters.avif | awk '{print $1}')"
          for VIEW in front left right back; do
            curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/api/game-characters/character-01/image?dir=$VIEW" > "/tmp/char01-$VIEW.svg"
            grep -Fq '<svg xmlns="http://www.w3.org/2000/svg"' "/tmp/char01-$VIEW.svg"
            grep -Fq 'data:image/avif;base64,' "/tmp/char01-$VIEW.svg"
            curl --retry 8 --retry-all-errors --retry-delay 2 -fsS "$URL/api/game-characters/character-02/image?dir=$VIEW" > "/tmp/char02-$VIEW.svg"
            grep -Fq '<svg xmlns="http://www.w3.org/2000/svg"' "/tmp/char02-$VIEW.svg"
            grep -Fq 'data:image/avif;base64,' "/tmp/char02-$VIEW.svg"
          done
