name: Deploy Production

on:
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmww-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tested commit
        id: tested
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested.outputs.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Classify and prepare GMWW update channel
        id: update
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.tested.outputs.sha }}"
          git diff-tree --no-commit-id --name-only -r "$SHA" > /tmp/gmww-changed-files.txt
          cat /tmp/gmww-changed-files.txt
          export GMWW_CHANGED_FILES="$(cat /tmp/gmww-changed-files.txt)"
          TYPE=$(node .github/scripts/classify-update.mjs | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).releaseType))")
          echo "release_type=$TYPE" >> "$GITHUB_OUTPUT"
          node .github/scripts/prepare-update-channel.mjs "$TYPE"

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy Worker to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          EXPECTED=$(node -e "const p=require('./package.json');process.stdout.write(String(p.version).replace(/\.0$/,''))")
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health?verify=$i" > /tmp/health.json &&
               grep -q '"project":"GMWW-V2.00"' /tmp/health.json &&
               grep -q "\"version\":\"V$EXPECTED\"" /tmp/health.json; then
              OK=1
              break
            fi
            sleep 3
          done
          cat /tmp/health.json
          test "$OK" = "1"
          curl -fsS "$URL/api/update/manifest?verify=$(date +%s)" > /tmp/manifest.json
          cat /tmp/manifest.json
          grep -q "\"releaseVersion\":\"$EXPECTED\"" /tmp/manifest.json
          curl -fsS "$URL/api/web-sync?verify=$(date +%s)" > /tmp/web-sync.json
          grep -q '"ok":true' /tmp/web-sync.json
          curl -fsS "$URL/" > /tmp/player.html
          grep -q 'GMWW PLAYER' /tmp/player.html
