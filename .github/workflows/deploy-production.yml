      - name: Kiểm tra tăng phiên bản OTA khi Runtime thay đổi
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gmww-v2-00.williampham0702.workers.dev"
          LIVE="/tmp/gmww-production-update-manifest.json"
          OK=0
          for i in $(seq 1 4); do
            if curl --connect-timeout 8 --max-time 20 --fail --silent --show-error \
              "$URL/api/update/manifest?ota-preflight=$(date +%s)-$i" > "$LIVE"; then
              if node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!/^\\d+\\.\\d+(?:\\.\\d+)?$/.test(String(m.releaseVersion||'')))process.exit(2)" "$LIVE"; then
                OK=1
                break
              fi
            fi
            sleep 2
          done

          # An unhealthy legacy OTA manifest is the defect this release repairs.
          # If it cannot be read, use only the live Worker's health version as the
          # comparison baseline; never skip version progression or post-deploy SHA checks.
          if [ "$OK" != "1" ]; then
            echo "::warning::Production OTA manifest unavailable; falling back to live Worker health version."
            HEALTH="/tmp/gmww-production-health-preflight.json"
            HEALTH_OK=0
            for i in $(seq 1 4); do
              if curl --connect-timeout 8 --max-time 15 --fail --silent --show-error \
                "$URL/api/health?ota-preflight=$(date +%s)-$i" > "$HEALTH"; then
                if node - "$HEALTH" "$LIVE" <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(health.project!=='GMWW-V2.00'||health.status!=='online')
            throw new Error('Production Worker health identity/status is not verified');
          const version=String(health.runtimeVersion||health.version||'').trim().replace(/^V/i,'');
          if(!/^\d+\.\d+(?:\.\d+)?$/.test(version))
            throw new Error('Production Worker health has no valid Runtime version');
          fs.writeFileSync(process.argv[3],JSON.stringify({
            releaseVersion:version,runtimeVersion:version,
            source:'verified-live-health-fallback'
          }));
          console.log('Using verified live Worker version V'+version+' as OTA progression baseline.');
          NODE
                then
                  HEALTH_OK=1
                  break
                fi
              fi
              sleep 2
            done
            test "$HEALTH_OK" = "1" || {
              echo "::error::Cannot verify Production OTA manifest or live Worker health; release blocked safely."
              exit 1
            }
          fi
          node .github/scripts/verify-ota-version-advance.mjs assets/updates/latest.json "$LIVE" /tmp/gmww-changed-files.txt

      - name: Xác minh thông tin kết nối Cloudflare
