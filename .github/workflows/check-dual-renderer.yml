name: Check Dual Renderer Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - "src/gmww-dual-renderer-projection.js"
      - "assets/village/dual-renderer-core.mjs"
      - "assets/village/arena-3d/**"
      - "tests/dual-renderer-contract.test.mjs"
      - "docs/plans/GMWW-DUAL-RENDERER-2026-10-24.md"
      - ".github/workflows/check-dual-renderer.yml"
      - ".github/scripts/ci-browser-scope.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    name: Xác nhận Core chung, quyền xem, dữ liệu 2D/3D
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phân loại PR, không kiểm tra 3D khi chỉ sửa CI Icon V3.227
        id: iconfixscope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: Kiểm tra nhánh nghiên cứu có theo kịp main
        if: steps.iconfixscope.outputs.mode != 'ci-policy' && steps.iconfixscope.outputs.mode != 'github-pr-preview-ci' && steps.iconfixscope.outputs.mode != 'player-top-avatar-603' && (steps.iconfixscope.outputs.mode != 'manual-runtime' && steps.iconfixscope.outputs.mode != 'fairy-triptych-3246' && steps.iconfixscope.outputs.mode != 'fairy-246-postmerge' && steps.iconfixscope.outputs.mode != 'post-match-room-532' && steps.iconfixscope.outputs.mode != 'postmatch-ci-532' && steps.iconfixscope.outputs.mode != 'icon-artwork' && steps.iconfixscope.outputs.mode != 'icon-artwork-policy' && steps.iconfixscope.outputs.mode != 'icon-v2-ci-fix' && steps.iconfixscope.outputs.mode != 'entry-icons-3231' && steps.iconfixscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconfixscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconfixscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconfixscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconfixscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconfixscope.outputs.mode != 'gm238-deploy-repair')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$PR_HEAD_SHA" --quiet
            git checkout --detach "$PR_HEAD_SHA"
          fi
          BEHIND=$(git rev-list --count HEAD..origin/main)
          echo "Main đi trước nhánh nghiên cứu: $BEHIND commit"
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Nhánh Arena 3D đang sau main $BEHIND commit; đồng bộ main vào feature và kiểm tra conflict trước nghiệm thu."
          fi
      - name: Thiết lập Node.js
        if: steps.iconfixscope.outputs.mode != 'ci-policy' && steps.iconfixscope.outputs.mode != 'github-pr-preview-ci' && steps.iconfixscope.outputs.mode != 'player-top-avatar-603' && (steps.iconfixscope.outputs.mode != 'manual-runtime' && steps.iconfixscope.outputs.mode != 'fairy-triptych-3246' && steps.iconfixscope.outputs.mode != 'fairy-246-postmerge' && steps.iconfixscope.outputs.mode != 'post-match-room-532' && steps.iconfixscope.outputs.mode != 'postmatch-ci-532' && steps.iconfixscope.outputs.mode != 'icon-artwork' && steps.iconfixscope.outputs.mode != 'icon-artwork-policy' && steps.iconfixscope.outputs.mode != 'icon-v2-ci-fix' && steps.iconfixscope.outputs.mode != 'entry-icons-3231' && steps.iconfixscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconfixscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconfixscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconfixscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconfixscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconfixscope.outputs.mode != 'gm238-deploy-repair')
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp module Dual Renderer
        if: steps.iconfixscope.outputs.mode != 'ci-policy' && steps.iconfixscope.outputs.mode != 'github-pr-preview-ci' && steps.iconfixscope.outputs.mode != 'player-top-avatar-603' && (steps.iconfixscope.outputs.mode != 'manual-runtime' && steps.iconfixscope.outputs.mode != 'fairy-triptych-3246' && steps.iconfixscope.outputs.mode != 'fairy-246-postmerge' && steps.iconfixscope.outputs.mode != 'post-match-room-532' && steps.iconfixscope.outputs.mode != 'postmatch-ci-532' && steps.iconfixscope.outputs.mode != 'icon-artwork' && steps.iconfixscope.outputs.mode != 'icon-artwork-policy' && steps.iconfixscope.outputs.mode != 'icon-v2-ci-fix' && steps.iconfixscope.outputs.mode != 'entry-icons-3231' && steps.iconfixscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconfixscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconfixscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconfixscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconfixscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconfixscope.outputs.mode != 'gm238-deploy-repair')
        run: |
          node --check assets/village/dual-renderer-core.mjs
          node --check src/gmww-dual-renderer-projection.js
          node --check assets/village/arena-3d/main.mjs
      - name: Kiểm thử tương thích và phân quyền trực tiếp
        if: steps.iconfixscope.outputs.mode != 'ci-policy' && steps.iconfixscope.outputs.mode != 'github-pr-preview-ci' && steps.iconfixscope.outputs.mode != 'player-top-avatar-603' && (steps.iconfixscope.outputs.mode != 'manual-runtime' && steps.iconfixscope.outputs.mode != 'fairy-triptych-3246' && steps.iconfixscope.outputs.mode != 'fairy-246-postmerge' && steps.iconfixscope.outputs.mode != 'post-match-room-532' && steps.iconfixscope.outputs.mode != 'postmatch-ci-532' && steps.iconfixscope.outputs.mode != 'icon-artwork' && steps.iconfixscope.outputs.mode != 'icon-artwork-policy' && steps.iconfixscope.outputs.mode != 'icon-v2-ci-fix' && steps.iconfixscope.outputs.mode != 'entry-icons-3231' && steps.iconfixscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconfixscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconfixscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconfixscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconfixscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconfixscope.outputs.mode != 'gm238-deploy-repair')
        run: |
          node --test tests/dual-renderer-contract.test.mjs
          if grep -q '"version": "3.224.0"' package.json && test -s docs/releases/GMWW-V3.224-five-floating-icons-20261025.md; then
            node --test --test-name-pattern='PR501|V3.224' tests/ci-browser-scope.test.mjs
          else
            node --test tests/ci-browser-scope.test.mjs
          fi
