name: Check Witch Drunk Clone Rules

on:
  pull_request:
    paths:
      - 'src/index.js'
      - 'src/gmww-witch-drunk-clone-rules.js'
      - 'src/gmww-role-inheritance-rules.js'
      - 'src/gmww-pack-night-rules.js'
      - 'server-game/src/00-core-and-library.part'
      - 'server-game/src/40-battle-and-timeline.part'
      - 'tests/witch-drunk-clone-20261027.test.mjs'
      - 'tests/v389-night-runtime-integration.test.mjs'
      - '.github/workflows/check-witch-drunk-clone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-night-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Witch / Drunk / Clone + dependent Wolf rules only
        run: |
          node --test tests/witch-drunk-clone-20261027.test.mjs tests/gmww-wolf-night-resolution.test.mjs tests/night02-pack-snow-guard-fairy.test.mjs tests/v389-night-runtime-integration.test.mjs
          node --check src/index.js
          node --check src/gmww-witch-drunk-clone-rules.js
          node --check src/gmww-role-inheritance-rules.js
          node --check src/gmww-pack-night-rules.js
          node .github/scripts/assemble-gm-app.mjs --verify
