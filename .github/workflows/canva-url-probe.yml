name: Asset Bridge Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canva-url-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe staged artwork URL
        shell: bash
        env:
          ASSET_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/2822a31654d2444aae847725a4f19686/content_generation/content_asset/RQu96IM0AUkRFCRcP63K/thumbnail.webp?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261005%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261005T222100Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$ASSET_URL" -o /tmp/artifact.webp
          ls -lh /tmp/artifact.webp
          file /tmp/artifact.webp
          python3 -m pip -q install Pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/artifact.webp')
          print('ARTIFACT_DIMENSIONS=%dx%d'%im.size)
          print('ARTIFACT_FORMAT=%s'%im.format)
          PY
