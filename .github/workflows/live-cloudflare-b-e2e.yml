name: Live Cloudflare B synthetic E2E (no deployment)
on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare-standby/b-staging-live-e2e.mjs'
      - 'infra/cloudflare-standby/b-staging-live-e2e.test.mjs'
      - '.github/workflows/live-cloudflare-b-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gmww-b-only-live-e2e
  cancel-in-progress: false
jobs:
  live-b:
    name: B-only HTTP and WebSocket E2E; missing key = BLOCKED
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate harness locally (no Cloudflare writes)
        run: |
          node --check infra/cloudflare-standby/b-staging-live-e2e.mjs
          node --test infra/cloudflare-standby/b-staging-live-e2e.test.mjs
      - name: LIVE B synthetic HTTP and WebSocket checks (never Production)
        env:
          GMWW_B_SYNTHETIC_ADMIN_KEY: ${{ secrets.GMWW_B_SYNTHETIC_ADMIN_KEY }}
        run: node infra/cloudflare-standby/b-staging-live-e2e.mjs
