name: Check GM iPhone Chrome viewport
on:
  pull_request:
    branches: [main]
    paths:
      - 'server-game/current/GMWW.html'
      - 'tests/gm-chrome-ios-viewport-20261030.test.mjs'
      - '.github/workflows/check-gm-chrome-ios-viewport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-chrome-ios-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused Chrome iOS viewport regression (GM Server only)
        run: |
          node --test tests/gm-chrome-ios-viewport-20261030.test.mjs
      - name: Verify GM CSS untouched and JS changes limited to release version
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- server-game/current/style.css
          ACTUAL=$(git diff --unified=0 origin/main...HEAD -- server-game/current/app.js | grep -E '^[+-][^+-]' || true)
          # PR649 is a UI-only HTML change; GM app.js must remain byte-identical.
          if [ -z "$ACTUAL" ]; then
            echo "GM app.js unchanged: safe for HTML-only Player Web share layout."
            exit 0
          fi
          EXPECTED=$(printf '%s\n' "-const VERSION='3.277';" "+const VERSION='3.278';")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::GM app.js changed beyond the approved V3.278 version bump"
            printf 'Actual changes:\n%s\n' "$ACTUAL"
            exit 1
          fi
