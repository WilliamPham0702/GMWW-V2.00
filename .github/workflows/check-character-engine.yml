name: Check Character Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "src/gmww-character-engine.js"
      - "src/index.js"
      - "assets/village/character-renderer.mjs"
      - "assets/village/character-renderer.css"
      - "assets/village/village.mjs"
      - "assets/village/index.html"
      - "tests/character-engine.test.mjs"
      - "tests/character-renderer.test.mjs"
      - "server-game/current/app.js"
      - "server-game/current/GMWW.html"
      - "server-game/current/character-renderer.js"
      - "server-game/current/character-renderer.css"
      - ".github/workflows/build-server-game-ipa.yml"
      - "tests/character-engine-gm.test.mjs"
      - ".github/workflows/check-character-engine.yml"
      - "tools/character-rig-audit.py"
  workflow_dispatch:

concurrency:
  group: character-engine-check-${{ github.sha }}
  cancel-in-progress: true

jobs:
  character-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Worker dry run
        run: npm run check
      - name: GM renderer syntax
        run: |
          node --check server-game/current/app.js
          node --check server-game/current/character-renderer.js
      - name: Character Engine unit tests
        run: node --test tests/character-engine.test.mjs tests/character-renderer.test.mjs tests/character-engine-gm.test.mjs
      - name: Character rig asset audit
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python tools/character-rig-audit.py
      - name: Character Engine manifest smoke
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-character-wrangler.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true; cat /tmp/gmww-character-wrangler.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/character-engine/manifest > /tmp/character-engine.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/village/character-renderer.mjs > /tmp/character-renderer.mjs
          curl -fsS http://127.0.0.1:8787/village/character-renderer.css > /tmp/character-renderer.css
          grep -q "segmented-skeletal" /tmp/character-renderer.mjs
          grep -q "gmww-rig-leg-back" /tmp/character-renderer.css
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/character-engine.json','utf8'));
          if(!m.ok)throw new Error('Character Engine manifest not OK');
          if(m.engineVersion!=='0.2.0')throw new Error('Unexpected Character Engine version');
          if(m.master?.id!=='character-01')throw new Error('Character Master is not character-01');
          if(!Array.isArray(m.characters)||m.characters.length!==42)throw new Error('Expected 42 Character definitions');
          if(!m.characters.every(x=>Array.isArray(x.motions)&&x.motions.includes('walk')&&x.motions.includes('idle')))throw new Error('Shared motion contract incomplete');
          NODE
      - name: Character visual smoke
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-character-visual.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/village/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --virtual-time-budget=5000 --screenshot=character-preview.png http://127.0.0.1:8787/village/
          test -s character-preview.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('character-preview.png').convert('RGB')
          print('CHARACTER_VISUAL_SMOKE='+str(im.size))
          if im.width < 1000 or im.height < 700:
              raise SystemExit('SCREENSHOT_TOO_SMALL')
          PY
      - name: Upload Character visual
        uses: actions/upload-artifact@v4
        with:
          name: character-preview
          path: character-preview.png
          retention-days: 3
