name: Check 30-Player Realtime Room

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "assets/village/**"
      - "tools/smoke-30-players.mjs"
      - ".github/scripts/ci-browser-scope.mjs"
      - "tests/ci-browser-scope.test.mjs"
      - ".github/workflows/check-30-player-realtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmww-30players-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Tải mã nguồn để đối chiếu phạm vi thay đổi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chọn kiểm thử đúng phạm vi, an toàn mặc định
        id: select
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
  local-realtime:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tải mã nguồn dự án
        uses: actions/checkout@v4
      - name: Thiết lập Node.js và bộ nhớ đệm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện theo tệp khóa
        run: npm ci
      - name: Chạy thử hai phòng 30 người chơi trên Worker độc lập
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-30players-wrangler.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true; tail -n 100 /tmp/gmww-30players-wrangler.log || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/gmww-health.json; then break; fi
            sleep 1
          done
          grep -q '"project":"GMWW-V2.00"' /tmp/gmww-health.json
          node tools/smoke-30-players.mjs --run
