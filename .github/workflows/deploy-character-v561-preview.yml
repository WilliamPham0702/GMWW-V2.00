name: GMWW Character V5.63 Preview (Independent)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/character-v561-preview-worker.mjs'
      - 'wrangler.character-v561-preview.jsonc'
      - '.github/scripts/build-character-v561-preview.mjs'
      - '.github/workflows/deploy-character-v561-preview.yml'
      - 'assets/characters/v5/test-skin-v561.html'
      - 'assets/characters/v5/test-skin-v562.html'
      - 'assets/characters/v5/skin-v562-*.mjs'
      - 'assets/characters/v5/skin-v561-*.mjs'
      - '.github/scripts/character-v562-preview-isolation.mjs'
      - '.github/scripts/classify-update.mjs'
      - '.github/scripts/verify-ota-version-advance.mjs'
  push:
    branches: [main]
    paths:
      - 'src/character-v561-preview-worker.mjs'
      - 'wrangler.character-v561-preview.jsonc'
      - '.github/scripts/build-character-v561-preview.mjs'
      - '.github/workflows/deploy-character-v561-preview.yml'
      - 'assets/characters/v5/test-skin-v561.html'
      - 'assets/characters/v5/test-skin-v562.html'
      - 'assets/characters/v5/skin-v562-*.mjs'
      - 'assets/characters/v5/skin-v561-*.mjs'
  workflow_dispatch:

concurrency:
  group: gmww-character-v561-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test original artwork and 3D weighted-bone binding
        run: node --test tests/character-v560-weighted-skin.test.mjs tests/character-v561-original-art-uv.test.mjs tests/character-v562-original-sleeves.test.mjs tests/character-v562-preview-isolation.test.mjs
      - name: Ensure preview has no game/OTA/room data and dry-run Cloudflare
        run: |
          set -euo pipefail
          node --check src/character-v561-preview-worker.mjs
          node --check .github/scripts/build-character-v561-preview.mjs
          node .github/scripts/build-character-v561-preview.mjs
          test "$(find .character-v561-preview-assets -type f | wc -l | tr -d ' ')" -eq 11
          ! grep -Eq '(DurableObject|roomStub|\/api\/update|\/updates\/runtime)' src/character-v561-preview-worker.mjs
          test -s .character-v561-preview-assets/characters/v5/gmww-character-v562.bundle.js
          grep -Fq '<script defer src="./gmww-character-v562.bundle.js"></script>' .character-v561-preview-assets/characters/v5/test-skin-v562.html
          ! grep -Fq '<script type="module">' .character-v561-preview-assets/characters/v5/test-skin-v562.html
          npx wrangler deploy --config wrangler.character-v561-preview.jsonc --dry-run
      - name: Safari-compatible bundled preview renders a real Three.js frame in Chromium
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          python3 -m http.server 18776 --bind 127.0.0.1 --directory .character-v561-preview-assets >/tmp/gmww-character-bundle.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 60s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage             --enable-unsafe-swiftshader --use-angle=swiftshader --virtual-time-budget=3500             --dump-dom "http://127.0.0.1:18776/characters/v5/test-skin-v562.html"             > /tmp/character-v562-bundled.html 2>/tmp/character-v562-browser.log || {
              tail -n 30 /tmp/character-v562-browser.log; exit 1;
            }
          grep -Fq 'data-gmww-v562="ready"' /tmp/character-v562-bundled.html || {
            tail -n 30 /tmp/character-v562-browser.log
            grep -o 'data-gmww-v562="[^"]*"' /tmp/character-v562-bundled.html || true
            exit 1
          }
          echo 'V5.63 original swatch + whole-body 3D skinned mesh render PASS.'

  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated Character preview assets
        run: node .github/scripts/build-character-v561-preview.mjs
      - name: Publish independent Cloudflare Worker (NOT gmww-v2-00)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.character-v561-preview.jsonc
      - name: Verify accessible independent V5.62 test and original-texture bytes
        run: |
          set -euo pipefail
          BASE="https://gmww-character-v561-preview.williampham0702.workers.dev"
          # Newly published Workers/assets may need a short propagation delay.
          sleep 4
          echo "V5.63 preview Worker health and HTML smoke (run_worker_first enabled)."
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            "$BASE/api/health" > /tmp/gmww-character-preview-health.json
          cat /tmp/gmww-character-preview-health.json
          grep -Fq '"liveGameModified":false' /tmp/gmww-character-preview-health.json
          curl --location --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            "$BASE/?verify=$(date +%s)" > /tmp/gmww-character-v562-test.html
          echo "Fetched V5.62 HTML: $(wc -c </tmp/gmww-character-v562-test.html) bytes"
          grep -Fq 'Chàng Biển 3D · Full Skin' /tmp/gmww-character-v562-test.html
          grep -Fq 'chưa chuyển nguyên từng pixel ảnh 2D thành UV atlas 3D' /tmp/gmww-character-v562-test.html
          grep -Fq 'window.__gmwwV562ReportError=report;' /tmp/gmww-character-v562-test.html
          grep -Fq 'data-action="result"' /tmp/gmww-character-v562-test.html
          grep -Fq '<script defer src="./gmww-character-v562.bundle.js"></script>' /tmp/gmww-character-v562-test.html
          ! grep -Fq '<script type="module">' /tmp/gmww-character-v562-test.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2             "$BASE/characters/v5/gmww-character-v562.bundle.js?verify=$(date +%s)" > /tmp/gmww-v562-live-bundle.js
          test -s /tmp/gmww-v562-live-bundle.js
          test "$(shasum -a 256 .character-v561-preview-assets/characters/v5/gmww-character-v562.bundle.js | awk '{print $1}')" = "$(shasum -a 256 /tmp/gmww-v562-live-bundle.js | awk '{print $1}')"
          for REL in \
            characters/v5/skin-v562-original-sleeves.mjs \
            characters/v5/skin-v561-original-art-uv.mjs \
            characters/v5/skin-v561-original-swatch.mjs \
            characters/v5/skin-v560-weighted-surface.mjs \
            characters/v5/character-rig-v510.mjs \
            characters/v5/character-motion-v500.mjs \
            characters/v5/vendor/three.module.min.js \
            characters/v4/skin-v414.mjs; do
            curl --location --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
              "$BASE/$REL?verify=$(date +%s)" > /tmp/v561-check
            test -s /tmp/v561-check
            test "$(shasum -a 256 "assets/$REL" | awk '{print $1}')" = "$(shasum -a 256 /tmp/v561-check | awk '{print $1}')"
          done
          echo "V5.63 Full Ocean Skin Preview verified independently. Main GMWW Production and OTA untouched."
