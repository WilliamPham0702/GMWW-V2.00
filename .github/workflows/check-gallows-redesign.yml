name: Check Lên Giàn theo đúng phạm vi
on:
  # CI chỉ phần Lên Giàn, GM menu chết và Player Web cờ đỏ.
  push:
    branches: [main]
    paths:
      - "server-game/current/GMWW.html"
      - "server-game/current/style.css"
      - "server-game/current/app.js"
      - "server-game/src/30-village-and-setup.part"
      - "server-game/src/40-battle-and-timeline.part"
      - "src/gmww-gallows-rules.js"
      - "tests/gallows-*.test.mjs"
      - "assets/village/village.mjs"
      - "src/player-web-src/30-rooms-and-realtime.part"
      - "src/gmww-members-live.js"
  pull_request:
    paths:
      - "src/gmww-gallows-rules.js"
      - "src/index.js"
      - "src/player-web-src/20-village-and-profile.part"
      - "src/player-web-src/30-rooms-and-realtime.part"
      - "src/gmww-members-live.js"
      - "assets/village/village.mjs"
      - "assets/village/village.css"
      - "assets/village/scene-manager.mjs"
      - "server-game/src/00-core-and-library.part"
      - "server-game/current/gallows-hanging.css"
      - "shared/gallows-statistics.mjs"
      - "server-game/current/GMWW.html"
      - "server-game/current/style.css"
      - "server-game/current/app.js"
      - "server-game/src/30-village-and-setup.part"
      - "server-game/src/40-battle-and-timeline.part"
      - "tests/gallows-*.test.mjs"
      - "tests/v3148-gallows-integrity.test.mjs"
      - "tests/v3189-fire-gallows-voting.test.mjs"
      - "tests/v3192-gallows-dual-mode.test.mjs"
      - ".github/workflows/check-gallows-redesign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallows:
    name: Chi kiem tra Len Gian va toan ven bundle GM
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Thiet lap Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cai thu vien
        run: npm ci
      - name: Xac dinh dung pham vi PR501
        id: scope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: Kiem tra cu phap Worker va GM
        run: |
          node --check src/gmww-gallows-rules.js
          node --check shared/gallows-statistics.mjs
          node --check server-game/current/app.js
          node --check src/index.js
          node --check assets/village/scene-manager.mjs
      - name: Kiem tra thong ke, han che, ket luan va API Web
        if: steps.scope.outputs.mode != 'phase-dock-gallows-3234'
        run: |
          node --test tests/gallows-statistics.test.mjs tests/gallows-redesign-live.test.mjs tests/gallows-panel-60s-controls.test.mjs tests/gallows-pirate-ui-v3205.test.mjs tests/gallows-flag-snap-v3206.test.mjs tests/gallows-flag-snap-v3206.test.mjs tests/v3148-gallows-integrity.test.mjs tests/v3189-fire-gallows-voting.test.mjs tests/v3192-gallows-dual-mode.test.mjs tests/gallows-hanging-character.test.mjs tests/gallows-hanging-anchor-walk.test.mjs
      - name: V3.234 — 5 thành viên và chuyển dock Đêm/Ngày
        if: steps.scope.outputs.mode == 'phase-dock-gallows-3234'
        run: node --test tests/gmww-v3234-phase-dock-gallows.test.mjs tests/gallows-redesign-live.test.mjs
      - name: "Kiem tra dung 4 loi DEMO - Sat Thu, soi xet, audio, quyen vote"
        if: steps.scope.outputs.mode != 'gm-icons-501' && steps.scope.outputs.mode != 'gm-icons-501-release' && steps.scope.outputs.mode != 'entry-icons-3231' && steps.scope.outputs.mode != 'phase-dock-gallows-3234'
        run: node --test tests/demo-assassin-gallows-divination.test.mjs
      - name: Kiem tra 6 source GM khop ban app da dong goi
        if: steps.scope.outputs.mode != 'entry-icons-3231' && steps.scope.outputs.mode != 'phase-dock-gallows-3234'
        run: node --test tests/gmww-gm-app-source-modules.test.mjs
      - name: Kiem tra source Player Web dong bo compiled runtime
        if: steps.scope.outputs.mode != 'phase-dock-gallows-3234'
        run: node .github/scripts/assemble-player-web.mjs --verify
      - name: Kiem tra cu phap Player Web village
        if: steps.scope.outputs.mode != 'phase-dock-gallows-3234'
        run: node --check assets/village/village.mjs
