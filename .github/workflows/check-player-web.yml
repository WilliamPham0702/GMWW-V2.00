name: Check Player Web Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/check-player-web.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
