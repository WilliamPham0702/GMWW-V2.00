          test -s docs/releases/GMWW-V3.284-PR654-PR659-INTEGRATION-20261031.md
      - name: Chạy toàn bộ kiểm thử tự động khi code ngoài phạm vi task hoặc phát hành
        if: steps.scope.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.number != 645)
