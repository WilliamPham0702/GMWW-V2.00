name: Check Player Web Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "server-game/current/**"
      - "server-game/src/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/check-player-web.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/check-character-engine.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: player-web-check-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Thiết lập Node.js và bộ nhớ đệm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện theo tệp khóa
        run: npm ci
      - name: Chọn phạm vi test theo phần code thực sự thay đổi
        id: scope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: Kiểm tra mã nguồn Worker
        run: npm run check
      - name: Kiểm tra đồng bộ phiên bản GMWW
        run: node .github/scripts/verify-gmww-versions.mjs
      - name: Kiểm tra cú pháp app.js
        run: node --check server-game/current/app.js
      - name: Kiểm tra cú pháp prepare-update-channel.mjs
        run: node --check .github/scripts/prepare-update-channel.mjs
      - name: Kiểm tra cú pháp village.mjs
        run: node --check assets/village/village.mjs
      - name: Chạy toàn bộ kiểm thử tự động khi code ngoài phạm vi task hoặc phát hành
        if: steps.scope.outputs.mode == 'full'
        run: npm test
      - name: Chỉ kiểm thử lỗi ván cũ hiện lại
        if: steps.scope.outputs.mode == 'postgame'
        run: node --test tests/match-completion*.test.mjs tests/forced-end-game.test.mjs
      - name: Chỉ kiểm thử roster, vai, Artifact và khôi phục Player Web
        if: steps.scope.outputs.mode == 'p0-roster'
        run: node --test tests/player-web-p0-atomic-roster-role-release.test.mjs tests/player-web-resume-receipt-runtime.test.mjs
      - name: Kiểm thử trực tiếp hợp đồng Core chung 2D/3D và phân quyền
        if: steps.scope.outputs.mode == 'dual-renderer'
        run: node --test tests/dual-renderer-contract.test.mjs tests/arena3d-preview.test.mjs tests/ci-browser-scope.test.mjs
      - name: Tạo và kiểm tra 40 ảnh đại diện nhân vật
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          python3 -m venv /tmp/gmww-avatar-venv
          /tmp/gmww-avatar-venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/gmww-avatar-venv/bin/python tools/generate-character40-portraits.py --verify
      - name: Kiểm tra nhanh Player Web trên máy thử nghiệm
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-wrangler.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true; cat /tmp/gmww-wrangler.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"project":"GMWW-V2.00"' /tmp/health.json
          curl -fsS http://127.0.0.1:8787/api/health/deep > /tmp/health-deep.json
          grep -q '"memberStorage":"ready"' /tmp/health-deep.json
          curl -fsS http://127.0.0.1:8787/ > /tmp/player.html
          grep -q 'GMWW PLAYER' /tmp/player.html
          # Each returned portrait is the exact corresponding atlas Idle frame.
          for N in $(seq 1 40); do
            ID=$(printf 'character-%02d' "$N")
            curl --fail --silent --show-error "http://127.0.0.1:8787/api/game-characters/$ID/image?rev=c40-4" > /tmp/gmww-avatar-preview.webp
            cmp -s /tmp/gmww-avatar-preview.webp "assets/characters/gmww40/portraits/$ID.webp" || {
              echo "::error::Profile avatar and village atlas mismatch: $ID"
              exit 1
            }
          done
          echo "PASS: all 40 Player Web portraits match generated atlas frames."
          curl -fsS http://127.0.0.1:8787/gmww-members-live.js > /tmp/player-live.js
          test -s /tmp/player-live.js
          # Regression: Cloudflare html_handling=none must not serve 404 inside Player iframe.
          curl -fsS 'http://127.0.0.1:8787/village/?embed=1&v=303' > /tmp/gmww-village.html
          grep -q '<main class="game day"' /tmp/gmww-village.html
          curl -fsS 'http://127.0.0.1:8787/village/village.css?v=303' > /tmp/gmww-village.css
          test -s /tmp/gmww-village.css
          curl -fsS 'http://127.0.0.1:8787/village/village.mjs?v=prep303' > /tmp/gmww-village.mjs
          test -s /tmp/gmww-village.mjs
          curl -fsS http://127.0.0.1:8787/gmww-sea-background.webp > /tmp/background.webp
          test -s /tmp/background.webp
          ROOM_JSON=$(curl -fsS -X POST http://127.0.0.1:8787/api/rooms -H 'content-type: application/json' --data '{"roomName":"CI Smoke"}')
          ROOM_CODE=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.roomCode) process.exit(1); process.stdout.write(d.roomCode)' "$ROOM_JSON")
          curl -fsS "http://127.0.0.1:8787/api/rooms/$ROOM_CODE" > /tmp/room.json
          grep -q "$ROOM_CODE" /tmp/room.json

          # End-to-end member authentication smoke: register -> login -> session.
          curl -fsS -X POST http://127.0.0.1:8787/api/members/register             -H 'content-type: application/json'             --data '{"loginId":"ciuser1","displayName":"CI User","gameCharacterId":"character-01"}' > /tmp/register.json
          grep -q '"ok":true' /tmp/register.json
          LOGIN_JSON=$(curl -fsS -X POST http://127.0.0.1:8787/api/members/login             -H 'content-type: application/json'             --data '{"loginId":"ciuser1","password":""}')
          TOKEN=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.token) process.exit(1); process.stdout.write(d.token)' "$LOGIN_JSON")
          curl -fsS http://127.0.0.1:8787/api/members/me -H "Authorization: Bearer $TOKEN" > /tmp/me.json
          grep -q '"loginId":"ciuser1"' /tmp/me.json

          # Password fields are intentionally ignored in V2.76; accounts are password-free.
          curl -fsS -X POST http://127.0.0.1:8787/api/members/register \
            -H 'content-type: application/json' \
            --data '{"loginId":"ciuser2","displayName":"CI User 2","gameCharacterId":"character-02","password":"legacy-ignored"}' > /tmp/register-2.json
          grep -q '"ok":true' /tmp/register-2.json
          curl -fsS -X POST http://127.0.0.1:8787/api/members/login \
            -H 'content-type: application/json' \
            --data '{"loginId":"ciuser2"}' > /tmp/login-2.json
          grep -q '"ok":true' /tmp/login-2.json

          # Real Durable Object integration: verify that each authenticated Player
          # receives its private Role + Artifact together, ACKs it, can reconnect,
          # and cannot ACK a previous delivery after the GM republishes.
          node tests/worker-private-delivery-e2e.mjs
          # FAST G4 acceptance uses real HTTP/WebSocket routes and SQLite DO storage.
          node tests/worker-engine-multinight-e2e.mjs
          node tests/worker-night-rules-e2e.mjs
