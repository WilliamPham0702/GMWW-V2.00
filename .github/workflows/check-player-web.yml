name: Check Player Web Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "server-game/current/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/check-player-web.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: node --check server-game/current/app.js
      - run: npm test
      - name: Smoke-test Player Web locally
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-wrangler.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true; cat /tmp/gmww-wrangler.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"project":"GMWW-V2.00"' /tmp/health.json
          curl -fsS http://127.0.0.1:8787/ > /tmp/player.html
          grep -q 'GMWW PLAYER' /tmp/player.html
          curl -fsS http://127.0.0.1:8787/gmww-members-live.js > /tmp/player-live.js
          test -s /tmp/player-live.js
          curl -fsS http://127.0.0.1:8787/gmww-sea-background.webp > /tmp/background.webp
          test -s /tmp/background.webp
          ROOM_JSON=$(curl -fsS -X POST http://127.0.0.1:8787/api/rooms -H 'content-type: application/json' --data '{"roomName":"CI Smoke"}')
          ROOM_CODE=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.roomCode) process.exit(1); process.stdout.write(d.roomCode)' "$ROOM_JSON")
          curl -fsS "http://127.0.0.1:8787/api/rooms/$ROOM_CODE" > /tmp/room.json
          grep -q "$ROOM_CODE" /tmp/room.json

          # End-to-end member authentication smoke: register -> login -> session.
          curl -fsS -X POST http://127.0.0.1:8787/api/members/register             -H 'content-type: application/json'             --data '{"loginId":"ciuser1","displayName":"CI User","gameCharacterId":"character-01"}' > /tmp/register.json
          grep -q '"ok":true' /tmp/register.json
          LOGIN_JSON=$(curl -fsS -X POST http://127.0.0.1:8787/api/members/login             -H 'content-type: application/json'             --data '{"loginId":"ciuser1","password":""}')
          TOKEN=$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.token) process.exit(1); process.stdout.write(d.token)' "$LOGIN_JSON")
          curl -fsS http://127.0.0.1:8787/api/members/me -H "Authorization: Bearer $TOKEN" > /tmp/me.json
          grep -q '"loginId":"ciuser1"' /tmp/me.json

          # Password-protected account must request password first and accept the correct password.
          curl -fsS -X POST http://127.0.0.1:8787/api/members/register             -H 'content-type: application/json'             --data '{"loginId":"cipass1","displayName":"CI Pass","gameCharacterId":"character-02","password":"1234"}' > /tmp/register-pass.json
          test "$(curl -sS -o /tmp/pass-required.json -w '%{http_code}' -X POST http://127.0.0.1:8787/api/members/login             -H 'content-type: application/json'             --data '{"loginId":"cipass1","password":""}')" = "401"
          grep -q '"error":"PASSWORD_REQUIRED"' /tmp/pass-required.json
          curl -fsS -X POST http://127.0.0.1:8787/api/members/login             -H 'content-type: application/json'             --data '{"loginId":"cipass1","password":"1234"}' > /tmp/login-pass.json
          grep -q '"ok":true' /tmp/login-pass.json
