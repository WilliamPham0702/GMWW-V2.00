name: Check Player Web Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "server-game/current/**"
      - "server-game/src/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/check-player-web.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/check-character-engine.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: player-web-check-sha-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Thiết lập Node.js và bộ nhớ đệm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện theo tệp khóa
        run: npm ci
      - name: Chọn phạm vi test theo phần code thực sự thay đổi
        id: scope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: Oracle STAGING bootstrap only — fail closed and no Production deploy
        if: steps.scope.outputs.mode == 'oracle-staging-bootstrap'
        run: |
          node --check oracle-staging/server.mjs
          node --test tests/oracle-staging-bootstrap.test.mjs
          grep -Fq 'Oracle STAGING-only bootstrap: SKIP Production Worker deploy.' .github/workflows/deploy-production.yml
          grep -Fq 'Oracle STAGING-only bootstrap: NO automatic Runtime release.' .github/workflows/github-runtime-ota.yml
      - name: Cloudflare Pages alias only — HTTPS 302 and Worker/Runtime isolation
        if: steps.scope.outputs.mode == 'pages-alias'
        run: |
          node --check .github/scripts/ci-browser-scope.mjs
          node --test tests/gamemasoi-pages-link.test.mjs tests/production-deploy-architecture-docs.test.mjs
          node -e "import('./.github/scripts/ci-browser-scope.mjs').then(m => { if(!m.classifyBrowserScope) process.exit(1) })"
          test -s docs/releases/GMWW-GAMEMASOI-PAGES-LINK-20261031.md
      - name: GM Chrome iOS viewport only (no gameplay, Player cards, Native IPA)
        if: steps.scope.outputs.mode == 'gm-chrome-ios-viewport'
        run: |
          node --test tests/gm-chrome-ios-viewport-20261030.test.mjs
          node --check .github/scripts/ci-browser-scope.mjs
          node --test --test-name-pattern='PR642 Chrome iOS GM viewport' tests/ci-browser-scope.test.mjs
          node --check server-game/current/app.js
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          test -s docs/releases/GMWW-GM-CHROME-IOS-VIEWPORT-20261030.md
      - name: Stage 2 Native GitHub-first OTA, verify only relevant Runtime and Native contracts
        if: steps.scope.outputs.mode == 'native-github-ota-stage2'
        run: |
          node --test tests/native-github-first-ota-stage2.test.mjs
          node --check .github/scripts/ci-browser-scope.mjs
          node --check server-game/current/app.js
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          test -s docs/releases/GMWW-NATIVE-GITHUB-OTA-STAGE2-20261029.md
      - name: PR605 — chỉ kiểm tra GitHub Actions Preview CI, không chạy gameplay/IPA
        if: steps.scope.outputs.mode == 'github-pr-preview-ci'
        run: |
          node --test tests/github-actions-pr-preview-ci.test.mjs
          node .github/scripts/guard-pr-preview-ci.mjs
          node --check .github/scripts/ci-browser-scope.mjs
          node --check .github/scripts/guard-pr-preview-ci.mjs
      - name: PR603 — icon tài khoản Player Web, bảo toàn menu và bundle
        if: steps.scope.outputs.mode == 'player-top-avatar-603'
        run: |
          node --test tests/player-web-top-account-avatar-20261029.test.mjs tests/player-web-online-village-20261028.test.mjs
          node --test --test-name-pattern='PR603 account avatar' tests/ci-browser-scope.test.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node --check src/gmww-members-live.js
          node --check .github/scripts/ci-browser-scope.mjs
      - name: PR648 — xác minh reporter chỉ đo FPS khi bật chẩn đoán
        if: steps.scope.outputs.mode == 'village-perf-diagnostics-648'
        run: |
          node --check assets/village/village-performance.mjs
          node --check .github/scripts/ci-browser-scope.mjs
          node --test tests/player-web-background-performance.test.mjs
          node --test --test-name-pattern='PR648 diagnostics-only FPS' tests/ci-browser-scope.test.mjs
          test -s docs/releases/GMWW-PR648-IPHONE-THERMAL-20261031.md
      - name: Tối ưu Player Web khi chạy nền trên iPhone
        if: steps.scope.outputs.mode == 'player-web-background-performance'
        run: |
          node --test tests/player-web-background-performance.test.mjs tests/player-web-render-budget.test.mjs tests/gmww-player-web-source-modules.test.mjs
          node --test --test-name-pattern='Player Web background performance patch' tests/ci-browser-scope.test.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node -e "import('./src/gmww-members-live.js').then(m=>require('fs').writeFileSync('/tmp/gmww-background-performance-player.js',m.gmwwMembersLiveScript))"
          node --check /tmp/gmww-background-performance-player.js
          test -s docs/releases/GMWW-PLAYER-WEB-BACKGROUND-PERFORMANCE-20261029.md
      - name: V3.273 — Player Web Online trên nền Làng và hành động xác thực
        if: steps.scope.outputs.mode == 'player-online-village-3273'
        run: |
          node --check src/index.js
          node --check src/gmww-demo-runner.js
          node --check src/gmww-online-action-icons.js
          node --check server-game/current/app.js
          node --check .github/scripts/ci-browser-scope.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --test tests/player-web-online-village-20261028.test.mjs tests/player-web-online-actions-20261028.test.mjs tests/online-chat-authority.test.mjs tests/wolf-recognition.test.mjs tests/demo-player-live-join-v3271.test.mjs tests/demo-hybrid-real-players.test.mjs
          test -s docs/releases/GMWW-player-web-online-village-20261028.md
      - name: V3.272 PR595 — GM Chat 🦩, Giết/Cứu/Cấm chat, Runtime OTA
        if: steps.scope.outputs.mode == 'gm-admin-top-chat-3272'
        run: |
          node --check src/index.js
          node --check server-game/current/app.js
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --test tests/gm-admin-top-chat-20261028.test.mjs tests/online-chat-authority.test.mjs
          test -s docs/releases/gm-admin-top-chat-20261028.md
      - name: V3.271 — khắc phục Player Web theo DEMO đang chạy
        if: steps.scope.outputs.mode == 'demo-player-live-3271'
        run: |
          node --check src/index.js
          node --check .github/scripts/ci-browser-scope.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --test tests/demo-player-live-join-v3271.test.mjs tests/demo-hybrid-real-players.test.mjs tests/demo-room-gm-safety.test.mjs tests/demo-room-lease-phases.test.mjs
          test -s docs/releases/GMWW-DEMO-PLAYER-V3.271-20261028.md
      - name: V3.270 — kiểm Audio DEMO x2/x5, Tiên Tri và Lên Giàn đúng phạm vi
        if: steps.scope.outputs.mode == 'demo-audio-sync-3270'
        run: |
          node --check src/index.js
          node --check src/gmww-demo-runner.js
          node --check src/gmww-wolf-night-resolution.js
          node --check server-game/current/app.js
          node --check .github/scripts/ci-browser-scope.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --test tests/audio-role-day-flow-20261027.test.mjs tests/audio-binding-integrity-20261027.test.mjs tests/demo-audio-clock-sync-20261028.test.mjs tests/demo-assassin-gallows-divination.test.mjs tests/demo-server-runner.test.mjs tests/demo-room-lease-phases.test.mjs
          test -s docs/releases/GMWW-V3.270-audio-demo-gallows-20261028.md
      - name: V3.268 — Ván Mẫu hít menu dưới, bảo toàn Online Chat và Runtime
        if: steps.scope.outputs.mode == 'template-dock-3268'
        run: |
          node --test tests/gmww-v3268-game-sheet-bottom-dock.test.mjs tests/lobby-gather-mode-assassin-20261027.test.mjs tests/v3177-room-mode-glass-dock.test.mjs tests/v368-template-save-select-reliability.test.mjs tests/v367-choose-game-artifact-feedback.test.mjs tests/online-chat-authority.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check server-game/current/app.js
          node --check src/index.js
          node --check .github/scripts/ci-browser-scope.mjs
          test -s docs/releases/GMWW-V3.268-game-template-magnetic-dock-20261028.md
      - name: V3.267 — Audio sáng không người chết và chốt Worker/Runtime liên quan
        if: steps.scope.outputs.mode == 'gm-audio-morning-3267'
        run: |
          node --test tests/audio-role-day-flow-20261027.test.mjs tests/audio-binding-integrity-20261027.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check src/index.js
          node --check server-game/current/app.js
          node --check .github/scripts/ci-browser-scope.mjs
          test -s docs/releases/GMWW-V3.267-morning-zero-deaths-20261028.md
      - name: V3.265 — Tập hợp chụm/banh 50–300%, đồng bộ Worker/GM/Player và OTA
        if: steps.scope.outputs.mode == 'gather-pinch-3265'
        run: |
          node --test tests/gm-gather-pinch-spacing-v3265.test.mjs tests/gather-spacing-gm-menu.test.mjs tests/seat-free-map-drag-v3198.test.mjs tests/lobby-gather-mode-assassin-20261027.test.mjs
          node --test tests/v3183-seat-perimeter-contract.test.mjs tests/seat-presets-fire-v399.test.mjs tests/seat-presets-v397.test.mjs tests/gmww-v3128-seat-geofence-rewrite.test.mjs tests/gmww-v3129-seat-anchor-sync.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check src/index.js
          node --check server-game/current/app.js
          test -s docs/releases/GMWW-V3.265-gather-pinch-spacing-20261028.md
      - name: Online Chat — kiểm tra riêng tư theo lượt, mute, audio và hai bundle
        if: steps.scope.outputs.mode == 'online-chat-audio'
        run: |
          node --test tests/online-chat-authority.test.mjs tests/audio-role-day-flow-20261027.test.mjs tests/audio-binding-integrity-20261027.test.mjs
          node --check src/index.js
          node --check src/gmww-online-chat-policy.js
          node --check .github/scripts/ci-browser-scope.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node -e "import('./src/gmww-members-live.js').then(m=>require('fs').writeFileSync('/tmp/gmww-online-chat-player.js',m.gmwwMembersLiveScript))"
          node --check /tmp/gmww-online-chat-player.js
          test -s docs/releases/GMWW-ONLINE-CHAT-20261028.md
      - name: V3.263 — kiểm RULE Bình Giấc Mơ, Hơi Thở Lão Già, Kim Cương Phủ Nhận
        if: steps.scope.outputs.mode == 'card-rule-3263'
        run: |
          node --test tests/card-rule-contract-audit-20261028.test.mjs tests/card-divination-audit-20261028.test.mjs tests/v389-night-runtime-integration.test.mjs tests/approved-role-card-settings-20261027.test.mjs tests/witch01-old-witch-rules.test.mjs
          node --test tests/gm-fire-walk-position.test.mjs tests/gm-turn-motion-lowheat.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          test -s docs/releases/GMWW-V3.263-card-rule-executors-20261028.md
      - name: Chốt Native V3.257 — xác minh manifest và gói thủ công đúng phạm vi
        if: steps.scope.outputs.mode == 'native-manual-release-verify'
        run: |
          node --check .github/scripts/verify-character40-production.mjs
          node --test tests/native-v3257-release-verify.test.mjs
          node .github/scripts/verify-gmww-versions.mjs
      - name: Cập nhật Runtime thủ công — kiểm tra đúng phạm vi
        if: steps.scope.outputs.mode == 'manual-runtime'
        run: |
          node --test tests/manual-runtime-package.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
      - name: V3.264 — chỉ kiểm thử đóng gói IPA/OTA và SHA-256
        if: steps.scope.outputs.mode == 'ipa-ota-lean-3264'
        run: |
          node --test tests/ipa-ota-lean-assets-v3264.test.mjs tests/action-icon-library.test.mjs tests/manual-runtime-package.test.mjs tests/native-ipa-startup.test.mjs tests/fast-g2-generic-delta.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node --check src/index.js
          node --check server-game/current/app.js
          node --check .github/scripts/prepare-update-channel.mjs
          node --check .github/scripts/ci-browser-scope.mjs
          test -s docs/releases/GMWW-V3.264-ipa-ota-lean-assets-20261028.md
      - name: PR577 — chỉ test Say Rượu, dọn ván và luật Xếp hạng không đổi
        if: steps.scope.outputs.mode == 'drunk-card-overlay-20261028'
        run: |
          node --test tests/drunk-card-overlay-match-cleanup-20261028.test.mjs tests/drunk-draw-spiritualist-expelled-20261027.test.mjs tests/member-ranking-games-first-v3221.test.mjs
          node .github/scripts/assemble-player-web.mjs --verify
          node .github/scripts/assemble-gm-app.mjs --verify
          node --check src/index.js
          node --check server-game/current/app.js
      - name: Kiểm tra mã nguồn Worker
        if: steps.scope.outputs.mode != 'player-top-avatar-603'
        run: npm run check
      - name: Kiểm tra đồng bộ phiên bản GMWW
        run: node .github/scripts/verify-gmww-versions.mjs
      - name: Kiểm tra cú pháp app.js
        run: node --check server-game/current/app.js
      - name: Kiểm tra cú pháp prepare-update-channel.mjs
        run: node --check .github/scripts/prepare-update-channel.mjs
      - name: Kiểm tra cú pháp village.mjs
        run: node --check assets/village/village.mjs
      - name: V3.262 — xác minh bán kính bằng nhau quanh đống lửa GM
        if: steps.scope.outputs.mode == 'gm-fire-radius-3262'
        run: |
          node --test tests/gm-fire-walk-position.test.mjs tests/gm-turn-motion-lowheat.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check server-game/current/app.js
          node --check src/index.js
          test -s docs/releases/GMWW-V3.262-equal-campfire-radius-20261028.md
      - name: V3.261 — test GM đi bộ vào vòng lửa, quay mặt và chạy về ghế
        if: steps.scope.outputs.mode == 'gm-fire-walk-3261'
        run: |
          node --test tests/gm-fire-walk-position.test.mjs tests/gm-turn-motion-lowheat.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check server-game/current/app.js
          node --check src/index.js
          test -s docs/releases/GMWW-V3.261-gm-firewalk-20261028.md
      - name: V3.254 — Hiệu năng & Chống nóng GM
        if: steps.scope.outputs.mode == 'gm-performance-thermal-3254'
        run: |
          node .github/scripts/verify-release-v3254.mjs
          node --check server-game/current/gmww-performance.js
          node --check server-game/current/gmww-shared-motion.js
          node --test tests/gmww-performance-thermal.test.mjs tests/gm-turn-motion-lowheat.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          test -s docs/releases/GMWW-V3.254-performance-thermal-20261027.md
      - name: V3.254 — Sửa kiểm tra SHA-256 GM và Player Web riêng biệt
        if: steps.scope.outputs.mode == 'character40-postverify-3254'
        run: |
          node --check .github/scripts/verify-character40-production.mjs
          node --test tests/gmww-v3254-character40-postverify.test.mjs
          node .github/scripts/verify-gmww-versions.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          test -s docs/releases/GMWW-V3.254-character40-postverify-20261027.md
      - name: Player receipt hotfix — login, join, reconnect and JS integrity
        if: steps.scope.outputs.mode == 'player-receipt-hotfix'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/gmww-player-private-card-patch.js
          node --check src/gmww-members-live.js
          node --test tests/player-web-receipt-patch-hotfix.test.mjs tests/player-web-resume-receipt-runtime.test.mjs
          test -s docs/releases/GMWW-PLAYER-WEB-RECEIPT-HOTFIX-20261027.md
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/gmww-player-receipt-worker.log 2>&1 &
          WPID=$!
          trap 'kill "$WPID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 http://127.0.0.1:8787/api/health > /tmp/player-receipt-health.json 2>/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat /tmp/gmww-player-receipt-worker.log; exit 1; fi
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8787/gmww-members-live.js > /tmp/gmww-player-receipt-live.js
          test -s /tmp/gmww-player-receipt-live.js
          node --check /tmp/gmww-player-receipt-live.js
          node tests/worker-private-delivery-e2e.mjs
          echo 'PASS: JS 200, compiled, login/join/receipt/reconnect via local Worker.'
      - name: PR541 V3.243 — kiểm thử Sảnh Chờ, Tập Hợp, 3 chế độ và Sát Thủ
        if: steps.scope.outputs.mode == 'lobby-gather-541'
        run: |
          node --test tests/lobby-gather-mode-assassin-20261027.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check src/index.js
          node --check server-game/current/app.js
          test -s docs/releases/GMWW-V3.243-lobby-gather-assassin-20261027.md
      - name: V3.246 — xác minh sau merge chỉ icon, audio, Server và ghép Runtime
        if: steps.scope.outputs.mode == 'fairy-246-postmerge'
        run: |
          node --test tests/gmww-v3246-fairy-triptych.test.mjs tests/gmww-action-icons-in-battle.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check server-game/current/app.js
          node --check src/index.js
          test -s docs/releases/GMWW-V3.246-fairy-triptych-audio-20261027.md
      - name: V3.246 — chỉ kiểm tra Yêu Tinh ba nhánh, audio và Server guard
        if: steps.scope.outputs.mode == 'fairy-triptych-3246'
        run: |
          node --test tests/gmww-v3246-fairy-triptych.test.mjs tests/gmww-action-icons-in-battle.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check src/index.js
          node --check server-game/current/app.js
          test -s docs/releases/GMWW-V3.246-fairy-triptych-audio-20261027.md
      - name: V3.242 — chỉ audio icon và Yêu Tinh
        if: steps.scope.outputs.mode == 'fairy-audio-3242'
        run: |
          node --test tests/gmww-v3242-icon-audio-fairy.test.mjs tests/gmww-action-icons-in-battle.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
          node --check src/index.js
          node --check server-game/current/app.js
          test -s docs/releases/GMWW-V3.242-icon-audio-fairy-20261027.md
      - name: V3.242 — chỉ kiểm chính sách CI
        if: steps.scope.outputs.mode == 'fairy-ci-policy'
        run: node --test tests/ci-v3242-fairy-scope.test.mjs
      - name: Chỉ kiểm thử bộ chọn phạm vi hình icon
        if: steps.scope.outputs.mode == 'icon-artwork-policy'
        run: node --test tests/icon-artwork-ci.test.mjs
      - name: Kiểm thử ảnh minh họa, ánh xạ và kéo thả icon
        if: steps.scope.outputs.mode == 'icon-artwork'
        run: |
          node --test tests/icon-artwork-v3.test.mjs tests/action-icon-library.test.mjs tests/action-icon-card-clean.test.mjs tests/gmww-action-icons-in-battle.test.mjs tests/gmww-action-icon-stacking.test.mjs tests/icon-artwork-ci.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node --check server-game/current/action-icon-library.js
          python -m pip install Pillow==11.3.0
          python tools/icons/package-approved-artwork.py --verify

      - name: V3.228 – chỉ kiểm thử giảm ghi DO, quyền GM, Cài đặt và Runtime
        if: steps.scope.outputs.mode == 'do-optimizer-3228'
        run: |
          node --test tests/do-write-optimizer.test.mjs
          node .github/scripts/assemble-gm-app.mjs --verify
          node --check src/index.js
          node --check server-game/current/app.js
          node .github/scripts/verify-gmww-versions.mjs
