name: Quick Play Defaults

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Ghi lên Production (bỏ trống = chỉ xem kế hoạch)"
        type: boolean
        default: false

concurrency:
  group: gmww-quick-play-defaults
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đánh dấu Ván Mẫu Chơi nhanh
        run: node tools/mark-quick-play-defaults.mjs https://gmww-v2-00.williampham0702.workers.dev ${{ inputs.apply && '--apply' || '' }}
