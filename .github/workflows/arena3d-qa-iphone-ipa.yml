name: Arena 3D GĐ32 - IPA nghiệm thu iPhone (STAGING ONLY)
on:
  push:
    branches: ["feature/arena3d-stage14-16-dynamic-artifacts-audio"]
    paths: [".github/workflows/arena3d-qa-iphone-ipa.yml"]
  workflow_dispatch:
    inputs:
      publish_staging_qa:
        description: 'Đóng gói và đăng IPA QA ở kênh STAGING RIÊNG (không Production)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: arena3d-qa-ipa-gd32
  cancel-in-progress: false

jobs:
  qa-ipa:
    name: 'GĐ32: build IPA QA độc lập + SHA-256 + đưa lên server STAGING'
    if: github.ref == 'refs/heads/feature/arena3d-stage14-16-dynamic-artifacts-audio' && (github.event_name == 'push' || inputs.publish_staging_qa == true)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      QA_TAG: arena3d-qa-20261025-gd32-r1
      QA_IPA: GMWW-Arena3D-QA-GD32-20261025.ipa
      QA_BUNDLE_ID: com.gmww.v2.arena3d.qa
      QA_VERSION: 0.32.0
      QA_BUILD: 3201
      QA_ORIGIN: https://gmww-arena3d-stage14-staging.williampham0702.workers.dev
    steps:
      - name: 'Lấy đúng nhánh nghiên cứu Arena 3D, không main'
        uses: actions/checkout@v4
      - name: 'Chốt phạm vi chỉ dành cho Arena 3D iPhone QA'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/arena3d-stage14-16-dynamic-artifacts-audio'
          test -s tools/arena3d-ipa/ArenaStagingGameView.swift
          grep -q 'gmww-arena3d-stage14-staging.williampham0702.workers.dev' tools/arena3d-ipa/ArenaStagingGameView.swift
          ! grep -q 'gmww-v2-00.williampham0702.workers.dev' tools/arena3d-ipa/ArenaStagingGameView.swift
          test -s assets/village/arena-3d/ipa.html
          test -s .github/workflows/arena3d-stage14-16-research.yml
          test -s docs/releases/GMWW-ARENA3D-STAGE29-31-2026-10-25.md
      - name: 'Tạo iOS QA shell riêng biệt (chỉ trong runner)'
        shell: bash
        run: |
          set -euo pipefail
          cp tools/arena3d-ipa/ArenaStagingGameView.swift server-game/GMWW-Server/GameView.swift
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName GMWW Arena 3D QA' server-game/GMWW-Server/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName GMWW Arena 3D QA' server-game/GMWW-Server/Info.plist
          mkdir -p server-game/GMWW-Server/Web server-game/GMWW-Server/Assets.xcassets
          echo 'Arena 3D QA - HTTPS STAGING only; no bundled GMWW Runtime/OTA' > server-game/GMWW-Server/Web/README-QA.txt
          cat > server-game/GMWW-Server/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          # Never install or overwrite app bundle com.gmww.v2.server.
          echo 'QA is a separate installable application identifier: com.gmww.v2.arena3d.qa'
      - name: 'Biên dịch iOS trên macOS runner, không ký hoặc cập nhật IPA chính thức'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -project server-game/GMWW-Server.xcodeproj \
            -scheme GMWW-Server -configuration Release -sdk iphoneos \
            -derivedDataPath arena3d-qa-build \
            PRODUCT_BUNDLE_IDENTIFIER="$QA_BUNDLE_ID" \
            MARKETING_VERSION="$QA_VERSION" CURRENT_PROJECT_VERSION="$QA_BUILD" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: 'Đóng gói IPA QA, đối chiếu bundle ID, mã phiên bản và SHA-256'
        shell: bash
        run: |
          set -euo pipefail
          APP="arena3d-qa-build/Build/Products/Release-iphoneos/GMWW-Server.app"
          test -s "$APP/GMWW-Server"
          test -s "$APP/Info.plist"
          test -s "$APP/Web/README-QA.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$QA_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$QA_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$QA_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 'GMWW Arena 3D QA'
          test ! -d "$APP/_CodeSignature"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$QA_IPA"
          unzip -t "$QA_IPA" >/dev/null
          IPA_BYTES="$(stat -f%z "$QA_IPA")"
          echo "Arena QA IPA compressed bytes: $IPA_BYTES"
          test "$IPA_BYTES" -gt 10000
          shasum -a 256 "$QA_IPA" > "$QA_IPA.sha256"
          printf 'Arena 3D QA 0.32.0 (GĐ32)\nsource=%s\nbundleId=%s\nserver=%s\nsigning=UNSIGNED_NEEDS_SIGNING_BEFORE_IPHONE_INSTALL\nofficial=false\n' \
            "$GITHUB_SHA" "$QA_BUNDLE_ID" "$QA_ORIGIN" > ARENA-QA-METADATA.txt
          cat "$QA_IPA.sha256"
      - name: 'Lưu IPA QA làm bản dự phòng của GitHub Actions'
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-Arena3D-QA-GD32-IPA
          path: |
            ${{ env.QA_IPA }}
            ${{ env.QA_IPA }}.sha256
            ARENA-QA-METADATA.txt
          if-no-files-found: error
          retention-days: 30
      - name: 'Đăng bản prerelease QA riêng, KHÔNG vào Tải IPA chính thức'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "IPA QA đã đăng trong prerelease bất biến, chỉ kiểm tra & deploy lại trang STAGING"
            gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fx "$QA_IPA"
          else
          cat > QA-RELEASE-NOTES.md <<'NOTES'
          # GMWW Arena 3D · IPA QA GĐ32 (chỉ STAGING)
          - Ứng dụng QA có bundle ID riêng; mở Arena 3D từ Worker/Durable Objects STAGING; không dùng phòng/dữ liệu Production.
          - Lấy menu hành động từ Core, hỗ trợ 30 Character, Role/Artifact, Day/Night, Lên Giàn và reconnect.
          - **IPA chưa ký iOS**. Cần ký hợp lệ/sideload có ký trước khi cài trên iPhone, KHÔNG phải file bấm Safari là cài.
          - Đây là prerelease kỹ thuật, không thay đổi kênh **TẢI IPA** chính thức, main, OTA hoặc game 2D.
          - SHA-256 nằm trong asset đi kèm.
          NOTES
          gh release create "$QA_TAG" "$QA_IPA" "$QA_IPA.sha256" ARENA-QA-METADATA.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GMWW Arena 3D QA - GĐ32 - STAGING (unsigned IPA)" \
            --notes-file QA-RELEASE-NOTES.md --prerelease
          fi
          gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets
      - name: 'Đưa trang TẢI IPA QA lên Worker STAGING độc lập'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --version
          npm ci
          npx wrangler deploy --config wrangler.arena3d-stage14-staging.jsonc
          URL="$QA_ORIGIN/api/arena-staging/ipa/metadata"
          # Cloudflare routes take time to propagate after Worker deployment.
          # Do not mistake immediate eventual-consistency 404 for missing IPA.
          HTTP=000
          for ATTEMPT in $(seq 1 15); do
            HTTP=$(curl -sS --max-time 10 -o /tmp/arena-ipa-meta.json \
              -w '%{http_code}' "$URL?nonce=$ATTEMPT" || echo 000)
            if [ "$HTTP" = 200 ]; then break; fi
            echo "STAGING chưa sẵn sàng ($HTTP) sau deploy - kiểm lại lần $ATTEMPT/15"
            sleep 3
          done
          test "$HTTP" = 200 || { cat /tmp/arena-ipa-meta.json; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/arena-ipa-meta.json','utf8'));
          if(d.ok!==true||d.officialRelease!==false||
             d.bundleId!=='com.gmww.v2.arena3d.qa'||
             d.signing!=='unsigned-needs-iOS-sideload-signing')
             throw Error('STAGING QA IPA metadata invalid: '+JSON.stringify(d));
          console.log('STAGING IPA QA endpoint PASS',d.download);
          NODE
          PAGE_HTTP=$(curl -sS -L --max-time 10 -o /dev/null -w '%{http_code}' \
            "$QA_ORIGIN/village/arena-3d/ipa.html")
          test "$PAGE_HTTP" = 200
          echo "Link Tải IPA QA: $QA_ORIGIN/village/arena-3d/ipa.html" >> "$GITHUB_STEP_SUMMARY"
          echo 'Không phải bản IPA đã ký. Giữ Production và IPA chính thức nguyên trạng.' >> "$GITHUB_STEP_SUMMARY"
