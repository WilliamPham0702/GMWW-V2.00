name: Check GM card artwork centering (20261029)

on:
  pull_request:
    branches: [main]
    paths:
      - "server-game/src/10-library-and-settings.part"
      - "server-game/current/app.js"
      - "tests/artifact-preview-horizontal-centering-20261029.test.mjs"
      - ".github/workflows/check-gm-card-preview-centering-20261029.yml"
  push:
    branches: [main]
    paths:
      - "server-game/src/10-library-and-settings.part"
      - "server-game/current/app.js"
      - "tests/artifact-preview-horizontal-centering-20261029.test.mjs"
      - ".github/workflows/check-gm-card-preview-centering-20261029.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-centering:
    name: Card centering and role isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Artifact preview + Vai Trò isolation
        run: node --test tests/artifact-preview-horizontal-centering-20261029.test.mjs
      - name: Verify GM source and bundle
        run: |
          node --check server-game/current/app.js
          node .github/scripts/assemble-gm-app.mjs --verify
          node .github/scripts/verify-gmww-versions.mjs
