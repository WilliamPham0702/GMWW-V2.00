name: Build Quản Trò Ma Sói V2 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server-game/**'
      - '.github/workflows/build-server-game-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean V2.06 web bundle
        run: |
          set -euo pipefail
          APPDIR="server-game/GMWW-Server"
          rm -rf "$APPDIR/Web"
          mkdir -p "$APPDIR/Web"
          cp server-game/v205/index.html "$APPDIR/Web/GMWW.html"
          cp server-game/v205/style.css "$APPDIR/Web/style.css"
          cp server-game/v205/app.js "$APPDIR/Web/app.js"
          cp server-game/v205/artwork.js "$APPDIR/Web/artwork.js"
          test -s "$APPDIR/Web/GMWW.html"
          test -s "$APPDIR/Web/app.js"
          test -s "$APPDIR/Web/artwork.js"
          grep -q 'GMWW V2.06' "$APPDIR/Web/GMWW.html"
          grep -q 'ARTIFACTS' "$APPDIR/Web/GMWW.html"
          grep -q 'Lá Bài' "$APPDIR/Web/GMWW.html"
          grep -q 'Hành Động' "$APPDIR/Web/GMWW.html"
          grep -q 'Hiệu Ứng' "$APPDIR/Web/GMWW.html"
          grep -q 'Chủ Đề' "$APPDIR/Web/GMWW.html"
          grep -q 'Âm Thanh' "$APPDIR/Web/GMWW.html"
          grep -q 'role_old_witch' "$APPDIR/Web/app.js"
          grep -q 'action_exile' "$APPDIR/Web/app.js"
          grep -q 'effect_exile' "$APPDIR/Web/app.js"
          grep -q 'GMWW205_DEFAULT_DISPLAY' "$APPDIR/Web/artwork.js"

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check server-game/v205/app.js
          node --check server-game/v205/artwork.js

      - name: Generate App Icon
        run: |
          set -euo pipefail
          ICONSET="server-game/GMWW-Server/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          NSColor(calibratedRed: 0.02, green: 0.10, blue: 0.17, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x:0,y:0,width:1024,height:1024)).fill()
          let moon = NSBezierPath(ovalIn:NSRect(x:170,y:170,width:684,height:684))
          NSColor(calibratedRed:0.18,green:0.78,blue:0.92,alpha:1).setFill()
          moon.fill()
          image.unlockFocus()
          guard let tiff=image.tiffRepresentation,
                let rep=NSBitmapImageRep(data:tiff),
                let png=rep.representation(using:.png,properties:[:]) else { exit(1) }
          try png.write(to:URL(fileURLWithPath:CommandLine.arguments[1]))
          SWIFT
          swift /tmp/make_icon.swift "$ICONSET/icon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          mkdir -p "server-game/GMWW-Server/Assets.xcassets"
          cat > "server-game/GMWW-Server/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Build unsigned V2.06 app
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild             -project server-game/GMWW-Server.xcodeproj             -scheme GMWW-Server             -configuration Release             -sdk iphoneos             -derivedDataPath build-v2             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package and verify V2.06 IPA
        run: |
          set -euo pipefail
          APP="build-v2/Build/Products/Release-iphoneos/GMWW-Server.app"
          test -d "$APP"
          test -s "$APP/Web/GMWW.html"
          test -s "$APP/Web/app.js"
          test -s "$APP/Web/artwork.js"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -q 'Quản Trò Ma Sói'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -q '2.06'
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload GMWW-V2.06-unsigned.ipa
          unzip -t GMWW-V2.06-unsigned.ipa >/dev/null
          unzip -l GMWW-V2.06-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/GMWW.html'
          unzip -l GMWW-V2.06-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/app.js'
          unzip -l GMWW-V2.06-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/artwork.js'

      - name: Upload V2.06 IPA
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-V2.06-IPA
          path: GMWW-V2.06-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
