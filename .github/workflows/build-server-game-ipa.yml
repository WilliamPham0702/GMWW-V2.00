name: Build Native GMWW IPA

# Full Xcode build is reserved for true native-shell changes.
# Runtime/server/UI changes must use the runtime channel or Fast Runtime Snapshot workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server-game/GMWW-Server/**"
      - "server-game/GMWW-Server.xcodeproj/**"
      - ".github/workflows/build-server-game-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('server-game/current/app.js','utf8');
          const project=fs.readFileSync('server-game/GMWW-Server.xcodeproj/project.pbxproj','utf8');
          const runtime=app.match(/const VERSION='([^']+)'/)?.[1]||'';
          const build=project.match(/CURRENT_PROJECT_VERSION = ([0-9]+);/)?.[1]||'';
          const shell=project.match(/MARKETING_VERSION = ([^;]+);/)?.[1]?.trim()||'';
          if(!runtime||!shell||!build) throw new Error('Missing runtime/native build metadata');
          if(shell!==runtime) {
            throw new Error(
              'Native build blocked: runtime V'+runtime+' is running on native shell V'+shell+
              '. This is a runtime-only state. Use the Fast Runtime Snapshot workflow, or intentionally bump Xcode MARKETING_VERSION/CURRENT_PROJECT_VERSION for a true native release.'
            );
          }
          if(shell.replace(/\./g,'')!==build) throw new Error('Native build '+build+' does not match shell version '+shell);
          const version=shell;
          fs.appendFileSync(process.env.GITHUB_ENV,`VERSION=${version}\nRUNTIME_VERSION=${runtime}\nNATIVE_SHELL_VERSION=${shell}\nBUILD=${build}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\nruntime=${runtime}\nshell=${shell}\nbuild=${build}\n`);
          console.log('Resolved native V'+shell+' / build '+build+' with bundled runtime V'+runtime);
          NODE

      - name: Prepare clean web bundle
        run: |
          set -euo pipefail
          APPDIR="server-game/GMWW-Server"
          rm -rf "$APPDIR/Web"
          mkdir -p "$APPDIR/Web"
          cp server-game/current/GMWW.html "$APPDIR/Web/GMWW.html"
          cp server-game/current/style.css "$APPDIR/Web/style.css"
          cp server-game/current/app.js "$APPDIR/Web/app.js"
          cp server-game/current/character-renderer.js "$APPDIR/Web/character-renderer.js"
          cp server-game/current/character-renderer.css "$APPDIR/Web/character-renderer.css"
          cp server-game/current/gmww-village-coast.svg "$APPDIR/Web/gmww-village-coast.svg"
          cp assets/backgrounds/gmww-village-day-v260.webp "$APPDIR/Web/"
          cp assets/backgrounds/gmww-village-night-v260.webp "$APPDIR/Web/"
          cp assets/village/village-layout.js "$APPDIR/Web/village-layout.js"
          mkdir -p "$APPDIR/Web/game-characters"
          cp assets/characters/v253/chibi-*.webp "$APPDIR/Web/game-characters/"
          mkdir -p "$APPDIR/Web/gm"
          cp assets/gm/gm-white-wolf.webp "$APPDIR/Web/gm/"
          mkdir -p "$APPDIR/Web/game-characters/walk-v263"
          cp -R assets/characters/walk-v263/character-* "$APPDIR/Web/game-characters/walk-v263/"
          mkdir -p "$APPDIR/Web/game-characters/walk-v266-left"
          cp -R assets/characters/walk-v266-left/character-* "$APPDIR/Web/game-characters/walk-v266-left/"
          test "$(find "$APPDIR/Web/game-characters/walk-v263" -type f -name 'frame-*.webp' | wc -l | tr -d ' ')" -eq 120
          test "$(find "$APPDIR/Web/game-characters/walk-v266-left" -type f -name 'frame-*.webp' | wc -l | tr -d ' ')" -eq 120

          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('server-game/shared/artwork.js','utf8');
          const m=src.match(/data:image\/webp;base64,([^']+)/);
          if(!m) throw new Error('Default artwork WebP payload not found');
          fs.writeFileSync('server-game/GMWW-Server/Web/default-artwork.webp',Buffer.from(m[1],'base64'));
          NODE

          test -s "$APPDIR/Web/GMWW.html"
          test -s "$APPDIR/Web/style.css"
          test -s "$APPDIR/Web/app.js"
          test -s "$APPDIR/Web/character-renderer.js"
          test -s "$APPDIR/Web/character-renderer.css"
          test -s "$APPDIR/Web/gmww-village-coast.svg"
          test -s "$APPDIR/Web/gm/gm-white-wolf.webp"
          test -s "$APPDIR/Web/default-artwork.webp"

          grep -q "GMWW V$VERSION" "$APPDIR/Web/GMWW.html"
          grep -q "const VERSION='$VERSION'" "$APPDIR/Web/app.js"
          grep -q 'character-renderer.js' "$APPDIR/Web/GMWW.html"
          grep -q 'segmented-skeletal' "$APPDIR/Web/character-renderer.js"
          grep -q 'gmwwPlayRigLegA' "$APPDIR/Web/character-renderer.css"
          # Presentation-only updates keep the prior storage keys intentionally.
          grep -q "const STATE_KEY='GMWW_V258_STATE'" "$APPDIR/Web/app.js"
          grep -q "const PREF_KEY='GMWW_V258_PREFS'" "$APPDIR/Web/app.js"
          grep -q 'gmww-village-coast.svg' "$APPDIR/Web/style.css"
          grep -q 'id="playRoomModeToggle"' "$APPDIR/Web/GMWW.html"
          grep -q 'id="playSeatSheet"' "$APPDIR/Web/GMWW.html"
          grep -q "gameCharacterId" "$APPDIR/Web/app.js"
          grep -q "playUpdateRoomSettings" "$APPDIR/Web/app.js"
          ! grep -q 'id="playCreateRoomSeatCount"' "$APPDIR/Web/GMWW.html"
          ! grep -q 'id="playCreateRoomCode"' "$APPDIR/Web/GMWW.html"
          grep -q "enabled:playSceneState.roomEnabled===true,seatMoveMode:'instant'" "$APPDIR/Web/app.js"
          grep -q "THỦ CÔNG" "$APPDIR/Web/app.js"
          grep -q "NGẪU NHIÊN" "$APPDIR/Web/app.js"
          grep -q "playMovementPoint" "$APPDIR/Web/app.js"

          # Core catalog / theme / audio / member capabilities must remain present.
          grep -q "applyV226Catalog" "$APPDIR/Web/app.js"
          grep -q "default-artwork.webp" "$APPDIR/Web/app.js"
          grep -q "Thêm Vai Trò" "$APPDIR/Web/app.js"
          grep -q "pickEntityThemeArtwork" "$APPDIR/Web/app.js"
          grep -q "audio_card_role_wolf" "$APPDIR/Web/app.js"
          grep -q "theme-card-row-simple" "$APPDIR/Web/style.css"
          ! grep -q "data-pref=\"hide\">" "$APPDIR/Web/app.js"
          grep -q "Quản lý Thành Viên • Xếp Hạng" "$APPDIR/Web/GMWW.html"
          ! grep -q 'data-member-tab="history"' "$APPDIR/Web/GMWW.html"
          ! grep -q 'id="memberPane-history"' "$APPDIR/Web/GMWW.html"
          grep -q "memberRankingList" "$APPDIR/Web/GMWW.html"
                    grep -q "/api/gm/members" "$APPDIR/Web/app.js"
          grep -q "renderMemberRanking" "$APPDIR/Web/app.js"
          grep -q "renderMemberHistory" "$APPDIR/Web/app.js"
          grep -q "auditLocalData" "$APPDIR/Web/app.js"
          grep -q "clearSafeRuntimeCache" "$APPDIR/Web/app.js"
          ! grep -q 'data-act="edit"' "$APPDIR/Web/app.js"
          grep -q "ondblclick" "$APPDIR/Web/app.js"
          grep -q "cardFaceCount" "$APPDIR/Web/GMWW.html"
          grep -q "artifactFaceCount" "$APPDIR/Web/GMWW.html"
          grep -q "refreshServerData" "$APPDIR/Web/app.js"
          grep -q "openPlayerWeb" "$APPDIR/Web/app.js"
          ! grep -q "githubOptimizeCard" "$APPDIR/Web/GMWW.html"
          grep -q "resetRanking" "$APPDIR/Web/app.js"
          grep -q "clearMemberHistory" "$APPDIR/Web/app.js"
          grep -q "resetMemberPassword" "$APPDIR/Web/app.js"
          grep -q "catalog-count-badge" "$APPDIR/Web/GMWW.html"
          ! grep -q "catalog-count-bottom" "$APPDIR/Web/GMWW.html"
          grep -q "health-v236-actions" "$APPDIR/Web/GMWW.html"
          ! grep -q 'data-act="edit"' "$APPDIR/Web/app.js"
          ! grep -q 'data-act="edit"' "$APPDIR/Web/app.js"
          grep -q "ondblclick" "$APPDIR/Web/app.js"
          grep -q "cardFaceCount" "$APPDIR/Web/GMWW.html"
          grep -q "refreshServerData" "$APPDIR/Web/app.js"
          ! grep -q "purgeMembers" "$APPDIR/Web/app.js"
          ! grep -q "Xoá toàn bộ Thành Viên" "$APPDIR/Web/GMWW.html"

          # CLEAN BASELINE: only the canonical Settings block may remain.
          grep -q "CLEAN BASELINE: SETTINGS" "$APPDIR/Web/style.css"
          ! grep -q "V2.27 — stable iPhone touch targets for Settings actions" "$APPDIR/Web/style.css"
          ! grep -q "V2.28 — fixed Settings geometry + prominent touch actions" "$APPDIR/Web/style.css"
          ! grep -q "V2.29 — truly fixed Settings cards" "$APPDIR/Web/style.css"

          # Known legacy/runtime regressions must stay absent.
          ! grep -q "btn.textContent='Đang kiểm tra" "$APPDIR/Web/app.js"
          ! grep -q "mode:'no-cors'" "$APPDIR/Web/app.js"
          grep -q "navigationAction.targetFrame" server-game/GMWW-Server/GameView.swift
          ! grep -q 'data-filter="star"' "$APPDIR/Web/GMWW.html"
          ! grep -q 'data-theme-display-url' "$APPDIR/Web/app.js"
          ! grep -q 'data-theme-thumb-url' "$APPDIR/Web/app.js"
          ! test -e "$APPDIR/Web/v1-audio.js"
          ! test -e "$APPDIR/Web/sea-artwork.js"
          ! test -e "$APPDIR/Web/phu-thuy-gia-sea-display.webp"
          ! test -e "$APPDIR/Web/phu-thuy-gia-sea-thumb.webp"

      - name: Restore stable legacy artwork package
        run: |
          set -euo pipefail
          SOURCE="server-game/legacy-assets/v252"
          ARCHIVE="$RUNNER_TEMP/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          URL="https://github.com/WilliamPham0702/GMWW-V2.00/releases/download/legacy-assets-v252/GMWW-V2.52-legacy-assets-for-GitHub.zip"
          EXPECTED_SHA="b9229b9b48f5fa3e63dfb831e0ac523cad0ec469d3e3b8c2dca59ef594616c36"

          CURRENT_COUNT=0
          if test -d "$SOURCE/assets/role-artwork-v251"; then
            CURRENT_COUNT=$(find "$SOURCE/assets/role-artwork-v251" -type f -name '*.webp' | wc -l | tr -d ' ')
          fi

          if ! test -s "$SOURCE/role-artwork-v251.js" || test "$CURRENT_COUNT" -ne 189; then
            echo "Restoring canonical V2.52 legacy artwork package from GitHub Release..."
            rm -rf "$SOURCE"
            curl --fail --location --retry 4 --retry-delay 3 --output "$ARCHIVE" "$URL"
            echo "$EXPECTED_SHA  $ARCHIVE" | shasum -a 256 -c -
            unzip -q "$ARCHIVE" -d .
          fi

          test -s "$SOURCE/role-artwork-v251.js"
          RESTORED_COUNT=$(find "$SOURCE/assets/role-artwork-v251" -type f -name '*.webp' | wc -l | tr -d ' ')
          test "$RESTORED_COUNT" -eq 189
          echo "Legacy artwork ready: $RESTORED_COUNT WebP files"

      - name: Package clean 63-role artwork only
        run: |
          set -euo pipefail
          # Keep one clean, high-resolution artwork per role. Do not package old
          # delivery/thumb duplicates; the app resolves every size to the clean source.
          SOURCE="server-game/legacy-assets/v252"
          ORIGINAL="$SOURCE/assets/role-artwork-v251/original"
          test -s "$SOURCE/role-artwork-v251.js" || { echo "ERROR: role artwork manifest missing; release blocked"; exit 1; }
          COUNT=$(find "$ORIGINAL" -type f -name '*.webp' | wc -l | tr -d ' ')
          test "$COUNT" -eq 63 || { echo "ERROR: expected 63 clean role artworks; found $COUNT"; exit 1; }

          DEST="server-game/GMWW-Server/Web/assets/role-artwork-v251/original"
          mkdir -p "$DEST"
          cp "$ORIGINAL"/*.webp "$DEST/"

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('server-game/legacy-assets/v252/role-artwork-v251.js','utf8'),ctx);
          const src=ctx.window.GMWW_BUILTIN_ROLE_ARTWORK||{},out={};
          for(const [id,row] of Object.entries(src)){
            const p='assets/role-artwork-v251/original/'+id+'.webp';
            out[id]={...row,display:p,delivery:p,thumb:p,width:3072,height:2560,deliveryWidth:3072,deliveryHeight:2560};
          }
          if(Object.keys(out).length!==63)throw new Error('Expected 63 role mappings, found '+Object.keys(out).length);
          fs.writeFileSync('server-game/GMWW-Server/Web/role-artwork-v251.js','window.GMWW_BUILTIN_ROLE_ARTWORK='+JSON.stringify(out)+';\n');
          NODE

          test "$(find server-game/GMWW-Server/Web/assets/role-artwork-v251 -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 63
          ! test -d server-game/GMWW-Server/Web/assets/role-artwork-v251/delivery
          ! test -d server-game/GMWW-Server/Web/assets/role-artwork-v251/thumb
          node - <<'NODE'
          const fs=require('fs');
          const file='server-game/GMWW-Server/Web/GMWW.html';
          let html=fs.readFileSync(file,'utf8');
          if(!html.includes('role-artwork-v251.js')){
            const re=/<script src="app\\.js(?:\\?v=[^"]+)?"><\\/script>/;
            const match=html.match(re);
            if(!match)throw new Error('app.js script tag not found');
            html=html.replace(re,'<script src="role-artwork-v251.js"></script>\\n'+match[0]);
            fs.writeFileSync(file,html);
          }
          NODE
          grep -q 'role-artwork-v251.js' server-game/GMWW-Server/Web/GMWW.html

      - name: Validate JavaScript and baseline structure
        run: |
          set -euo pipefail
          node --check server-game/current/app.js
          node --check server-game/shared/artwork.js
          node --check src/index.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('server-game/current/app.js','utf8');
          const bad=[...s.matchAll(/(^|[^$])\$\([^;\n]*?\)\.forEach/g)];
          if(bad.length) throw new Error('Invalid single-element selector loop');
          if(!s.includes("artifacts:[]")) throw new Error('Default ARTIFACT catalog is not empty');
          const vm=require('vm');
          const stubEl=()=>({dataset:{},classList:{toggle(){},add(){},remove(){},contains(){return false}},style:{},value:'',checked:false,innerHTML:'',textContent:'',files:[],scrollTop:0,disabled:false,querySelector(){return stubEl()},querySelectorAll(){return[]},addEventListener(){},setAttribute(){},removeAttribute(){},appendChild(){},remove(){},click(){},focus(){},closest(){return null}});
          const doc={readyState:'complete',querySelector(){return stubEl()},querySelectorAll(){return[]},getElementById(){return stubEl()},createElement(){return stubEl()},body:stubEl(),addEventListener(){}};
          const store=new Map();
          const ctx={document:doc,localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)},window:{},CSS:{escape:s=>String(s)},navigator:{onLine:true},console,Blob,Uint8Array,atob:s=>Buffer.from(s,'base64').toString('binary'),btoa:s=>Buffer.from(s,'binary').toString('base64'),performance:{now:()=>0},fetch:async()=>({ok:true,json:async()=>({})}),AbortController:class{constructor(){this.signal={}}abort(){}},setTimeout(){return 0},clearTimeout(){},setInterval(){return 0},clearInterval(){},confirm(){return true},alert(){},URL:{createObjectURL(){return''},revokeObjectURL(){}},indexedDB:{open(){return{}}},Image:class{},FileReader:class{},Audio:class{play(){return Promise.resolve()}pause(){}}};
          ctx.window=ctx;ctx.window.addEventListener=()=>{};ctx.window.location={assign(){}};ctx.window.GMWW_THEME_ARTWORK={};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('assets/village/village-layout.js','utf8'),ctx,{filename:'village-layout.js'});
          vm.runInContext(s,ctx,{filename:'app.js'});
          console.log('Runtime smoke test passed');
          if(s.includes("GMWW224_SEA_ASSETS")||s.includes("GMWW208_SEA_DISPLAY")) throw new Error('Legacy artwork resolver remains');

          const critical=[
            'checkServerHealth','setServerHealthState',
            'loadMembers','renderMemberRanking','renderMemberHistory','switchMemberTab','openMemberSheet','saveMemberSheet'
          ];
          for(const name of critical){
            const n=(s.match(new RegExp('function\\s+'+name+'\\s*\\(','g'))||[]).length;
            if(n!==1) throw new Error(name+' must have exactly one definition, found '+n);
          }

          const css=fs.readFileSync('server-game/current/style.css','utf8');
          let depth=0;
          for(const ch of css){if(ch==='{')depth++;else if(ch==='}')depth--;if(depth<0)throw new Error('CSS brace underflow')}
          if(depth!==0) throw new Error('CSS braces are unbalanced');
          console.log('Clean baseline structure verified');
          NODE

      - name: Verify optimized default artwork
        run: |
          set -euo pipefail
          ART="server-game/GMWW-Server/Web/default-artwork.webp"
          sips -g pixelWidth -g pixelHeight "$ART" | grep -q '1064'
          sips -g pixelWidth -g pixelHeight "$ART" | grep -q '1478'
          BYTES=$(stat -f%z "$ART")
          test "$BYTES" -lt 700000

      - name: Generate App Icon
        run: |
          set -euo pipefail
          ICONSET="server-game/GMWW-Server/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          base64 --decode -i server-game/shared/app-icon-v2.base64 -o "$ICONSET/icon-source.jpg"
          sips -z 1024 1024 "$ICONSET/icon-source.jpg" --out "$ICONSET/icon-1024.jpg" >/dev/null
          rm "$ICONSET/icon-source.jpg"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {"images":[{"filename":"icon-1024.jpg","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          mkdir -p "server-game/GMWW-Server/Assets.xcassets"
          cat > "server-game/GMWW-Server/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Build unsigned app
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild \
            -project server-game/GMWW-Server.xcodeproj \
            -scheme GMWW-Server \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-v2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP="build-v2/Build/Products/Release-iphoneos/GMWW-Server.app"
          IPA="GMWW-V$VERSION.ipa"
          test -d "$APP"
          test -s "$APP/Web/GMWW.html"
          test -s "$APP/Web/app.js"
          test -s "$APP/Web/style.css"
          test -s "$APP/Web/gmww-village-coast.svg"
          test -s "$APP/Web/gm/gm-white-wolf.webp"
          test -s "$APP/Web/gmww-village-day-v260.webp"
          test -s "$APP/Web/gmww-village-night-v260.webp"
          test "$(find "$APP/Web/game-characters" -name 'chibi-*.webp' | wc -l | tr -d ' ')" -eq 42
          test "$(find "$APP/Web/game-characters/walk-v263" -type f -name 'frame-*.webp' | wc -l | tr -d ' ')" -eq 120
          test "$(find "$APP/Web/game-characters/walk-v266-left" -type f -name 'frame-*.webp' | wc -l | tr -d ' ')" -eq 120
          test -s "$APP/Web/default-artwork.webp"
          test "$(find "$APP/Web/assets/role-artwork-v251/original" -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 63
          ! test -d "$APP/Web/assets/role-artwork-v251/delivery"
          ! test -d "$APP/Web/assets/role-artwork-v251/thumb"
          ! test -e "$APP/Web/v1-audio.js"
          ! test -e "$APP/Web/sea-artwork.js"
          ! test -e "$APP/Web/phu-thuy-gia-sea-display.webp"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -q 'Quản Trò Ma Sói'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -q '^com.gmww.v2.server$'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -q "^$VERSION$"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -q "^$BUILD$"

          cmp -s server-game/GMWW-Server/Web/GMWW.html "$APP/Web/GMWW.html"
          cmp -s assets/village/village-layout.js "$APP/Web/village-layout.js"
          cmp -s server-game/current/app.js "$APP/Web/app.js"
          cmp -s server-game/current/style.css "$APP/Web/style.css"
          cmp -s server-game/current/gmww-village-coast.svg "$APP/Web/gmww-village-coast.svg"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -l "$IPA" | grep -q 'Payload/GMWW-Server.app/Web/default-artwork.webp'
          unzip -l "$IPA" | grep -q 'Payload/GMWW-Server.app/Web/gmww-village-coast.svg'
          ! unzip -l "$IPA" | grep -q 'phu-thuy-gia-sea-display'
          ! unzip -l "$IPA" | grep -q 'v1-audio.js'

          IPA_BYTES=$(stat -f%z "$IPA")
          echo "IPA bytes: $IPA_BYTES"
          test "$IPA_BYTES" -gt 50000000
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-V${{ steps.meta.outputs.version }}
          path: GMWW-V${{ steps.meta.outputs.version }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA for in-app download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="gmww-v$VERSION"
          IPA="GMWW-V$VERSION.ipa"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --title "GMWW V$VERSION" --notes "Verified GMWW IPA V$VERSION / build $BUILD"
          else
            gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
          fi
