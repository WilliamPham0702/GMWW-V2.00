name: Build Quản Trò Ma Sói V2 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server-game/**'
      - '.github/workflows/build-server-game-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean V2.12 web bundle
        run: |
          set -euo pipefail
          APPDIR="server-game/GMWW-Server"
          export APPDIR_FOR_ASSERT="$APPDIR"
          rm -rf "$APPDIR/Web"
          mkdir -p "$APPDIR/Web"
          cp server-game/v212/index.html "$APPDIR/Web/GMWW.html"
          cp server-game/v212/style.css "$APPDIR/Web/style.css"
          cp server-game/v212/app.js "$APPDIR/Web/app.js"
          cp server-game/v205/artwork.js "$APPDIR/Web/artwork.js"
          cp server-game/v208/sea-artwork.js "$APPDIR/Web/sea-artwork.js"
          cp server-game/v208/phu-thuy-gia-sea-display.webp "$APPDIR/Web/phu-thuy-gia-sea-display.webp"
          cp server-game/v208/phu-thuy-gia-sea-thumb.webp "$APPDIR/Web/phu-thuy-gia-sea-thumb.webp"
          test -s "$APPDIR/Web/GMWW.html"
          test -s "$APPDIR/Web/app.js"
          test -s "$APPDIR/Web/artwork.js"
          test -s "$APPDIR/Web/phu-thuy-gia-sea-display.webp"
          test -s "$APPDIR/Web/phu-thuy-gia-sea-thumb.webp"
          grep -q 'GMWW V2.12' "$APPDIR/Web/GMWW.html"
          grep -q 'card-zone-head' "$APPDIR/Web/GMWW.html"
          grep -q 'Số mạng' "$APPDIR/Web/GMWW.html"
          grep -q 'Cho phép nhiều Hành Động trong cùng lượt' "$APPDIR/Web/GMWW.html"
          grep -q 'Cài đặt Hành Động trên Lá' "$APPDIR/Web/GMWW.html"
          grep -q 'Âm Thanh' "$APPDIR/Web/GMWW.html"
          grep -q 'Hình nền' "$APPDIR/Web/app.js"
          grep -q 'Banner Trang Chủ' "$APPDIR/Web/app.js"
          grep -q 'Hình Thanh Điều Hướng' "$APPDIR/Web/app.js"
          grep -q 'pushToPlayerWeb' "$APPDIR/Web/app.js"
          grep -q 'themeArtifactRows' "$APPDIR/Web/GMWW.html"
          grep -q 'applyV210Rules' "$APPDIR/Web/app.js"
          grep -q 'formatInformation' "$APPDIR/Web/app.js"
          grep -q 'theme-collapsible' "$APPDIR/Web/app.js"
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync(process.env.APPDIR_FOR_ASSERT + '/Web/app.js','utf8');
          if(!s.includes("$('[data-theme]',holder).forEach")) process.exit(1);
          if(s.includes("$('[data-theme]',holder).forEach")) process.exit(1);
          if(!s.includes("$('[data-theme-upload]',row).forEach")) process.exit(1);
          if(s.includes("$('[data-theme-upload]',row).forEach")) process.exit(1);
          NODE

          grep -q 'pushToPlayerWeb:true,targetPreviousCycleOnly:true' "$APPDIR/Web/app.js"
          grep -q 'toNight:null' "$APPDIR/Web/app.js"
          ! grep -q 'Mục tiêu tối thiểu' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Mục tiêu tối đa' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Cho phép nhiều mục tiêu' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Áp dụng Từ đêm' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Áp dụng Đến đêm' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Rule Group 7' "$APPDIR/Web/GMWW.html"
          ! grep -q 'Nhiều mạng' "$APPDIR/Web/GMWW.html"

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check server-game/v212/app.js
          node --check server-game/v208/sea-artwork.js
          node --check server-game/v205/artwork.js

      - name: Verify typography and artwork
        run: |
          set -euo pipefail
          grep -q 'font-size:14.5px' server-game/v212/style.css
          grep -q 'font-size:24px' server-game/v212/style.css
          grep -q 'text-align:justify' server-game/v212/style.css
          grep -q '.editor-actions{position:static' server-game/v212/style.css
          sips -g pixelWidth -g pixelHeight server-game/v208/phu-thuy-gia-sea-display.webp | grep -q '1024'
          sips -g pixelWidth -g pixelHeight server-game/v208/phu-thuy-gia-sea-display.webp | grep -q '936'
          sips -g pixelWidth -g pixelHeight server-game/v208/phu-thuy-gia-sea-thumb.webp | grep -q '360'
          sips -g pixelWidth -g pixelHeight server-game/v208/phu-thuy-gia-sea-thumb.webp | grep -q '329'

      - name: Generate App Icon
        run: |
          set -euo pipefail
          ICONSET="server-game/GMWW-Server/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          NSColor(calibratedRed: 0.02, green: 0.10, blue: 0.17, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x:0,y:0,width:1024,height:1024)).fill()
          let moon = NSBezierPath(ovalIn:NSRect(x:170,y:170,width:684,height:684))
          NSColor(calibratedRed:0.18,green:0.78,blue:0.92,alpha:1).setFill()
          moon.fill()
          image.unlockFocus()
          guard let tiff=image.tiffRepresentation,
                let rep=NSBitmapImageRep(data:tiff),
                let png=rep.representation(using:.png,properties:[:]) else { exit(1) }
          try png.write(to:URL(fileURLWithPath:CommandLine.arguments[1]))
          SWIFT
          swift /tmp/make_icon.swift "$ICONSET/icon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          mkdir -p "server-game/GMWW-Server/Assets.xcassets"
          cat > "server-game/GMWW-Server/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Build unsigned V2.12 app
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild             -project server-game/GMWW-Server.xcodeproj             -scheme GMWW-Server             -configuration Release             -sdk iphoneos             -derivedDataPath build-v2             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package and verify V2.12 IPA
        run: |
          set -euo pipefail
          APP="build-v2/Build/Products/Release-iphoneos/GMWW-Server.app"
          test -d "$APP"
          test -s "$APP/Web/GMWW.html"
          test -s "$APP/Web/app.js"
          test -s "$APP/Web/phu-thuy-gia-sea-display.webp"
          test -s "$APP/Web/phu-thuy-gia-sea-thumb.webp"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -q 'Quản Trò Ma Sói'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -q '2.12'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -q '212'
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload GMWW-V2.12-unsigned.ipa
          unzip -t GMWW-V2.12-unsigned.ipa >/dev/null
          unzip -l GMWW-V2.12-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/GMWW.html'
          unzip -l GMWW-V2.12-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/phu-thuy-gia-sea-display.webp'
          unzip -l GMWW-V2.12-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/phu-thuy-gia-sea-thumb.webp'

      - name: Upload V2.12 IPA
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-V2.12-IPA
          path: GMWW-V2.12-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
