name: Build Quản Trò Ma Sói V2 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server-game/**'
      - '.github/workflows/build-server-game-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V2 web bundle
        run: |
          set -euo pipefail
          APPDIR="server-game/GMWW-Server"
          mkdir -p "$APPDIR/Web"
          cp "$APPDIR/GMWW.html" "$APPDIR/Web/GMWW.html"
          test -s "$APPDIR/Web/GMWW.html"
          grep -q 'V2.02' "$APPDIR/Web/GMWW.html"
          grep -q 'PHÙ THUỶ GIÀ' "$APPDIR/Web/GMWW.html"
          grep -q 'LÁ BÀI' "$APPDIR/Web/GMWW.html"
          grep -q 'LÁ ARTIFACT' "$APPDIR/Web/GMWW.html"
          grep -q 'data:image/webp;base64,' "$APPDIR/Web/GMWW.html"

      - name: Generate App Icon
        run: |
          set -euo pipefail
          ICONSET="server-game/GMWW-Server/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          NSColor(calibratedRed: 0.02, green: 0.10, blue: 0.17, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x:0,y:0,width:1024,height:1024)).fill()
          let moon = NSBezierPath(ovalIn:NSRect(x:170,y:170,width:684,height:684))
          NSColor(calibratedRed:0.18,green:0.78,blue:0.92,alpha:1).setFill(); moon.fill()
          let head = NSBezierPath()
          head.move(to:NSPoint(x:512,y:185)); head.line(to:NSPoint(x:330,y:330)); head.line(to:NSPoint(x:250,y:700)); head.line(to:NSPoint(x:430,y:600)); head.line(to:NSPoint(x:512,y:820)); head.line(to:NSPoint(x:594,y:600)); head.line(to:NSPoint(x:774,y:700)); head.line(to:NSPoint(x:694,y:330)); head.close()
          NSColor(calibratedRed:0.03,green:0.12,blue:0.20,alpha:1).setFill(); head.fill()
          image.unlockFocus()
          guard let tiff=image.tiffRepresentation, let rep=NSBitmapImageRep(data:tiff), let png=rep.representation(using:.png,properties:[:]) else { exit(1) }
          try png.write(to:URL(fileURLWithPath:CommandLine.arguments[1]))
          SWIFT
          swift /tmp/make_icon.swift "$ICONSET/icon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          mkdir -p "server-game/GMWW-Server/Assets.xcassets"
          cat > "server-game/GMWW-Server/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Build unsigned V2.02 app
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild             -project server-game/GMWW-Server.xcodeproj             -scheme GMWW-Server             -configuration Release             -sdk iphoneos             -derivedDataPath build-v2             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP="build-v2/Build/Products/Release-iphoneos/GMWW-Server.app"
          test -d "$APP"
          test -s "$APP/Web/GMWW.html"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -q 'Quản Trò Ma Sói'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -q '2.02'
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Quan-Tro-Ma-Soi-V2.02-unsigned.ipa
          unzip -t Quan-Tro-Ma-Soi-V2.02-unsigned.ipa >/dev/null
          unzip -l Quan-Tro-Ma-Soi-V2.02-unsigned.ipa | grep -q 'Payload/GMWW-Server.app/Web/GMWW.html'

      - name: Upload V2.02 IPA
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-V2.02-IPA
          path: Quan-Tro-Ma-Soi-V2.02-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
