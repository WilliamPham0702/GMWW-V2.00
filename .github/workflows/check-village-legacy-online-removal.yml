name: Check Village Legacy Online Removal (focused)
on:
  pull_request:
    paths:
      - 'assets/village/index.html'
      - 'assets/village/village.mjs'
      - 'assets/village/village.css'
      - 'tests/village-remove-old-online-setup.test.mjs'
      - '.github/workflows/check-village-legacy-online-removal.yml'
  push:
    branches: [main]
    paths:
      - 'assets/village/index.html'
      - 'assets/village/village.mjs'
      - 'assets/village/village.css'
      - 'tests/village-remove-old-online-setup.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  village-legacy-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: No old Online controls or fake players; preserve live Player Web bridge
        run: |
          node --test tests/village-remove-old-online-setup.test.mjs tests/player-web-online-village-20261028.test.mjs
          node --check assets/village/village.mjs
          node --check assets/village/scene-manager.mjs
      - name: Worker build only - no Production or OTA release
        run: npm run check
