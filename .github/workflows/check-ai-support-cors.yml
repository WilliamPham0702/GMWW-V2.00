name: Check AI Support Production CORS
on:
  pull_request:
    paths:
      - "src/gmww-ai-support.js"
      - "wrangler.jsonc"
      - ".github/workflows/check-ai-support-cors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Worker CORS preflight without credentials
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gmww-v2-00.williampham0702.workers.dev"
          RESPONSE=$(curl -sS -o /dev/null -D /tmp/gmww-ai-preflight.headers --max-time 20 \
            -w '%{http_code}' -X OPTIONS \
            -H 'Origin: null' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$BASE/api/gm/ai-support/chat")
          test "$RESPONSE" = "204" || { echo "::error::AI preflight failed: HTTP $RESPONSE"; exit 1; }
          grep -iq '^access-control-allow-origin: \*' /tmp/gmww-ai-preflight.headers
          grep -iq '^access-control-allow-headers:.*authorization' /tmp/gmww-ai-preflight.headers
          echo 'Production AI Support preflight: PASS'
      - name: Verify unauthorized POST returns visible JSON and no secrets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gmww-v2-00.williampham0702.workers.dev"
          RESPONSE=$(curl -sS --max-time 20 -o /tmp/gmww-ai-unauth.json -D /tmp/gmww-ai-unauth.headers \
            -w '%{http_code}' -X POST \
            -H 'Origin: null' -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-test-only-no-private-token' \
            -d '{"message":"CORS regression request"}' \
            "$BASE/api/gm/ai-support/chat")
          test "$RESPONSE" = "401" || { echo "::error::AI unauthorized POST returned HTTP $RESPONSE"; exit 1; }
          grep -iq '^access-control-allow-origin: \*' /tmp/gmww-ai-unauth.headers
          grep -iq '^access-control-allow-headers:.*authorization' /tmp/gmww-ai-unauth.headers
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('/tmp/gmww-ai-unauth.json','utf8'));if(d.error!=='AI_SUPPORT_UNAUTHORIZED')process.exit(2);"
          echo 'Production AI Support unauthorized POST with CORS: PASS'
