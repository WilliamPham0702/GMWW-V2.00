name: Stage approved Player Web card-back artworks
on:
  push:
    branches:
      - fix/player-web-card-back-artworks-20261020
permissions:
  contents: write
jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[card backs staged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved transparent card illustrations
        env:
          ROLE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fe20c9d44-4d22-4b1f-8eb6-d0c596a74fc5/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAOWB_geuoTbg4Lgq-5c6o_XHBbh3CVGxrT7rtZYS1gdQ&exp=1792519433&osig=AAAAAAAAAAAAAAAAAAAAADxV0FeGN0H6WkzEQY_x7IfD4Whs5rKwslF_4Sd_smEQ&signer=media-rpc&token=AAIAAU0AJGUyMGM5ZDQ0LTRkMjItNGIxZi04ZWI2LWQwYzU5NmE3NGZjNQAAAAABoVp76ygI7KtQMUVkK8yASQiJeCBgpv4ZtC9W5_lrNB6x30p-ew&x-canva-quality=thumbnail"
          ARTIFACT_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F1e09d3cf-28d7-4a7a-addf-61ff65ba5bc6/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAMgCTvwwQGgqqvTfTMQreW_cfv0jpUvAIRnT_B3bKWzO&exp=1792516856&osig=AAAAAAAAAAAAAAAAAAAAAMzrHhLjEIF60wQiazLVrOKqPmDG02IbN5ibJXJN_zUm&signer=media-rpc&token=AAIAAU0AJDFlMDlkM2NmLTI4ZDctNGE3YS1hZGRmLTYxZmY2NWJhNWJjNgAAAAABoVpUmMAQ43DaXk6ZLbRX3KVLQJSZzI1RF2OWfQGe7dMR_FWQ4w&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p assets/card-backs
          curl --fail --location --retry 3 --silent --show-error "$ROLE_URL" -o assets/card-backs/role-card-back-v1.png
          curl --fail --location --retry 3 --silent --show-error "$ARTIFACT_URL" -o assets/card-backs/artifact-card-back-v1.png
          file assets/card-backs/*.png
          python3 - <<'PY'
          import struct
          for p in ['assets/card-backs/role-card-back-v1.png','assets/card-backs/artifact-card-back-v1.png']:
              with open(p,'rb') as f: b=f.read()
              if b[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit('Invalid PNG: '+p)
              w,h=struct.unpack('>II',b[16:24])
              if w<120 or h<180: raise SystemExit('Image too small: '+p)
              print(p, w,h, len(b))
          PY
      - name: Store immutable artwork files on staging branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-backs/role-card-back-v1.png assets/card-backs/artifact-card-back-v1.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(player): add approved role and artifact backs [card backs staged]"
          git push origin HEAD:fix/player-web-card-back-artworks-20261020
