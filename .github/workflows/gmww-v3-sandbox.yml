name: GMWW V3 Sandbox — Player Web iPhone Drag

on:
  push:
    branches:
      - experiment/gmww-auto-delivery-v3
    paths:
      - src/player-web-src/**
      - src/gmww-members-live.js
      - tests/player-web-v3-iframe-drag.test.mjs
      - .github/workflows/gmww-v3-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmww-v3-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-ci:
    name: V3 Sandbox CI (no production deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure deployed Player Web module matches source
        run: node .github/scripts/assemble-player-web.mjs --verify
      - name: Execute drag, online interaction and wolf decision regression
        run: |
          node --test \
            tests/player-web-v3-iframe-drag.test.mjs \
            tests/player-web-online-actions-20261028.test.mjs \
            tests/online-player-fire-turn-dead-ui-20261031.test.mjs \
            tests/player-web-wolf-ballots-20261101.test.mjs
      - name: Worker build without publishing
        run: npm run check
      - name: Verify independent STAGING resource bindings and dry-run build
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const stage=JSON.parse(fs.readFileSync('wrangler.v3-sandbox.jsonc','utf8'));
          const production=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(stage.name!=='gmww-v3-sandbox'||stage.name===production.name||
            stage.durable_objects?.bindings?.length!==1||
            stage.durable_objects.bindings[0].name!=='ROOMS'||
            stage.durable_objects.bindings[0].class_name!=='RoomDurableObject'||
            stage.durable_objects.bindings[0].script_name||
            stage.services||stage.kv_namespaces||stage.d1_databases||
            stage.r2_buckets||stage.routes||stage.route)throw Error('Unsafe STAGING binding or Production resource');
          console.log('V3 sandbox Worker has its own DO binding, no external Production references.');
          NODE
          npx --no-install wrangler deploy --config wrangler.v3-sandbox.jsonc --dry-run
      - name: Record sandbox validation
        run: |
          echo 'Sandbox CI passed; no changes to Production, Pages, IPA, or Runtime.' >> "$GITHUB_STEP_SUMMARY"

  publish-staging:
    name: Deploy independent V3 STAGING only
    needs: sandbox-ci
    if: ${{ needs.sandbox-ci.result == 'success' && github.ref == 'refs/heads/experiment/gmww-auto-delivery-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy ONLY gmww-v3-sandbox (separate DO storage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler deploy --config wrangler.v3-sandbox.jsonc
          echo 'Only gmww-v3-sandbox deployed. No Production, Pages, IPA or Runtime release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public STAGING health and deployed Player Web gesture code
        run: |
          set -euo pipefail
          BASE='https://gmww-v3-sandbox.williampham0702.workers.dev'
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 25 "$BASE/api/health" -o "$RUNNER_TEMP/gmww-v3-health.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gmww-v3-health.json','utf8'));
          if(health.ok!==true||health.status!=='online')throw Error('STAGING health is not online: '+JSON.stringify(health));
          console.log('STAGING health: '+JSON.stringify({ok:health.ok,status:health.status,version:health.version}));
          NODE
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 25 "$BASE/gmww-members-live.js" -o "$RUNNER_TEMP/gmww-v3-player.js"
          grep -q 'function gmwwOnlineTargetAt(x,y)' "$RUNNER_TEMP/gmww-v3-player.js"
          grep -q 'document.addEventListener('"'pointerup'"',end,true)' "$RUNNER_TEMP/gmww-v3-player.js"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 25 "$BASE/village/" -o "$RUNNER_TEMP/gmww-v3-village.html"
          test -s "$RUNNER_TEMP/gmww-v3-village.html"
          echo "Live STAGING health, Player Web drag code and village HTML: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING: $BASE/" >> "$GITHUB_STEP_SUMMARY"
