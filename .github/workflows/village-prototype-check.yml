name: Village Prototype Visual Gates
on:
  push:
    branches: [feature/village-scene-prototype-20261002]
    paths:
      - "prototype/village/**"
      - ".github/workflows/village-prototype-check.yml"
  workflow_dispatch:
jobs:
  visual-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check geometry and basic safety
        run: node prototype/village/village.test.mjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Browser smoke test (iPhone-sized emulation)
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/village-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/prototype/village/ >/dev/null; then break; fi
            sleep 1
          done
          node prototype/village/village.browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-mobile-visual-regression
          path: prototype/village/screenshots/
          if-no-files-found: ignore
      - name: Check local assets and module syntax
        run: |
          node --check prototype/village/village.mjs
          node --check prototype/village/village.test.mjs
          test -s prototype/village/assets/village-coast.svg
          test -s prototype/village/assets/avatar-chibi.svg
          test -s prototype/village/assets/campfire.svg
          test -s prototype/village/village-art.css
          grep -q 'village-art.css' prototype/village/index.html
          grep -q 'GMWW_VILLAGE_PLAYERS' prototype/village/village.mjs
          ! grep -R 'GM_SYNC_TOKEN' prototype/village/
