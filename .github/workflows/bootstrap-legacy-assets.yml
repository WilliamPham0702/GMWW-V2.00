name: Bootstrap GMWW Legacy Assets

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: Fresh signed URLs for the base64 chunks, in order
        required: true
        type: string
      expected_sha:
        description: Expected SHA256 for the reassembled ZIP
        required: true
        default: b9229b9b48f5fa3e63dfb831e0ac523cad0ec469d3e3b8c2dca59ef594616c36
        type: string

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble and verify legacy package
        env:
          URLS_JSON: ${{ inputs.urls_json }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, base64, hashlib, urllib.request, zipfile
          urls=json.loads(os.environ["URLS_JSON"])
          if len(urls)!=12:
              raise SystemExit(f"Expected 12 chunks, got {len(urls)}")
          out="GMWW-V2.52-legacy-assets-for-GitHub.zip"
          h=hashlib.sha256()
          with open(out,"wb") as dst:
              for i,url in enumerate(urls):
                  req=urllib.request.Request(url,headers={"User-Agent":"GMWW-GitHub-Actions"})
                  with urllib.request.urlopen(req,timeout=120) as r:
                      encoded=r.read()
                  raw=base64.b64decode(encoded)
                  dst.write(raw)
                  h.update(raw)
                  print(f"chunk {i+1}/12: {len(raw)} bytes")
          digest=h.hexdigest()
          expected=os.environ["EXPECTED_SHA"].strip().lower()
          if digest!=expected:
              raise SystemExit(f"SHA256 mismatch: {digest} != {expected}")
          if os.path.getsize(out)!=121940660:
              raise SystemExit(f"Unexpected archive size: {os.path.getsize(out)}")
          with zipfile.ZipFile(out) as z:
              bad=z.testzip()
              names=z.namelist()
              webps=sum(n.endswith(".webp") for n in names)
              manifest="server-game/legacy-assets/v252/role-artwork-v251.js"
              if bad is not None:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              if webps!=189 or manifest not in names:
                  raise SystemExit(f"Legacy package invalid: {webps} WebP, manifest={manifest in names}")
          print("Legacy package verified:",digest)
          PY

      - name: Upload package to stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload legacy-assets-v252             GMWW-V2.52-legacy-assets-for-GitHub.zip             --clobber             --repo "$GITHUB_REPOSITORY"

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view legacy-assets-v252 --repo "$GITHUB_REPOSITORY" --json assets
