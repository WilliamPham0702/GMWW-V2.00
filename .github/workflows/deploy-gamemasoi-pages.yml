name: Deploy GameMaSoi Pages Same-Origin Gateway Only
on:
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gmww-pages-alias
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy isolated Pages proxy (never GMWW Worker)
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CI-passed main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip unrelated main commits (preserve existing Pages deployment)
        id: pages_scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          FOUND=false
          while IFS= read -r FILE; do
            case "$FILE" in
              infra/pages/gamemasoi/*) FOUND=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          if [ "$FOUND" = false ]; then
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            echo 'No Pages files changed: SKIP Pages deploy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
      - name: Validate same-SHA CI SUCCESS and isolated diff
        if: steps.pages_scope.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")
          PASS=$(printf '%s' "$RUNS" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .name == "Check Player Web Worker")] | sort_by(.run_number) | last | .conclusion // "missing"')
          test "$PASS" = success || { echo "::error::Required main check not SUCCESS: $PASS"; exit 1; }
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          test -s "$RUNNER_TEMP/changed.txt"
          FOUND=false
          while IFS= read -r FILE; do
            case "$FILE" in
              infra/pages/gamemasoi/*) FOUND=true ;;
              tests/gamemasoi-pages-link.test.mjs|.github/workflows/deploy-gamemasoi-pages.yml|.github/workflows/deploy-production.yml|.github/workflows/github-runtime-ota.yml|.github/workflows/check-player-web.yml|.github/scripts/ci-browser-scope.mjs|docs/releases/GMWW-GAMEMASOI-PAGES-LINK-20261031.md) ;;
              *) echo "::error::Non-Pages commit; no deployment: $FILE"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          test "$FOUND" = true
      - name: Setup Node
        if: steps.pages_scope.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test same-origin proxy and isolation
        if: steps.pages_scope.outputs.should_deploy == 'true'
        run: node --test tests/gamemasoi-pages-link.test.mjs
      - name: Install existing Wrangler
        if: steps.pages_scope.outputs.should_deploy == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Snapshot previous Pages Production deployment for rollback
        id: previous_pages
        if: steps.pages_scope.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/gamemasoi")
          OLD=$(printf '%s' "$PROJECT" | jq -r '.result.latest_deployment.id // empty')
          test -n "$OLD"
          echo "deployment_id=$OLD" >> "$GITHUB_OUTPUT"
      - name: Deploy to gamemasoi Pages only
        if: steps.pages_scope.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          PROJECT=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/gamemasoi")
          BINDING=$(printf '%s' "$PROJECT" | jq -r '.result.deployment_configs.production.services.GMWW_SERVER.service // "missing"')
          test "$BINDING" = "gmww-v2-00" || { echo "::error::Production GMWW_SERVER service binding missing"; exit 1; }
          npx --no-install wrangler pages deploy infra/pages/gamemasoi --project-name=gamemasoi --branch=main --commit-hash="$(git rev-parse HEAD)"
      - name: Verify same-origin HTML, API and WebSocket entrypoint
        if: steps.pages_scope.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            ROOT=$(curl -sS -D - -o /dev/null --max-time 15 https://gamemasoi.pages.dev/ || true)
            CODE=$(printf '%s' "$ROOT" | tr -d '\r' | grep '^HTTP/' | tail -1 | awk '{print $2}')
            if [ "$CODE" = 200 ] && ! printf '%s' "$ROOT" | grep -iq '^location:'; then
              API=$(curl -fsS --max-time 15 https://gamemasoi.pages.dev/api/health || true)
              if printf '%s' "$API" | jq -e '.ok == true and .service == "GMWW Online"' >/dev/null 2>&1; then
                WS=$(curl -sS -D - -o /dev/null --max-time 15 https://gamemasoi.pages.dev/ws/ABCDEF || true)
                if printf '%s' "$WS" | tr -d '\r' | grep -Eq '^HTTP/[^ ]+ 426'; then
                  echo 'Same hostname HTML/API/WS gateway verified; no redirect.' >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            fi
            sleep 8
          done
          echo "::error::Pages gateway not verified; Worker Production remains untouched. Roll back Pages."
          exit 1
      - name: Roll back Pages only if gateway verification fails
        if: failure() && steps.previous_pages.outputs.deployment_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_DEPLOYMENT: ${{ steps.previous_pages.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/gamemasoi/deployments/$PREVIOUS_DEPLOYMENT/rollback"
          echo "Rolled back Pages to last deployment; GMWW Worker and DO unaffected." >> "$GITHUB_STEP_SUMMARY"
