name: Deploy GameMaSoi Pages Alias Only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gamemasoi-pages.yml'
  workflow_run:
    workflows: ["Check Player Web Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gmww-pages-alias
  cancel-in-progress: false

jobs:
  verify-live-redirect:
    name: Verify Pages HTTPS 302 (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check live Pages redirect
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/pages-headers -o /dev/null --max-time 20 https://gamemasoi.pages.dev/
          grep -Eq '^HTTP/[0-9.]+ 302' /tmp/pages-headers
          grep -Fqi 'location: https://gmww-v2-00.williampham0702.workers.dev/' /tmp/pages-headers
  deploy-pages:
    name: Deploy isolated Pages redirect (never GMWW Worker)
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CI-passed main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate same-SHA CI SUCCESS and isolated diff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")
          PASS=$(printf '%s' "$RUNS" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .name == "Check Player Web Worker")] | sort_by(.run_number) | last | .conclusion // "missing"')
          test "$PASS" = success || { echo "::error::Required main check not SUCCESS: $PASS"; exit 1; }
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          test -s "$RUNNER_TEMP/changed.txt"
          FOUND=false
          # The original PR661 deployment was blocked by shallow HEAD^1 checkout.
          # Permit one narrowly scoped CI-only recovery commit after PR661:
          # exactly this workflow file, unchanged Pages source and required same-SHA CI.
          if [ "$(cat "$RUNNER_TEMP/changed.txt")" = ".github/workflows/deploy-gamemasoi-pages.yml" ]; then
            git merge-base --is-ancestor a4e70133286ec89a6c00c9b7aae2586deb5b8afd HEAD
            git diff --quiet a4e70133286ec89a6c00c9b7aae2586deb5b8afd HEAD -- infra/pages/gamemasoi/ tests/gamemasoi-pages-link.test.mjs docs/releases/GMWW-GAMEMASOI-PAGES-LINK-20261031.md
            grep -Fxq '/ https://gmww-v2-00.williampham0702.workers.dev/ 302' infra/pages/gamemasoi/_redirects
            grep -Fxq '/* https://gmww-v2-00.williampham0702.workers.dev/:splat 302' infra/pages/gamemasoi/_redirects
            FOUND=true
            echo 'PR661 Pages unchanged: exact workflow-only shallow-fetch recovery' >> "$GITHUB_STEP_SUMMARY"
          else
            while IFS= read -r FILE; do
              case "$FILE" in
                infra/pages/gamemasoi/*) FOUND=true ;;
                tests/gamemasoi-pages-link.test.mjs|.github/workflows/deploy-gamemasoi-pages.yml|.github/workflows/deploy-production.yml|.github/workflows/github-runtime-ota.yml|docs/releases/GMWW-GAMEMASOI-PAGES-LINK-20261031.md) ;;
                *) echo "::error::Non-Pages commit; no deployment: $FILE"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/changed.txt"
          fi
          test "$FOUND" = true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safe redirect and auto-release isolation
        run: node --test tests/gamemasoi-pages-link.test.mjs
      - name: Install existing Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy to gamemasoi Pages only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler pages deploy infra/pages/gamemasoi --project-name=gamemasoi --branch=main --commit-hash="$(git rev-parse HEAD)"
      - name: Verify redirect to exact Worker URL
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -D - -o /dev/null --max-time 15 https://gamemasoi.pages.dev/ || true)
            if printf '%s' "$RESP" | tr -d '\r' | grep -Eq '^HTTP/[^ ]+ 302' && printf '%s' "$RESP" | tr -d '\r' | grep -Eiq '^location: https://gmww-v2-00[.]williampham0702[.]workers[.]dev/?$'; then
              echo 'Verified HTTPS Pages 302 to existing production Worker.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo "::error::Pages redirect not verified; old Worker remains unchanged"
          exit 1
 /tmp/pages-clean
          echo 'Pages live redirect verified (302); no game Worker modification.' >> "$GITHUB_STEP_SUMMARY"
  deploy-pages:
    name: Deploy isolated Pages redirect (never GMWW Worker)
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
