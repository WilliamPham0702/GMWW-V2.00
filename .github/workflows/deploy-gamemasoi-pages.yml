        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")
          PASS=$(printf '%s' "$RUNS" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .name == "Check Player Web Worker")] | sort_by(.run_number) | last | .conclusion // "missing"')
          test "$PASS" = success || { echo "::error::Required main check not SUCCESS: $PASS"; exit 1; }
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          test -s "$RUNNER_TEMP/changed.txt"
          FOUND=false
          # The original PR661 deployment was blocked by shallow HEAD^1 checkout.
          # Permit one narrowly scoped CI-only recovery commit after PR661:
          # exactly this workflow file, unchanged Pages source and required same-SHA CI.
          if [ "$(cat "$RUNNER_TEMP/changed.txt")" = ".github/workflows/deploy-gamemasoi-pages.yml" ]; then
            git merge-base --is-ancestor a4e70133286ec89a6c00c9b7aae2586deb5b8afd HEAD
            git diff --quiet a4e70133286ec89a6c00c9b7aae2586deb5b8afd HEAD -- infra/pages/gamemasoi/ tests/gamemasoi-pages-link.test.mjs docs/releases/GMWW-GAMEMASOI-PAGES-LINK-20261031.md
            grep -Fxq '/ https://gmww-v2-00.williampham0702.workers.dev/ 302' infra/pages/gamemasoi/_redirects
            grep -Fxq '/* https://gmww-v2-00.williampham0702.workers.dev/:splat 302' infra/pages/gamemasoi/_redirects
            FOUND=true
