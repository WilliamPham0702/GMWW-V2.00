name: "Kiểm tra 5 icon GM và Player Web #501"
on:
  push:
    branches: [main]
    paths:
      - "assets/village/village.mjs"
      - "server-game/current/app.js"
      - "server-game/current/GMWW.html"
      - "server-game/current/style.css"
      - "src/index.js"
      - "package.json"
      - ".github/workflows/check-gm-free-icons-501.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/village/village.mjs"
      - "server-game/current/GMWW.html"
      - "server-game/current/style.css"
      - "server-game/current/app.js"
      - "server-game/src/30-village-and-setup.part"
      - "server-game/src/40-battle-and-timeline.part"
      - "tests/gm-free-floating-shortcuts-20261025.test.mjs"
      - "tests/gm-free-floating-shortcuts-iphone-webkit.mjs"
      - "tests/v3188-preview-iphone-webkit.mjs"
      - "tests/gallows-flag-snap-v3206.test.mjs"
      - "tests/gallows-pirate-ui-v3205.test.mjs"
      - "docs/CHANGELOG_GM_FLOATING_ICONS_20261025.md"
      - ".github/workflows/check-gm-free-icons-501.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-icons:
    name: "5 icon, GM bundle và an toàn Runtime"
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phân loại thay đổi icon cho đúng phạm vi
        id: iconsscope
        env:
          GMWW_CI_EVENT: ${{ github.event_name }}
          GMWW_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-browser-scope.mjs
      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Cài đúng thư viện khóa
        run: npm ci
      - name: Kiểm tra cú pháp giao diện và độ sạch của bản vá
        run: |
          node --check server-game/current/app.js
          node --check assets/village/village.mjs
          git diff --check HEAD^ HEAD
      - name: Bắt buộc 6 module GM trùng khớp chính xác Runtime
        run: node .github/scripts/assemble-gm-app.mjs --verify
      - name: Chỉ kiểm 5 icon, kéo chạm thật và cờ đề cử giữ luật cũ
        if: steps.iconsscope.outputs.mode != 'gm-chrome-ios-viewport' && steps.iconsscope.outputs.mode != 'ci-policy' && steps.iconsscope.outputs.mode != 'manual-runtime' && steps.iconsscope.outputs.mode != 'fairy-triptych-3246' && steps.iconsscope.outputs.mode != 'fairy-audio-3242' && steps.iconsscope.outputs.mode != 'fairy-ci-policy' && steps.iconsscope.outputs.mode != 'icon-artwork' && steps.iconsscope.outputs.mode != 'icon-artwork-policy' && steps.iconsscope.outputs.mode != 'post-match-room-532' && steps.iconsscope.outputs.mode != 'postmatch-ci-532' && steps.iconsscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconsscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconsscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconsscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconsscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconsscope.outputs.mode != 'lobby-gather-541' && steps.iconsscope.outputs.mode != 'gm-player-web-share-637'
        run: |
          node --test tests/gm-free-floating-shortcuts-20261025.test.mjs \
            tests/gallows-flag-snap-v3206.test.mjs \
            tests/gallows-pirate-ui-v3205.test.mjs
      - name: Cài WebKit cho mô phỏng iPhone đúng phạm vi icon
        if: steps.iconsscope.outputs.mode != 'gm-chrome-ios-viewport' && steps.iconsscope.outputs.mode != 'ci-policy' && steps.iconsscope.outputs.mode != 'manual-runtime' && steps.iconsscope.outputs.mode != 'fairy-triptych-3246' && steps.iconsscope.outputs.mode != 'fairy-audio-3242' && steps.iconsscope.outputs.mode != 'fairy-ci-policy' && steps.iconsscope.outputs.mode != 'icon-artwork' && steps.iconsscope.outputs.mode != 'icon-artwork-policy' && steps.iconsscope.outputs.mode != 'post-match-room-532' && steps.iconsscope.outputs.mode != 'postmatch-ci-532' && steps.iconsscope.outputs.mode != 'entry-icons-3231' && steps.iconsscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconsscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconsscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconsscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconsscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconsscope.outputs.mode != 'lobby-gather-541' && steps.iconsscope.outputs.mode != 'gm-player-web-share-637'
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Kiểm tra icon nổi và DEMO chạm kéo trên iPhone WebKit
        if: steps.iconsscope.outputs.mode != 'gm-chrome-ios-viewport' && steps.iconsscope.outputs.mode != 'ci-policy' && steps.iconsscope.outputs.mode != 'manual-runtime' && steps.iconsscope.outputs.mode != 'fairy-triptych-3246' && steps.iconsscope.outputs.mode != 'fairy-audio-3242' && steps.iconsscope.outputs.mode != 'fairy-ci-policy' && steps.iconsscope.outputs.mode != 'icon-artwork' && steps.iconsscope.outputs.mode != 'icon-artwork-policy' && steps.iconsscope.outputs.mode != 'post-match-room-532' && steps.iconsscope.outputs.mode != 'postmatch-ci-532' && steps.iconsscope.outputs.mode != 'entry-icons-3231' && steps.iconsscope.outputs.mode != 'phase-dock-gallows-3234' && steps.iconsscope.outputs.mode != 'gm-ui-glass-3235' && steps.iconsscope.outputs.mode != 'gm-menu-gallows-3236' && steps.iconsscope.outputs.mode != 'gm-ui-menu-3237' && steps.iconsscope.outputs.mode != 'gm-ui-controls-3238' && steps.iconsscope.outputs.mode != 'lobby-gather-541' && steps.iconsscope.outputs.mode != 'gm-player-web-share-637'
        run: |
          node tests/gm-free-floating-shortcuts-iphone-webkit.mjs
          node tests/v3188-preview-iphone-webkit.mjs
      - name: Lưu ảnh QA 5 icon trên iPhone WebKit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-PR501-IPHONE-WEBKIT-PREVIEW-NO-DEPLOY
          path: /tmp/gmww-pr501-iphone-webkit-icons.png
          if-no-files-found: ignore
          retention-days: 14
      - name: SHA-256 bốn file thực tế và kiểm tra lại hash
        run: |
          sha256sum server-game/current/app.js \
            server-game/current/GMWW.html \
            server-game/current/style.css \
            assets/village/village.mjs > gmww-pr501-ui.sha256
          sha256sum --check gmww-pr501-ui.sha256
      - name: Xuất bằng chứng PR501, không phát hành
        uses: actions/upload-artifact@v4
        with:
          name: GMWW-PR501-UI-SHA256-NO-DEPLOY
          path: |
            gmww-pr501-ui.sha256
            docs/CHANGELOG_GM_FLOATING_ICONS_20261025.md
          if-no-files-found: error
          retention-days: 14
      - name: Kiểm tra release notes và không đổi số phiên bản
        if: steps.iconsscope.outputs.mode != 'gm-chrome-ios-viewport' && steps.iconsscope.outputs.mode != 'ci-policy'
        run: |
          test -s docs/CHANGELOG_GM_FLOATING_ICONS_20261025.md
          node .github/scripts/verify-gmww-versions.mjs
