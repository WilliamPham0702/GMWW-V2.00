name: Arena 3D GĐ7 — kiểm thử đúng phạm vi
on:
  push:
    branches: ["feature/arena3d-stage7-expressions-motion"]
    paths:
      - "assets/village/arena-3d/**"
      - "tests/arena3d-stage7-*"
      - ".github/workflows/arena3d-stage7-research.yml"
  pull_request:
    branches: ["feature/arena3d-stage6-art-motion-ritual"]
    paths:
      - "assets/village/arena-3d/**"
      - "tests/arena3d-stage7-*"
      - ".github/workflows/arena3d-stage7-research.yml"
  workflow_dispatch:
    inputs:
      deploy_stage7:
        description: 'Triển khai STAGING riêng GĐ7 sau khi CI đạt'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-stage7:
    name: "GĐ7: biểu cảm, animation, hiệu năng"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Kiểm tra cú pháp module liên quan"
        run: |
          node --check assets/village/arena-3d/stage7-expression-motion.mjs
          node --check assets/village/arena-3d/character-atelier.mjs
          node --check assets/village/arena-3d/live.mjs
      - name: "Kiểm thử GĐ7 và chuyển động phép"
        run: |
          node --test tests/arena3d-stage7-expression.test.mjs tests/arena3d-casting.test.mjs tests/arena3d-ritual-walk.test.mjs
      - name: "Chỉ dry-run cấu hình STAGING, tuyệt đối không deploy"
        run: npx wrangler deploy --config wrangler.arena3d-stage7-staging.jsonc --dry-run

  deploy-stage7-preview:
    name: "GĐ7: STAGING riêng + browser iPhone"
    needs: verify-stage7
    if: github.ref == 'refs/heads/feature/arena3d-stage7-expressions-motion' && github.event_name == 'workflow_dispatch' && inputs.deploy_stage7 == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Deploy Worker nghiên cứu STAGING, không Production"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.arena3d-stage7-staging.jsonc
      - name: "Kiểm thử trực tiếp 6–30 Character và nghi lễ"
        run: |
          npm install --no-save playwright@1.58.2
          node tests/arena3d-stage6-browser.mjs
      - name: "WebKit giả lập iPhone"
        run: |
          npx playwright install --with-deps webkit
          node tests/arena3d-phase3-webkit.mjs
      - name: "Ghi nhận Preview GĐ7"
        run: |
          echo "Preview GĐ7: https://gmww-arena3d-stage7-staging.williampham0702.workers.dev/village/arena-3d/live.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Chưa phải kiểm thử FPS/pin/nhiệt trên iPhone vật lý. Không Production." >> "$GITHUB_STEP_SUMMARY"
