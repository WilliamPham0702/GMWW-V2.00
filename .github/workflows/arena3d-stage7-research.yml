name: Arena 3D GĐ7 — kiểm thử đúng phạm vi
on:
  push:
    branches: ["feature/arena3d-stage7-expressions-motion"]
    paths:
      - "assets/village/arena-3d/**"
      - "tests/arena3d-stage7-*"
      - ".github/workflows/arena3d-stage7-research.yml"
  pull_request:
    branches: ["feature/arena3d-stage6-art-motion-ritual"]
    paths:
      - "assets/village/arena-3d/**"
      - "tests/arena3d-stage7-*"
      - ".github/workflows/arena3d-stage7-research.yml"
  workflow_dispatch:
    inputs:
      deploy_stage7:
        description: 'Triển khai STAGING riêng GĐ7 sau khi CI đạt'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-stage7:
    name: "GĐ7: biểu cảm, animation, hiệu năng"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Kiểm tra cú pháp module liên quan"
        run: |
          node --check assets/village/arena-3d/stage7-expression-motion.mjs
          node --check assets/village/arena-3d/character-atelier.mjs
          node --check assets/village/arena-3d/live.mjs
          node --check tests/arena3d-stage7-browser.mjs
      - name: "Kiểm thử GĐ7 và chuyển động phép"
        run: |
          node --test tests/arena3d-stage7-expression.test.mjs tests/arena3d-casting.test.mjs tests/arena3d-ritual-walk.test.mjs
      - name: "Chỉ dry-run cấu hình STAGING, tuyệt đối không deploy"
        run: npx wrangler deploy --config wrangler.arena3d-stage7-staging.jsonc --dry-run

  deploy-stage7-preview:
    name: "GĐ7: STAGING riêng + browser iPhone"
    needs: verify-stage7
    if: github.ref == 'refs/heads/feature/arena3d-stage7-expressions-motion' && github.event_name == 'workflow_dispatch' && inputs.deploy_stage7 == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Deploy Worker nghiên cứu STAGING, không Production"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          export DEPLOY_STARTED_MS="$(node -p 'Date.now()')"
          set +e
          npx wrangler deploy --config wrangler.arena3d-stage7-staging.jsonc 2>&1 | tee /tmp/arena3d-stage7-wrangler.log
          WRANGLER_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$WRANGLER_EXIT" -ne 0 ] && ! grep -q 'code: 10007' /tmp/arena3d-stage7-wrangler.log; then
            echo "Wrangler thất bại trước khi có xác nhận Cloudflare"
            exit "$WRANGLER_EXIT"
          fi
          CF_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gmww-arena3d-stage7-staging"
          curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_URL/deployments" > /tmp/arena3d-stage7-deployments.json
          node -e '
            const data=require("/tmp/arena3d-stage7-deployments.json");
            const item=data.result?.deployments?.[0];
            const started=Number(process.env.DEPLOY_STARTED_MS);
            if(!data.success||!item||Date.parse(item.created_on)<started-10000||
              !item.versions?.some(v=>v.percentage===100))
              throw Error("Cloudflare chưa xác nhận triển khai Worker GĐ7 mới nhất");
            console.log("Cloudflare đã xác nhận version GĐ7:",item.versions[0].version_id);
          '
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true,"previews_enabled":false}' "$CF_URL/subdomain" > /tmp/arena3d-stage7-subdomain.json
          node -e '
            const data=require("/tmp/arena3d-stage7-subdomain.json");
            if(!data.success||data.result?.enabled!==true)
              throw Error("Chưa bật được workers.dev cho riêng GĐ7");
            console.log("workers.dev GĐ7 đã bật; Production và GĐ6 không thay đổi");
          '
      - name: "Chuẩn bị trình duyệt Chrome và WebKit giả lập iPhone"
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: "Kiểm thử STAGING GĐ7: 6–30 Character, nghi lễ, Chrome và WebKit"
        run: node tests/arena3d-stage7-browser.mjs
      - name: "Ghi nhận Preview GĐ7"
        run: |
          echo "Preview GĐ7: https://gmww-arena3d-stage7-staging.williampham0702.workers.dev/village/arena-3d/live.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Chưa phải kiểm thử FPS/pin/nhiệt trên iPhone vật lý. Không Production." >> "$GITHUB_STEP_SUMMARY"
