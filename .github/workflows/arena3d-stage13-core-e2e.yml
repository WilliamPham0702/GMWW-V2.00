name: Arena 3D GĐ13 — kiểm thử riêng Core hai client
on:
  pull_request:
    branches: ["feature/arena3d-stage10-role-animation-library"]
    paths:
      - "tests/arena3d-stage13-core-e2e.mjs"
      - ".github/workflows/arena3d-stage13-core-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage13-core:
    name: "GĐ13: tái hiện lỗi Phát Vai/đồng bộ ván, KHÔNG deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Cài Chrome Playwright, không tải WebKit vì không liên quan lỗi"
        run: npm install --no-save playwright@1.58.2
      - name: "Test Core thật 2 clients ở GĐ11 STAGING, không Production"
        run: node tests/arena3d-stage13-core-e2e.mjs
